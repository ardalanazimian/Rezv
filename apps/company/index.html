     برمی‌گردد — یعنی افزودنِ env() بدونِ این خط یک رفعِ قلابیِ بی‌اثر است.
     این دو با هم معنا دارند: cover صفحه را تا لبه می‌برد، env() عناصرِ ثابت
     را از ناچ/نوارِ خانه دور نگه می‌دارد. (ممیزیِ UI/UX ۲۰۲۶-۰۸-۲۴) -->

<!-- ── پنل company: ماژول‌های Vanilla JS (ترتیب مهم) ── -->
<script>
// ── آدرسِ APIِ قابلِ‌تنظیم بدونِ build (۲۰۲۶-۰۸-۲۶) ──
// چرا: پنل استاتیک است و پیش‌فرضِ api-core «same-origin» — پشتِ nginxِ
// استقرار درست است، ولی هر سروِ استاتیکِ دیگر (serve محلی، بسته‌ی آفلاین
// رویِ یک بک‌اندِ واقعی) POST را با 405 برمی‌گرداند و ورود ناممکن می‌شود.
// یک‌بار «?api=http://host:port» به URL بده تا ذخیره شود؛ «?api=» خالی
// پاکش می‌کند. بدونِ آن هیچ رفتاری عوض نمی‌شود (localStorage خالی = همان
// same-origin). try/catch برای حالتِ خصوصیِ مرورگر.
(function(){try{
  var q=new URLSearchParams(location.search);
  if(q.has('api')){var v=q.get('api')||'';v?localStorage.setItem('rz_api_base',v):localStorage.removeItem('rz_api_base');}
  var s=localStorage.getItem('rz_api_base');
  if(s) window.RZ_API_BASE=s;
}catch(e){}})();
</script>
