// ─── تب ساعات کاری + تعطیلات (وصل به GET/PUT /restaurant/hours واقعی) ───
// کلید هر روز مطابق قرارداد بک‌اند: getDay() جاوااسکریپت (۰=یکشنبه ... ۶=شنبه).
// ترتیب نمایش برای کاربر ایرانی: شنبه تا جمعه.
const HOURS_DOW_ORDER=[6,0,1,2,3,4,5];
const HOURS_DOW_FA={0:'یکشنبه',1:'دوشنبه',2:'سه‌شنبه',3:'چهارشنبه',4:'پنجشنبه',5:'جمعه',6:'شنبه'};
// ⚠️ بازطراحی‌شده (Part 3 — تأییدِ ساعتِ کاری، ۲۰۲۶-۰۸-۱۴): PUT /restaurant/hours
// دیگر ساعتِ زنده را مستقیم نمی‌نویسد (رجوع کن به توضیحِ همان route) — پس این
// فرم هم دیگر روی opening_hours (زنده) ادیت نمی‌کند. یک draft جداگانه اضافه
// شد که کاربر رویش کار می‌کند و با «ارسال» به‌عنوانِ پیشنهاد می‌رود؛
// opening_hours فقط برای نمایشِ مرجعِ «چیزی که مشتری الان می‌بیند» می‌ماند.
let HOURS_STATE={opening_hours:null,pending_opening_hours:null,hours_change_status:null,hours_change_reason:null,timezone:'Asia/Tehran',closures:[],draft:null};
let _hoursLoaded=false, _hoursDirty=false;

async function loadHours(){
  if(!API.getToken()) return;
  const res=await API.hoursGet();
  if(res.ok && res.data){
    const d=res.data;
    HOURS_STATE={
      opening_hours: d.opening_hours||{},
      pending_opening_hours: d.pending_opening_hours||null,
      hours_change_status: d.hours_change_status||null,
      hours_change_reason: d.hours_change_reason||null,
      timezone: d.timezone||'Asia/Tehran',
      closures: d.closures||[],
      // اگه پیشنهادی در جریانه (pending یا rejected)، فرم از رویِ همون پیشنهاد
      // باز می‌شه — کاربر داره رویِ پیشنهادِ خودش ادامه می‌ده، نه از ساعتِ
      // زنده‌ی قدیمی دوباره شروع می‌کنه.
      draft: JSON.parse(JSON.stringify(d.pending_opening_hours || d.opening_hours || {})),
    };
    _hoursLoaded=true; _hoursDirty=false;
  }
}
/** خلاصه‌ی متنیِ فشرده‌ی یک openingHours — برای نمایشِ مرجعِ «ساعتِ زنده». */
function formatHoursCompact(oh){
  oh=oh||{};
  return HOURS_DOW_ORDER.map(d=>{
    const shifts=oh[d];
    if(!Array.isArray(shifts)) return `${HOURS_DOW_FA[d]}: —`;
    if(!shifts.length) return `${HOURS_DOW_FA[d]}: تعطیل`;
    return `${HOURS_DOW_FA[d]}: ${shifts.map(s=>`${esc(s[0])}–${esc(s[1])}`).join('،')}`;
  }).join(' · ');
}
function hoursStatusBannerHTML(){
  if(HOURS_STATE.hours_change_status==='pending'){
    return `<div class="cash-note">${icon('clock',{size:14})} پیشنهادِ تغییرِ ساعتِ کاری در انتظارِ تأییدِ شرکته — تا اون‌موقع مشتری‌ها همچنان ساعتِ کاریِ فعلی (پایین) رو می‌بینن.</div>`;
  }
  if(HOURS_STATE.hours_change_status==='rejected'){
    return `<div style="background:var(--red-50);border:1px solid #FECACA;border-radius:12px;padding:12px 16px;font-size:13px;color:#B91C1C;margin-bottom:20px;display:flex;align-items:flex-start;gap:8px">
      <span style="margin-top:1px">${icon('alert',{size:14})}</span>
      <div><div style="font-weight:700;margin-bottom:2px">پیشنهادِ قبلی رد شد</div>${HOURS_STATE.hours_change_reason?esc(HOURS_STATE.hours_change_reason):'دلیلی ثبت نشده'}<div style="margin-top:4px;font-size:12px;color:#991B1B">پایین ویرایش کن و دوباره برای تأیید بفرست.</div></div>
    </div>`;
  }
  return '';
}
function profRenderHours(){
  const el=document.getElementById('pt-hours'); if(!el) return;
  if(!API.getToken()){ el.innerHTML=`<div class="panel" style="text-align:center;padding:40px;color:var(--t2)">ویرایش ساعات کاری به اتصال بک‌اند نیاز دارد — در حالت دمو در دسترس نیست.</div>`; return; }
  const oh=HOURS_STATE.draft||{};
  el.innerHTML=`
    ${hoursStatusBannerHTML()}
    <div class="panel">
      <div class="panel-head"><div><div class="panel-title">ساعات کاری هفتگی</div><div class="panel-sub">${HOURS_STATE.hours_change_status?'این فرم پیشنهادِ توئه — بعد از ارسال باید شرکت تأیید کنه تا زنده بشه':'هر روز می‌تواند چند شیفت (مثلاً ناهار/شام) داشته باشد'}</div></div>
        <button class="btn btn-primary btn-sm" onclick="saveHours()">${icon('checkCircle',{size:14})} ارسالِ پیشنهاد برای تأیید</button></div>
      ${HOURS_STATE.hours_change_status?`<div style="background:var(--green-50);border:1px solid #BBF7D0;border-radius:12px;padding:10px 14px;font-size:12px;color:#15803D;margin:0 0 16px">
        <div style="font-weight:700;margin-bottom:3px">${icon('check',{size:12})} ساعتِ کاریِ زنده (چیزی که مشتری الان می‌بینه)</div>${formatHoursCompact(HOURS_STATE.opening_hours)}
      </div>`:''}
      ${HOURS_DOW_ORDER.map(d=>{
        const shifts=oh[d]||[];
        const isOpen=Array.isArray(oh[d]);
        return `<div class="staff-row" style="align-items:flex-start;flex-wrap:wrap">
          <div style="flex:1;min-width:110px;font-size:13px;font-weight:700;padding-top:8px">${HOURS_DOW_FA[d]}</div>
          <button class="toggle ${isOpen?'on':'off'}" onclick="toggleHoursDay(${d})" style="margin-top:4px"></button>
          <div style="flex-basis:100%;height:0"></div>
          <div style="flex:1;min-width:220px">
            ${isOpen?(shifts.length?shifts.map((s,i)=>`
              <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
                <input class="inp" style="width:auto" type="time" value="${esc(s[0])}" onchange="updateHoursShift(${d},${i},0,this.value)">
                <span style="color:var(--t3)">تا</span>
                <input class="inp" style="width:auto" type="time" value="${esc(s[1])}" onchange="updateHoursShift(${d},${i},1,this.value)">
                <button class="btn btn-ghost btn-sm" onclick="removeHoursShift(${d},${i})">حذف</button>
              </div>`).join(''):'<div style="font-size:12px;color:var(--t3);margin-top:8px">شیفتی ثبت نشده</div>')+
              (isOpen?`<button class="btn btn-ghost btn-sm" style="margin-top:8px" onclick="addHoursShift(${d})">+ افزودن شیفت</button>`:'')
            :'<div style="font-size:12px;color:var(--t3);margin-top:8px">تعطیل</div>'}
          </div>
        </div>`;
      }).join('')}
    </div>
    <div class="panel">
      <div class="panel-head"><div><div class="panel-title">تعطیلات خاص</div><div class="panel-sub">مثلاً روزهای بازسازی یا تعطیلات رسمی که با روز هفته فرق دارند</div></div></div>
      <div style="display:flex;gap:8px;margin-bottom:14px">
        <input class="inp" id="closureDate" type="date">
        <input class="inp" id="closureReason" placeholder="دلیل (اختیاری)">
        <button class="btn btn-primary btn-sm" onclick="addClosure()">افزودن</button>
      </div>
      ${HOURS_STATE.closures.length?HOURS_STATE.closures.map((c,i)=>`
        <div class="staff-row">
          <div style="flex:1"><div style="font-size:13px;font-weight:700">${esc(c.date)}</div>${c.reason?`<div style="font-size:12px;color:var(--t2)">${esc(c.reason)}</div>`:''}</div>
          <button class="btn btn-ghost btn-sm" onclick="removeClosure(${i})">حذف</button>
        </div>`).join(''):'<div style="text-align:center;color:var(--t2);font-size:12.5px;padding:16px">تعطیلی خاصی ثبت نشده</div>'}
    </div>`;
}
// ⚠️ Part 3: این چهار تابع دیگر opening_hours (زنده) را دستکاری نمی‌کنند —
// روی HOURS_STATE.draft کار می‌کنند تا ادیت هیچ‌وقت مستقیم ساعتِ زنده را
// عوض نکند (فقط «ارسالِ پیشنهاد» در saveHours آن را می‌فرستد).
function toggleHoursDay(d){
  const oh=HOURS_STATE.draft=HOURS_STATE.draft||{};
  if(Array.isArray(oh[d])) delete oh[d]; else oh[d]=[['12:00','23:00']];
  _hoursDirty=true; profRenderHours();
}
function addHoursShift(d){ (HOURS_STATE.draft[d]=HOURS_STATE.draft[d]||[]).push(['12:00','23:00']); _hoursDirty=true; profRenderHours(); }
function removeHoursShift(d,i){ HOURS_STATE.draft[d]?.splice(i,1); _hoursDirty=true; profRenderHours(); }
function updateHoursShift(d,i,pos,val){ if(HOURS_STATE.draft[d]?.[i]){ HOURS_STATE.draft[d][i][pos]=val; _hoursDirty=true; } }
function addClosure(){
  const date=document.getElementById('closureDate')?.value;
  const reason=document.getElementById('closureReason')?.value.trim();
  if(!date){ toast('','یه تاریخ انتخاب کن'); return; }
  if(HOURS_STATE.closures.some(c=>c.date===date)){ toast('','این تاریخ قبلاً اضافه شده'); return; }
  HOURS_STATE.closures.push({date,reason:reason||null});
  _hoursDirty=true; profRenderHours();
}
function removeClosure(i){ HOURS_STATE.closures.splice(i,1); _hoursDirty=true; profRenderHours(); }
async function saveHours(){
  if(!API.getToken()){ toast('','برای ذخیره باید وارد شده باشی'); return; }
  // ⚠️ Part 3: این دیگر «ذخیره‌ی زنده» نیست — پیشنهاد می‌فرستد. بک‌اند
  // (PUT /restaurant/hours) خودش pending می‌سازد، اینجا فقط draft را می‌فرستد.
  const res=await API.hoursSave({opening_hours:HOURS_STATE.draft, closures:HOURS_STATE.closures});
  if(res.ok){
    _hoursDirty=false;
    toast('','پیشنهادِ ساعتِ کاری برایِ تأییدِ شرکت ارسال شد — تا تأیید نشه چیزی برایِ مشتری عوض نمی‌شه');
    await loadHours(); profRenderHours(); // تازه‌سازی برای نمایشِ بنرِ «در انتظار تأیید»
  }
  else{ toast('', res.error?.message||'ارسال ناموفق بود'); }
}

// ─── تب سیاستِ کنسلی (وصل به GET/PUT /restaurant/cancellation-policy واقعی) ───
// این فقط لایه‌ی پایه‌ست — لایه‌هایِ دینامیک (تقاضایِ بالا، رویدادِ ویژه،
// سطحِ اعتبارِ مشتری، abuse) خودکار و سمتِ بک‌اند (lib/cancellation-policy.ts
// → resolvePolicy) روی همین پایه اعمال می‌شن، اینجا فقط پیکربندیِ پایه رو
// می‌بینی/عوض می‌کنی.
let CANCEL_POLICY_STATE={free_cancel_hours:24,partial_penalty_hours:2,partial_penalty_pct:50,deposit_required:false,auto_confirm:true,is_customized:false};
let _cancelPolicyDirty=false;

async function loadCancellationPolicy(){
  if(!API.getToken()) return;
  const res=await API.cancellationPolicyGet();
  if(res.ok && res.data){ CANCEL_POLICY_STATE={...res.data}; _cancelPolicyDirty=false; }
}

function profRenderCancellationPolicy(){
  const el=document.getElementById('pt-cancellation'); if(!el) return;
  if(!API.getToken()){ el.innerHTML=`<div class="panel" style="text-align:center;padding:40px;color:var(--t2)">ویرایشِ سیاستِ کنسلی به اتصالِ بک‌اند نیاز دارد — در حالتِ دمو در دسترس نیست.</div>`; return; }

  el.innerHTML=`
    <div class="panel">
      <div class="panel-head"><div><div class="panel-title">سیاستِ کنسلی</div><div class="panel-sub">${s.is_customized?'پیکربندیِ اختصاصیِ این رستوران':'در حالِ استفاده از پیش‌فرضِ پلتفرم'}</div></div>
        <button class="btn btn-primary btn-sm" onclick="saveCancellationPolicy()">ذخیره</button></div>

      <div class="staff-row">
        <div style="flex:1"><div style="font-size:13px;font-weight:700">پنجره‌ی کنسلیِ آزاد (ساعت)</div><div style="font-size:12px;color:var(--t2)">تا این‌قدر ساعت قبل از رزرو، کنسلی بدونِ جریمه‌ست</div></div>
        <input class="inp" style="width:80px" type="number" min="0" max="720" value="${esc(s.free_cancel_hours)}" onchange="updateCancelPolicyField('free_cancel_hours',this.value)">
      </div>
      <div class="staff-row">
        <div style="flex:1"><div style="font-size:13px;font-weight:700">آستانه‌ی جریمه‌یِ جزئی (ساعت)</div><div style="font-size:12px;color:var(--t2)">بینِ این و پنجره‌ی آزاد، جریمه‌ی جزئی اعمال می‌شه</div></div>
        <input class="inp" style="width:80px" type="number" min="0" max="720" value="${esc(s.partial_penalty_hours)}" onchange="updateCancelPolicyField('partial_penalty_hours',this.value)">
      </div>
      <div class="staff-row">
        <div style="flex:1"><div style="font-size:13px;font-weight:700">درصدِ جریمه‌یِ جزئی</div><div style="font-size:12px;color:var(--t2)">درصدی از بیعانه که در این بازه کسر می‌شه</div></div>
        <input class="inp" style="width:80px" type="number" min="0" max="100" value="${esc(s.partial_penalty_pct)}" onchange="updateCancelPolicyField('partial_penalty_pct',this.value)">
      </div>
      <div class="staff-row">
        <div style="flex:1"><div style="font-size:13px;font-weight:700">بیعانه اجباری باشه</div><div style="font-size:12px;color:var(--t2)">مستقل از این، در تقاضایِ بالا/مشتریِ پرریسک خودکار فعال می‌شه</div></div>
        <button class="toggle ${s.deposit_required?'on':'off'}" onclick="toggleCancelPolicyField('deposit_required')"></button>
      </div>
      <div class="staff-row">
        <div style="flex:1"><div style="font-size:13px;font-weight:700">تأییدِ خودکارِ رزرو</div><div style="font-size:12px;color:var(--t2)">خاموش یعنی همه‌ی رزروها منتظرِ تأییدِ دستیِ تو می‌مونن</div></div>
        <button class="toggle ${s.auto_confirm?'on':'off'}" onclick="toggleCancelPolicyField('auto_confirm')"></button>
      </div>
    </div>`;
}
function updateCancelPolicyField(key,val){ CANCEL_POLICY_STATE[key]=Number(val)||0; _cancelPolicyDirty=true; }
function toggleCancelPolicyField(key){ CANCEL_POLICY_STATE[key]=!CANCEL_POLICY_STATE[key]; _cancelPolicyDirty=true; profRenderCancellationPolicy(); }
async function saveCancellationPolicy(){
  if(!API.getToken()){ toast('','برای ذخیره باید وارد شده باشی'); return; }
  const s=CANCEL_POLICY_STATE;
  if(Number(s.partial_penalty_hours)>Number(s.free_cancel_hours)){ toast('','آستانه‌ی جریمه‌ی جزئی نمی‌تونه از پنجره‌ی آزاد بزرگ‌تر باشه'); return; }
  const res=await API.cancellationPolicySave({
    free_cancel_hours:Number(s.free_cancel_hours), partial_penalty_hours:Number(s.partial_penalty_hours),
    partial_penalty_pct:Number(s.partial_penalty_pct), deposit_required:!!s.deposit_required, auto_confirm:!!s.auto_confirm,
  });
  if(res.ok){ CANCEL_POLICY_STATE={...res.data}; _cancelPolicyDirty=false; toast('','سیاستِ کنسلی ذخیره شد'); profRenderCancellationPolicy(); }
  else{ toast('', res.error?.message||'ذخیره ناموفق بود'); }
}

// ─── drilldown تک‌مشتری (وصل به /restaurant/customers/:userId واقعی) ───
async function openCustomerDetail(userId){
  openModal(`<div style="text-align:center;padding:40px;color:var(--t2)">در حال بارگذاری پروفایل...</div>`);
  const res=await API.customerDetail(userId);
  if(!res.ok){
    openModal(`<div class="modal-title">خطا</div><div class="modal-sub">${res.status===404?'سابقه‌ای برای این مشتری ثبت نشده':'اتصال به سرور برقرار نشد'}</div><div style="margin-top:16px"><button class="btn btn-ghost" onclick="closeModal()">بستن</button></div>`);
    return;
  }

        ${icon('alert',{size:13})}
        هیچ آیتمِ <b>فعالی</b> در منو نیست، پس صفحه‌ی عمومی فعلاً خالی نشان داده می‌شود.
        قبل از چاپِ QR دستِ‌کم یک آیتم را فعال کن.
      </div>` : ''}

    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap">
      <input class="inp" id="menuPubUrl" readonly value="${esc(MENU_PUBLIC_URL)}" style="flex:1;min-width:200px;direction:ltr;text-align:left">
      <button class="btn btn-sm btn-ghost" onclick="menuCopyUrl()">${icon('copy',{size:14})} کپی</button>
      <a class="btn btn-sm btn-ghost" href="${esc(MENU_PUBLIC_URL)}" target="_blank" rel="noopener">پیش‌نمایش</a>
    </div>

    <div id="menuQrBox" style="text-align:center;padding:12px 0">
      <button class="btn btn-primary btn-sm" onclick="menuLoadQr()">ساختنِ QR</button>
    </div>

    <div style="border-top:1px solid var(--line,#e6e8ec);margin-top:12px;padding-top:12px">
      <div class="panel-title" style="font-size:14px;margin-bottom:2px">ظاهرِ صفحه‌ی منو</div>
      <div class="panel-sub" style="margin-bottom:10px">
        این تنظیمات مالِ خودِ شماست و بدونِ تأییدِ رزرونو اعمال می‌شود.
      </div>
      <div id="menuBrandBox">
        <button class="btn btn-sm btn-ghost" onclick="menuLoadBranding()">تنظیمِ رنگ و ظاهر</button>
      </div>
    </div>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════════
//  شخصی‌سازیِ صفحه‌ی منو — رنگِ برند، روشن/تیره، خطِ معرفی، چیدمان.
//  مقادیرِ مجاز از خودِ سرور می‌آیند (`options`)، نه فهرستِ هاردکد اینجا،
//  تا با تغییرِ سرور از هم نیفتند.
// ═══════════════════════════════════════════════════════════════════════
let MENU_BRAND = null;

const BRAND_THEME_LABEL = { light: 'روشن', dark: 'تیره', auto: 'خودکار (ترجیحِ مهمان)' };
const BRAND_LAYOUT_LABEL = { list: 'فهرستی', grid: 'شبکه‌ای (عکس‌محور)' };

async function menuLoadBranding(){
  const box = document.getElementById('menuBrandBox');
  if(!box) return;
  box.innerHTML = `<div style="color:var(--t2);font-size:13px">در حال بارگیری…</div>`;
  const res = await API.menuBranding();
  if(!res.ok){
    box.innerHTML = `<div style="color:var(--t2);font-size:13px;margin-bottom:8px">${esc(res.offline?'اتصال به سرور برقرار نیست.':(res.error?.message||'بارگیری نشد.'))}</div>
      <button class="btn btn-sm btn-ghost" onclick="menuLoadBranding()">تلاش دوباره</button>`;
    return;
  }
  MENU_BRAND = res.data;
  menuBrandRender();
}

function menuBrandRender(){
  const box = document.getElementById('menuBrandBox');
  if(!box || !MENU_BRAND) return;
  const b = MENU_BRAND;
  const themes = (b.options?.themes) || ['light','dark','auto'];
  const layouts = (b.options?.layouts) || ['list','grid'];
  box.innerHTML = `
    <div class="field-label">رنگِ برند</div>
    <div style="display:flex;gap:8px;align-items:center">
      <input type="color" id="mbAccent" value="${esc(b.menu_accent || '#2563EB')}" style="width:48px;height:36px;padding:0;border:none;background:none">
      <button class="btn btn-sm btn-ghost" onclick="menuBrandSave({menu_accent:null})">حذفِ رنگ (پیش‌فرض)</button>
    </div>
    <div class="field-label">حالتِ نمایش</div>
    <select class="inp" id="mbTheme">
      <option value="">پیش‌فرضِ رزرونو</option>
      ${themes.map(t=>`<option value="${esc(t)}"${b.menu_theme===t?' selected':''}>${esc(BRAND_THEME_LABEL[t]||t)}</option>`).join('')}
    </select>
    <div class="field-label">چیدمان</div>
    <select class="inp" id="mbLayout">
      <option value="">پیش‌فرضِ رزرونو</option>
      ${layouts.map(l=>`<option value="${esc(l)}"${b.menu_layout===l?' selected':''}>${esc(BRAND_LAYOUT_LABEL[l]||l)}</option>`).join('')}
    </select>
    <div class="field-label">خطِ معرفی</div>
    <input class="inp" id="mbTagline" maxlength="160" value="${esc(b.menu_tagline||'')}" placeholder="اختیاری — زیرِ نامِ رستوران دیده می‌شود">
    <button class="btn btn-primary btn-sm btn-block" style="margin-top:12px" onclick="menuBrandSaveForm()">ذخیره‌ی ظاهر</button>`;
}

function menuBrandSaveForm(){
  menuBrandSave({
    menu_accent: (document.getElementById('mbAccent').value || '').toUpperCase() || null,
    // رشته‌ی خالی = «برگرد به پیش‌فرض»؛ سرور آن را null می‌فهمد.
    menu_theme: document.getElementById('mbTheme').value || null,
    menu_layout: document.getElementById('mbLayout').value || null,
    menu_tagline: (document.getElementById('mbTagline').value || '').trim() || null,
  });
}

async function menuBrandSave(patch){
  const res = await API.menuBrandingSave(patch);
  if(!res.ok){
    toast('', res.offline ? 'اتصال به سرور برقرار نیست' : (res.error?.message || 'ذخیره نشد'));
    return;
  }
  MENU_BRAND = res.data;
  menuBrandRender();
  toast('✓','ظاهرِ منو ذخیره شد و همین حالا روی صفحه‌ی عمومی است');
}

async function menuCopyUrl(){
  const el = document.getElementById('menuPubUrl');
  if(!el) return;
  try{
    await navigator.clipboard.writeText(el.value);
    toast('✓','آدرس کپی شد');
  }catch{
    // clipboard API روی http یا مرورگرِ قدیمی کار نمی‌کند — انتخابِ متن
    // دستِ‌کم کپیِ دستی را یک کلیدِ ترکیبی می‌کند.
    el.select();
    toast('','کپیِ خودکار ممکن نشد — با Ctrl+C کپی کن');
  }
}

/** SVGِ QR را از سرور می‌گیرد و همراهِ دکمه‌های دانلود نشان می‌دهد. */
async function menuLoadQr(){
  const box = document.getElementById('menuQrBox');
  if(!box) return;
  box.innerHTML = `<div style="color:var(--t2);font-size:13px">در حال ساختِ QR…</div>`;

  const res = await API.menuQrSvg(512);
  if(!res.ok){
    box.innerHTML = `<div style="color:var(--t2);font-size:13px;margin-bottom:8px">
        ${esc(res.offline ? 'اتصال به سرور برقرار نیست.' : (res.error?.message || 'ساختِ QR ناموفق بود.'))}
      </div>
      <button class="btn btn-sm btn-ghost" onclick="menuLoadQr()">تلاش دوباره</button>`;
    return;
  }

  // SVG از APIِ خودمان می‌آید (نه ورودیِ کاربر) و متنِ داخلش را هم سرور از
  // slug ساخته، نه از چیزی که کلاینت فرستاده باشد.
  _menuQrSvg = res.data.svg;
  // SVG با عرضِ ثابتِ ۵۱۲ می‌آید (همان اندازه‌ای که برایِ دانلود می‌خواهیم)، ولی
  // در پنلِ موبایل باید کوچک شود وگرنه از کارت بیرون می‌زند و صفحه را افقی
  // اسکرول می‌کند — در تستِ مرورگر روی ۴۲۰px دقیقاً همین رخ داد.
  // `max-width` روی خودِ svg اعمال می‌شود، نه فقط قاب.
  box.innerHTML = `
    <div style="background:#fff;display:inline-block;padding:12px;border-radius:12px;max-width:100%">
      <div style="max-width:260px;margin:0 auto">
        <style>#menuQrBox svg{width:100%;height:auto;display:block}</style>
        ${_menuQrSvg}
      </div>
    </div>
    <div style="display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap">
      <button class="btn btn-sm btn-ghost" onclick="menuDownloadQr('svg')">دانلودِ SVG</button>
      <button class="btn btn-sm btn-ghost" onclick="menuDownloadQr('png')">دانلودِ PNG</button>
    </div>
    <div style="color:var(--t2);font-size:12px;margin-top:8px">
      SVG برایِ چاپ (هر اندازه، بدونِ افتِ کیفیت) · PNG برایِ شبکه‌های اجتماعی
    </div>`;
}

let _menuQrSvg = null;

/** دانلودِ QR. PNG در خودِ مرورگر از SVG رندر می‌شود — بدونِ رفت‌وبرگشتِ اضافه. */
function menuDownloadQr(fmt){
  if(!_menuQrSvg) return;
  const name = 'rezervno-menu-qr';
  if(fmt === 'svg'){
    menuTriggerDownload(new Blob([_menuQrSvg], { type:'image/svg+xml' }), name + '.svg');
    return;
  }
  // SVG → canvas → PNG. اندازه‌ی ۱۰۲۴ عمدی است: QR در چاپ اغلب بزرگ‌تر از
  // نمایشِ صفحه لازم می‌شود و بزرگ‌کردنِ PNGِ کوچک آن را ناخوانا می‌کند.
  const SIZE = 1024;
  const img = new Image();
  const svgUrl = URL.createObjectURL(new Blob([_menuQrSvg], { type:'image/svg+xml' }));
  img.onload = () => {
    const c = document.createElement('canvas');
    c.width = c.height = SIZE;
    const ctx = c.getContext('2d');
    // پس‌زمینه‌ی سفیدِ صریح: PNGِ شفاف روی تمِ تیره‌ی نمایشگر/چاپ سیاه‌روی‌سیاه
    // می‌شود و اسکنر نمی‌خواندش.
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.drawImage(img, 0, 0, SIZE, SIZE);
    URL.revokeObjectURL(svgUrl);
    c.toBlob(b => { if(b) menuTriggerDownload(b, name + '.png'); });
  };
  img.onerror = () => { URL.revokeObjectURL(svgUrl); toast('','ساختِ PNG ناموفق بود — SVG را دانلود کن'); };
  img.src = svgUrl;
}

function menuTriggerDownload(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function menuRowHTML(i){
  // عکسِ آیتم اگر هست جایِ ایموجی می‌نشیند — همان چیزی که مهمان در منویِ
  // عمومی می‌بیند، تا رستوران‌دار پیش‌نمایشِ واقعی داشته باشد نه تقریبی.
  const thumb = i.image_url
    ? `<img src="${esc(i.image_url)}" alt="" loading="lazy" style="width:40px;height:40px;object-fit:cover;border-radius:8px;flex:0 0 auto">`
    : `<span class="top-ava">${i.emoji ? esc(i.emoji) : icon('menu',{size:16})}</span>`;
  return `<div class="top-cust" style="cursor:default;${i.is_active?'':'opacity:.55'}">
    ${thumb}
    <div class="top-body">
      <div class="top-name">${esc(i.name)}${i.is_active?'':' <span class="seg-vip" style="background:var(--t3)">غیرفعال</span>'}</div>
      <div class="top-meta">${fnMoney(i.price_toman)} تومان${i.sold_count?` · ${fa(i.sold_count)} فروش`:''}${i.image_url?'':' · بدونِ عکس'}</div>
    </div>
    <button class="btn btn-sm btn-ghost" onclick="menuOpenForm('${esc(i.id)}')">ویرایش</button>
    <button class="btn btn-sm btn-ghost" style="color:var(--red)" onclick="menuDelete('${esc(i.id)}')">حذف</button>
  </div>`;
}

// ═══════════════════════════════════════════════════════════════════════
//  عکسِ آیتم — آپلودِ واقعیِ فایل، نه آدرسِ دلخواه.
//
//  فایل از همان خطِ لوله‌ای می‌گذرد که گالریِ رستوران دارد: تشخیصِ فرمت از
//  رویِ بایت‌ها (نه پسوند یا content-type)، سقفِ حجم و ابعاد، و ذخیره روی
//  فضایِ خودمان. برخلافِ گالری، عکسِ منو بی‌درنگ منتشر می‌شود چون منو مالِ
//  خودِ رستوران است.
// ═══════════════════════════════════════════════════════════════════════
/** جعبه‌ی عکسِ آیتم در فرم: پیش‌نمایش (اگر هست) + انتخابِ فایل + حذف. */
function menuPhotoBoxHTML(it){
  const has = !!(it && it.image_url);
  return `
    ${has ? `<div style="margin-bottom:8px">
      <img src="${esc(it.image_url)}" alt="" style="width:100%;max-height:160px;object-fit:cover;border-radius:10px">
    </div>` : `<div style="color:var(--t2);font-size:13px;margin-bottom:8px">
      این آیتم عکس ندارد. عکسِ غذا مهم‌ترین چیزی است که مهمان سرِ میز می‌بیند.
    </div>`}
    <input type="file" id="miPhotoFile" accept="image/jpeg,image/png,image/webp"
           onchange="menuPickPhoto('${esc(it.id)}')" style="width:100%;font-size:13px">
    <div style="display:flex;gap:8px;margin-top:8px;flex-wrap:wrap">
      ${has ? `<button type="button" class="btn btn-sm btn-ghost" style="color:var(--red)" onclick="menuRemovePhoto('${esc(it.id)}')">حذفِ عکس</button>` : ''}
    </div>
    <div style="color:var(--t2);font-size:12px;margin-top:6px">
      JPEG / PNG / WebP · حداکثر ۸ مگابایت · بی‌درنگ در منویِ عمومی دیده می‌شود.
    </div>`;
}

async function menuPickPhoto(id){
  const input = document.getElementById('miPhotoFile');
  if(!input || !input.files || !input.files[0]) return;
  const file = input.files[0];
  const box = document.getElementById('miPhotoBox');
  if(box) box.innerHTML = `<div style="color:var(--t2);font-size:13px">در حال آپلود…</div>`;

  const res = await API.menuItemPhotoUpload(id, file);
  if(!res.ok){
    // پیامِ سرور عیناً نشان داده می‌شود — «عکس خیلی بزرگ است» یا «فایل تصویر
    // نیست» را خودِ سرور دقیق‌تر از ما می‌داند.
    if(box) box.innerHTML = `<div style="color:var(--red);font-size:13px">${esc(res.offline?'اتصال به سرور برقرار نیست':(res.error?.message||'آپلود ناموفق بود'))}</div>`;
    return;
  }
  toast('✓','عکس آپلود شد و همین حالا در منویِ عمومی دیده می‌شود');
  // فهرست تازه می‌شود تا بندانگشتیِ ردیف هم به‌روز شود.
  await rMenu();
  menuOpenForm(id);
}

async function menuRemovePhoto(id){
  if(!confirm('عکسِ این آیتم برداشته شود؟')) return;
  const res = await API.menuItemPhotoDelete(id);
  if(!res.ok){
    toast('', res.offline ? 'اتصال به سرور برقرار نیست' : (res.error?.message||'حذف نشد'));
    return;
  }
  toast(res.data?.removed?'✓':'', res.data?.message || 'انجام شد');
  await rMenu();
  menuOpenForm(id);
}

function fnMoney(n){ return fa((n||0).toLocaleString('en-US')); }

/** فرمِ ساخت/ویرایش. بدونِ id یعنی ساختِ آیتمِ تازه. */
function menuOpenForm(id){
  const it = id ? MENU_ITEMS.find(x=>x.id===id) : null;
  openModal(`
    <div class="modal-title">${it ? 'ویرایشِ آیتم' : 'آیتمِ جدیدِ منو'}</div>
    <div class="field-label" style="margin-top:12px">نام</div>
    <input class="inp" id="miName" maxlength="120" value="${it?esc(it.name):''}" placeholder="مثلاً پاستا کربونارا">
    <div class="field-label">قیمت (تومان)</div>
    <input class="inp" id="miPrice" type="number" min="0" value="${it?it.price_toman:''}" placeholder="۱۸۵۰۰۰">
    <div class="field-label">دسته</div>
    <input class="inp" id="miCat" maxlength="60" list="miCatList" value="${it&&it.category?esc(it.category):''}" placeholder="اختیاری">
    <datalist id="miCatList">${MENU_CATEGORY_SUGGESTIONS.map(c=>`<option value="${esc(c)}">`).join('')}</datalist>
    <div class="field-label">ایموجی</div>
    <input class="inp" id="miEmoji" maxlength="16" value="${it&&it.emoji?esc(it.emoji):''}" placeholder="اختیاری — مثلاً 🍝">
    <div class="field-label">توضیح</div>
    <input class="inp" id="miDesc" maxlength="300" value="${it&&it.description?esc(it.description):''}" placeholder="اختیاری — مثلاً «با سسِ قارچ و پنیرِ پارمزان»">
    ${it ? `
    <div class="field-label">عکسِ آیتم</div>
    <div id="miPhotoBox">${menuPhotoBoxHTML(it)}</div>
    ` : `
    <div class="cash-note" style="margin-top:12px">${icon('info',{size:13})}
      اول آیتم را ذخیره کن، بعد می‌توانی برایش عکس آپلود کنی.
    </div>`}
    <div class="field-label">ترتیبِ نمایش</div>
    <input class="inp" id="miSort" type="number" min="0" value="${it&&it.sort_order!=null?it.sort_order:0}" placeholder="۰">
    <div style="color:var(--t2);font-size:12px;margin-top:4px">
      عددِ کوچک‌تر بالاتر نشان داده می‌شود. آیتم‌هایِ هم‌عدد بر اساسِ نام مرتب می‌شوند.
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin:12px 0">
      <input type="checkbox" id="miActive" ${!it || it.is_active ? 'checked' : ''}>
      <span>در منو نمایش داده شود</span>
    </label>
    <button class="btn btn-primary btn-block" onclick="menuSave(${id?`'${esc(id)}'`:'null'})">${it?'ذخیره':'افزودن'}</button>`);
}

async function menuSave(id){
  const name = (document.getElementById('miName').value||'').trim();
  const price = parseInt(document.getElementById('miPrice').value, 10);
  if(!name){ toast('','نامِ آیتم لازم است'); return; }
  if(!Number.isFinite(price) || price < 0){ toast('','قیمت را درست وارد کن'); return; }

  const sort = parseInt(document.getElementById('miSort').value, 10);

  const body = {
    name,
    price_toman: price,
    category: (document.getElementById('miCat').value||'').trim() || null,
    emoji: (document.getElementById('miEmoji').value||'').trim() || null,
    is_active: document.getElementById('miActive').checked,
    description: (document.getElementById('miDesc').value||'').trim() || null,
    // image_url اینجا نیست: عکس فقط با آپلودِ فایل عوض می‌شود (menuPickPhoto).
    sort_order: Number.isFinite(sort) && sort >= 0 ? sort : 0,
  };
  const res = id ? await API.menuUpdate(id, body) : await API.menuCreate(body);
  if(!res.ok){
    toast('', res.offline ? 'اتصال به سرور برقرار نیست' : (res.error?.message || 'ذخیره نشد'));
    return;
  }
  closeModal();
  toast('✓', id ? 'آیتم به‌روزرسانی شد' : 'آیتم به منو اضافه شد');
  rMenu();
}

async function menuDelete(id){
  const it = MENU_ITEMS.find(x=>x.id===id);
  if(!confirm(`«${it?it.name:'این آیتم'}» از منو حذف شود؟`)) return;
  const res = await API.menuDelete(id);
  if(!res.ok){
    toast('', res.offline ? 'اتصال به سرور برقرار نیست' : (res.error?.message || 'حذف نشد'));
    return;
  }
  // سرور ممکن است به‌جایِ حذف، بایگانی کرده باشد (آیتمی که در پیش‌سفارشِ
  // ثبت‌شده به‌کار رفته حذف نمی‌شود تا سابقه‌ی مبلغ سالم بماند). پیامِ خودِ
  // سرور نشان داده می‌شود تا رستوران‌دار دقیقاً بداند چه شد.
  toast(res.data?.archived ? '' : '✓', res.data?.message || 'آیتم حذف شد');
  rMenu();
}

</script>
  <script data-src="js/assistant.js">
// ═══════ رزرونو — پنل business: چت‌باکسِ دستیارِ هوشمندِ آفلاین ═══════
// آزادمتن، وصل به /restaurant/assistant واقعی. بدونِ AI بیرونی — طبقه‌بندِ
// نیت کاملاً روی سرور و آفلاین انجام می‌شود (lib/assistant-nlu.ts). این
// فایل فقط UI است: نمایشِ حباب‌های گفتگو + چیپ‌های پیشنهاد وقتی دستیار
// مطمئن نیست، که کلیک‌کردنشان همان حلقه‌ی خودآموزی را تغذیه می‌کند.
// scope مشترک (بدون import، مثل بقیه‌ی فایل‌ها).

let _assistantBusy = false;

function assistantChatHtml(){
  return `
    <div class="panel" style="margin-bottom:18px">
      <div class="panel-head">
        <div class="panel-title">دستیارِ هوشمند</div>
        <div class="panel-sub">آفلاین و بدونِ AIِ بیرونی — از داده‌ی واقعیِ همین رستوران جواب می‌ده و هرچی بیشتر باهاش حرف بزنی بهتر یاد می‌گیره</div>
      </div>
      <div id="assistantBody" class="chat-modal-body" style="height:260px;min-height:260px"></div>
      <div class="chat-modal-input">
        <input id="assistantInput" placeholder="مثلاً: امروز چند رزرو داریم؟" maxlength="500" autocomplete="off">
        <button id="assistantSend" class="btn btn-primary">پرسیدن</button>
      </div>
    </div>`;
}

/** بعدِ اینکه custRenderAI محتوایِ تب را ساخت، این را صدا بزن تا چت را فعال کند. */
function initAssistantChat(){
  const body = document.getElementById('assistantBody');
  const input = document.getElementById('assistantInput');
  const send = document.getElementById('assistantSend');
  if (!body || !input || !send) return;

  body.innerHTML = `<div class="chat-b them">سلام! یه سؤال درباره‌ی رزروها، مشتری‌ها یا میزهاتون بپرس — مثلاً «امروز چند رزرو داریم؟» یا «کدوم روز شلوغ‌تره؟».</div>`;

  send.onclick = sendAssistantMessage;
  input.addEventListener('keydown', e => { if (e.key === 'Enter'){ e.preventDefault(); sendAssistantMessage(); } });
}

function assistantAppend(html){
  const body = document.getElementById('assistantBody');
  if (!body) return;
  body.insertAdjacentHTML('beforeend', html);
  body.scrollTop = body.scrollHeight;
}

async function sendAssistantMessage(){
  if (_assistantBusy) return;
  const input = document.getElementById('assistantInput');
  const message = (input?.value || '').trim();
  if (!message) return;
  input.value = '';
  assistantAppend(`<div class="chat-b me">${esc(message)}</div>`);

  _assistantBusy = true;
  const send = document.getElementById('assistantSend');
  if (send) send.disabled = true;
  const pendingId = 'ap' + Date.now();
  assistantAppend(`<div class="chat-b them" id="${pendingId}">…</div>`);

  const res = await API.assistantAsk(message);
  document.getElementById(pendingId)?.remove();
  _assistantBusy = false;
  if (send) send.disabled = false;

  if (!res.ok){
    assistantAppend(`<div class="chat-b them">اتصال به سرور برقرار نشد — دوباره امتحان کن.</div>`);
    return;
  }
  const d = res.data;
  assistantAppend(`<div class="chat-b them">${esc(d.answer)}</div>`);
  if (!d.understood && Array.isArray(d.suggestions) && d.suggestions.length){
    const chips = d.suggestions.map(s =>
      `<button class="btn btn-sm btn-ghost" style="margin:2px" onclick="assistantTeach('${d.log_id}','${s.intent}',this)">${esc(s.label)}</button>`
    ).join('');
    assistantAppend(`<div class="chat-b them" style="background:transparent;padding:2px 0">${chips}</div>`);
  }
}

/** کلیکِ کارمند رویِ چیپِ پیشنهاد = تعلیمِ دستیار (خودآموزیِ آنلاین). */
async function assistantTeach(logId, intent, btnEl){
  const wrap = btnEl?.closest('.chat-b');
  if (wrap) wrap.innerHTML = '<span style="opacity:.6">در حال یادگیری…</span>';
  const res = await API.assistantFeedback(logId, intent);
  if (wrap) wrap.remove();
  if (!res.ok){ toast('', 'یادگیری انجام نشد'); return; }
  assistantAppend(`<div class="chat-b them">${esc(res.data.answer)}</div>`);
  toast('', 'یاد گرفتم — دفعه‌ی بعد بهتر تشخیص می‌دم');
}

</script>

function addMember(){
  const fn=document.getElementById('cFn').value.trim(),ln=document.getElementById('cLn').value.trim(),ph=document.getElementById('cPh').value.trim();

  if(!/^۰۹|^09/.test(ph.replace(/\s/g,''))){toast('','موبایل معتبر وارد کن');return}
  const res=enrollClub(fn+' '+ln,ph);
  if(res.reason==='exists'){
    toast('',`این شماره قبلاً عضوه (${res.member.code})`);
    return;
  }
  const code=res.member.code;
  document.getElementById('memberResult').innerHTML=`<div style="background:var(--teal-50);border:1px solid #99F6E4;border-radius:var(--r);padding:14px;margin-top:14px;text-align:center;animation:pop .4s var(--spring)"><div style="font-size:11px;color:var(--teal-600);font-weight:700">کد عضویت ساخته شد</div><div style="font-size:24px;font-weight:800;letter-spacing:.1em;color:var(--teal-600);margin-top:4px">${code}</div><div style="font-size:12px;color:var(--t2);margin-top:4px">${esc(fn)} ${esc(ln)}</div></div>`;

  setTimeout(()=>{if(document.getElementById('v-loyalty').classList.contains('active'))rLoyalty()},1800);

// نقشه‌ی حرارتیِ اشغال: روز هفته × ساعت. ورودی: [{dow,hour,count}] (dow 0=یکشنبه)
function buildHeatmap(rows){
  // اگر داده‌ی واقعی نبود، نمونه‌ی واقع‌گرایانه بساز (شب‌ها و آخر هفته شلوغ‌تر)
  const hours=[12,13,14,18,19,20,21,22];
  const dowFa=['ی','د','س','چ','پ','ج','ش']; // نمایش: یکشنبه..شنبه؟ در ایران هفته از شنبه
  // بازچینش به ترتیب هفته‌ی ایرانی: شنبه(6)..جمعه(5)
  const order=[6,0,1,2,3,4,5]; const orderLbl=['ش','ی','د','س','چ','پ','ج'];
  const grid={}; let mx=0;
  if(rows&&rows.length){
    rows.forEach(r=>{ grid[`${r.dow}-${r.hour}`]=r.count; if(r.count>mx)mx=r.count; });
  } else {
    order.forEach((d,di)=>hours.forEach(h=>{
      const wknd=(d===4||d===5)?1.8:1; const night=(h>=19&&h<=21)?2.2:(h>=18?1.4:0.6);
      const v=Math.round(Math.random()*4*wknd*night); grid[`${d}-${h}`]=v; if(v>mx)mx=v;
    }));
  }
  mx=mx||1;
  const cell=(d,h)=>{
    const v=grid[`${d}-${h}`]||0; const t=v/mx;
    // رنگ: از خنثی تا گرادیانِ برند (شلوغی = گرم‌تر)
    const bg=t===0?'var(--s-100)':`rgba(${Math.round(106+t*149)},${Math.round(75-t*20)},${Math.round(255-t*130)},${0.15+t*0.85})`;
    return `<div class="hm-cell" style="background:${bg}" title="${orderLbl[order.indexOf(d)]} ساعت ${fa(h)}: ${fa(v)} رزرو"></div>`;
  };
  return `
    <div class="hm-grid">
      <div class="hm-corner"></div>
      ${hours.map(h=>`<div class="hm-hlabel">${fa(h)}</div>`).join('')}
      ${order.map((d,di)=>`
        <div class="hm-dlabel">${orderLbl[di]}</div>
        ${hours.map(h=>cell(d,h)).join('')}
      `).join('')}
    </div>
    <div class="hm-legend"><span>کم</span><div class="hm-scale"></div><span>شلوغ</span></div>`;
}

// ═══════════ MODAL + TOAST + INIT ═══════════
// ── مودالِ قابلِ‌دسترس (WCAG 2.1.2 و 4.1.2) ──
// پیش‌تر مودال فقط با کلیک بسته می‌شد: کاربرِ کیبورد گیر می‌کرد، focus پشتِ
// overlay می‌ماند، و screen-reader نمی‌فهمید دیالوگی باز شده است.
let _modalLastFocus = null;
function openModal(html){
  _modalLastFocus = document.activeElement;
  document.getElementById('modalBody').innerHTML = html;
  const bg = document.getElementById('modalBg');
  bg.classList.add('show');
  bg.setAttribute('aria-hidden','false');
  // focus را به اولین عنصرِ تعاملیِ داخلِ مودال ببر (یا خودِ مودال).
  const body = document.getElementById('modalBody');
  const first = body.querySelector('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  (first || body).focus?.();
}
function closeModal(){
  const bg = document.getElementById('modalBg');
  bg.classList.remove('show');
  bg.setAttribute('aria-hidden','true');
  // focus را به عنصری که مودال را باز کرده بود برگردان.
  if (_modalLastFocus && document.contains(_modalLastFocus)) _modalLastFocus.focus?.();
  _modalLastFocus = null;
}
// Esc مودالِ باز را می‌بندد + focus-trap با Tab داخلِ مودال می‌ماند.
document.addEventListener('keydown', e => {
  const bg = document.getElementById('modalBg');
  if (!bg || !bg.classList.contains('show')) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
  if (e.key !== 'Tab') return;
  const items = [...document.getElementById('modalBody')
    .querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
    .filter(el => !el.disabled && el.offsetParent !== null);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});
let tt;
function toast(icon,msg){document.getElementById('toastIcon').textContent=icon;document.getElementById('toastMsg').textContent=msg;const t=document.getElementById('toast');t.classList.add('show');t.classList.remove('toast-enter');void t.offsetWidth;t.classList.add('toast-enter');const live=document.getElementById('a11y-live');if(live)live.textContent=msg;clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2400)}

// ⚠️ رفعِ باگ (همان الگویِ RES/GUESTS): این ۴ آیتم قبلاً هاردکد بودند —
// «پارسا تهرانی رزرو کرد»، «نیلوفر رضایی ۵ ستاره داد»، … — برایِ هر
// رستورانِ واقعی، همیشه همین‌ها. NOTIFS_DEMO فقط fallbackِ آفلاین است
// (هم‌الگو با WL_DEMO_QUEUE/RES_DEMO/GUESTS_DEMO)؛ NOTIFS با
// loadNotifications از /restaurant/notifications واقعی پر می‌شود.
const NOTIFS_DEMO=[
  {ic:'green',emoji:'checkCircle',title:'رزرو جدید',text:'پارسا تهرانی برای امشب ساعت ۲۱:۳۰ میز رزرو کرد',time:'۲ دقیقه پیش',unread:true},

  {ic:'green',emoji:'refresh',title:'مشتری بازگشتی',text:'نیلوفر رضایی بعد از ۲ هفته دوباره رزرو کرد',time:'دیروز',unread:false},
];
let NOTIFS=NOTIFS_DEMO.slice();
let _notifsLoaded=false;
/** فعالیتِ اخیرِ واقعی را می‌گیرد و NOTIFS را جایگزین می‌کند (خالی اگر فعالیتی نبود). */
async function loadNotifications(){
  if(!API.getToken()) return false;
  const res=await API.recentActivity();
  if(res.ok && Array.isArray(res.data?.items)){
    NOTIFS=res.data.items.map(n=>({ic:n.ic, emoji:n.emoji, title:n.title, text:n.text, time:faRelative(n.at), unread:false}));
    _notifsLoaded=true;
    return true;
  }
  // ⚠️ رفعِ باگ (یافته‌ی ریویوی Copilot): این endpoint حالا پشتِ
  // canViewAnalytics است؛ کارمندی که این مجوز را ندارد همیشه ۴۰۳ می‌گیرد.
  // اگر همینجا false برگردانیم و NOTIFS دست‌نخورده بماند، همان باگِ اصلیِ
  // این PR برایِ همین زیرمجموعه از کاربران دوباره زنده می‌شود: NOTIFS_DEMو
  // برای همیشه به‌جایِ دیتایِ واقعی نشان داده می‌شود. ۴۰۳ یعنی «قطعاً و
  // برایِ همیشه صلاحیت نداری»، نه یک خطایِ موقت — پس فوراً خالی کن و
  // دیگر تلاش نکن (نه دیتایِ ساختگی، نه تلاشِ بی‌فایده‌ی هر رفرش).
  if(res.status===403){
    NOTIFS=[];
    _notifsLoaded=true;
    return true;
  }
  return false;
}
function renderNotifList(){
  const el=document.getElementById('notifList');
  const unread=NOTIFS.filter(n=>n.unread).length;
  document.getElementById('notifPing').style.display=unread?'block':'none';
  if(!NOTIFS.length){el.innerHTML=`<div class="empty-state"><div class="empty-state-icon">${icon('bell',{size:32})}</div><div class="empty-state-desc">اعلانی نیست</div></div>`;return}
  // ⚠️ رفعِ باگ امنیتی (یافته‌ی ریویوی Copilot روی PR): title/text حالا از
  // نامِ مهمان/متنِ نظر (ورودیِ قابل‌کنترلِ کاربر) می‌آیند، نه رشته‌ی هاردکد
  // مثلِ قبل — بدونِ esc اینجا یک stored XSS واقعی در پنلِ کارکنان بود.
  el.innerHTML=NOTIFS.map((n,i)=>`<div class="notif-item ${n.unread?'unread':''}" onclick="readNotif(${i})">
    ${n.unread?'<span class="notif-dot"></span>':''}
    <div class="notif-ic ${n.ic}">${icon(n.emoji,{size:16})}</div>
    <div class="notif-body"><div class="notif-title">${esc(n.title)}</div><div class="notif-text">${esc(n.text)}</div><div class="notif-time">${esc(n.time)}</div></div>
  </div>`).join('');
}
function toggleNotif(e){
  e&&e.stopPropagation();
  const pop=document.getElementById('notifPop');
  const open=pop.classList.toggle('show');
  document.querySelector('.tb-icon')?.setAttribute('aria-expanded', String(open));
}
function readNotif(i){NOTIFS[i].unread=false;renderNotifList()}
function clearNotif(){NOTIFS.forEach(n=>n.unread=false);renderNotifList();toast('','همه خوانده شد')}
document.addEventListener('click',e=>{
  const pop=document.getElementById('notifPop');
  if(pop&&!pop.contains(e.target)&&!e.target.closest('.tb-icon')){
    pop.classList.remove('show');
    document.querySelector('.tb-icon')?.setAttribute('aria-expanded','false');

});
function popup(iconName,title,text){

}
function pushNotif(n){NOTIFS.unshift(n);renderNotifList();popup(n.emoji,n.title,n.text)}

      <button class="btn btn-primary btn-block" onclick="cbApply()">بله، اعمال کن</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeModal()">انصراف</button>
    </div>`);
}
async function cbApply(){
  CB={...CB_DRAFT};closeModal();
  document.getElementById('cbDirty').classList.remove('show');
  const btn=document.getElementById('cbSave');btn.style.opacity='.5';btn.style.pointerEvents='none';
  // ارسال به API اگر توکن staff داریم
  if(API.getToken()){
    const res=await API.patch('/restaurant/cashback',{
      base_pct:CB.base, preorder_pct:CB.pre, vip_pct:CB.vip, winback_pct:CB.wb,
    });
    if(res.ok){
      toast('','کش‌بک در سرور ذخیره شد');
    } else if(res.offline){
      toast('','کش‌بک اعمال شد (محلی)');
    } else {
      toast('',res.error?.message||'خطا در ذخیره‌ی کش‌بک');
    }
  } else {
    toast('','درصدهای کش‌بک اعمال شد');
  }
  pushNotif({ic:'blue',emoji:'wallet',title:'کش‌بک به‌روز شد',text:`کش‌بک پایه به ${fa(CB.base)}٪ تغییر کرد`,time:'همین الان',unread:true});
}

// ═══════════ ورود کارمند (فاز ۳ تکه ۷) ═══════════
let _staffPhone = '';
let STAFF_INFO = null;
function setStaffGateLocked(locked){
  const app = document.querySelector('.shell') || document.querySelector('.app');
  const overlay = document.getElementById('loginOverlay');
  if (app) {
    app.setAttribute('aria-hidden', locked ? 'true' : 'false');
    if ('inert' in app) app.inert = locked;
  }
  if (overlay) overlay.setAttribute('aria-hidden', locked ? 'false' : 'true');
}
function showStaffLoginPhone(){
  setStaffGateLocked(true);
  document.getElementById('loginCard').innerHTML = `
    <div class="login-logo">${icon('utensils',{size:34})}</div>
    <div class="login-title">پنل رستوران رزرونو</div>
    <div class="login-sub">برای ورود، شماره موبایل ثبت‌شده‌ی رستورانت رو وارد کن</div>
    <label class="login-field-label">شماره موبایل</label>
    <input class="login-inp" id="staffPhone" inputmode="tel" placeholder="۰۹۱۲۳۴۵۶۷۸۹" onkeydown="if(event.key==='Enter')staffSendOtp()">
    <button class="login-btn" id="staffSendBtn" onclick="staffSendOtp()">ارسال کد ورود</button>
    <div class="login-foot">فقط شماره‌هایی که به‌عنوان مدیر یا کارمند ثبت شده‌اند دسترسی دارند</div>`;
  setTimeout(()=>document.getElementById('staffPhone')?.focus(),200);
}
async function staffSendOtp(){
  const el = document.getElementById('staffPhone');
  const phone = (el?.value||'').trim();
  const normalized = phone.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g,'');
  if (!/^09\d{9}$/.test(normalized)) { toast('','شماره موبایل معتبر وارد کن'); return; }
  _staffPhone = normalized;
  const btn = document.getElementById('staffSendBtn');
  if (btn){ btn.disabled = true; btn.textContent = 'در حال ارسال...'; }
  if (location.protocol === 'file:') {
    showStaffLoginCode('۱۲۳۴', true);
    return;
  }
  const res = await API.requestStaffOtp(normalized);
  if (!res.ok && !res.offline){
    // خطای واقعی (مثلاً شماره staff نیست)
    toast('', res.error?.message || 'این شماره دسترسی ندارد');
    if (btn){ btn.disabled = false; btn.textContent = 'ارسال کد ورود'; }
    return;
  }
  const devCode = res.data?.devCode || (res.offline ? '۱۲۳۴' : null);
  showStaffLoginCode(devCode, res.offline);
}
function showStaffLoginCode(devCode, offline){
  setStaffGateLocked(true);
  document.getElementById('loginCard').innerHTML = `
    <div class="login-logo">${icon('mail',{size:34})}</div>
    <div class="login-title">کد ورود رو وارد کن</div>
    <div class="login-sub">کد ورود به شماره‌ی ${toFaDigits(_staffPhone)} ارسال شد</div>
    <label class="login-field-label">کد ورود</label>
    <input class="login-inp code" id="staffCode" inputmode="numeric" maxlength="6" placeholder="······" onkeydown="if(event.key==='Enter')staffConfirmOtp()">
    <button class="login-btn" id="staffVerifyBtn" onclick="staffConfirmOtp()">ورود به پنل</button>
    <button class="login-back" onclick="showStaffLoginPhone()">تغییر شماره</button>
    ${devCode ? `<div class="login-hint">${offline?'حالت دمو (بک‌اند متصل نیست):':'حالت توسعه:'} کد ورود <b>${toFaDigits(devCode)}</b> است</div>` : ''}`;
  setTimeout(()=>document.getElementById('staffCode')?.focus(),200);
}
async function staffConfirmOtp(){
  const el = document.getElementById('staffCode');
  const code = (el?.value||'').trim().replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  if (!/^\d{4,6}$/.test(code)) { toast('','کد ورود رو کامل وارد کن'); return; }
  const btn = document.getElementById('staffVerifyBtn');
  if (btn){ btn.disabled = true; btn.textContent = 'در حال بررسی...'; }
  if (location.protocol === 'file:') {
    if (code === '1234'){ STAFF_INFO = { role:'owner', restaurant_name:'کافه‌رستوران ویستا' }; enterPanel(true); }
    else { toast('','در حالت دمو، کد ۱۲۳۴ است'); if (btn){ btn.disabled=false; btn.textContent='ورود به پنل'; } }
    return;
  }
  const res = await API.verifyStaffOtp(_staffPhone, code);
  if (res.ok && res.data?.staff){
    STAFF_INFO = res.data.staff;
    enterPanel();
  } else if (res.offline){
    // حالت دمو: کد ۱۲۳۴
    if (code === '1234'){ STAFF_INFO = { role:'owner', restaurant_name:'کافه‌رستوران ویستا' }; enterPanel(true); }
    else { toast('','در حالت دمو، کد ۱۲۳۴ است'); if (btn){ btn.disabled=false; btn.textContent='ورود به پنل'; } }
  } else {
    toast('', res.error?.message || 'کد اشتباه است');
    if (btn){ btn.disabled=false; btn.textContent='ورود به پنل'; }
  }
}
function enterPanel(demo){
  document.getElementById('loginOverlay').classList.add('hidden');
  setStaffGateLocked(false);
  // منو را با مجوزهای واقعیِ کاربر هم‌راستا کن — قبل از رندرِ هر صفحه.
  if (typeof applyPermissionsToNav === 'function') applyPermissionsToNav();
  renderNotifList();
  if(!_notifsLoaded && API.getToken() && !demo){ loadNotifications().then(ok=>{ if(ok) renderNotifList(); }); }
  rOverview();
  initLiveUpdates();
  if(API.getToken() && !demo){
    // ⚠️ رفعِ باگ: قبلاً فقط تبِ پلانِ سالن با اتمامِ loadTables دوباره رندر
    // می‌شد. یعنی اگر کاربر در داشبورد می‌ماند (رایج‌ترین حالت بعد از لاگین)
    // و loadTables دیرتر از renderEnterpriseDashboardِ اولیه تمام می‌شد،
    // KPIِ «اشغال فعلی» تا رفرشِ زنده‌ی بعدی (تا ۱۵ ثانیه) روی «۰/۰» می‌ماند
    // — نه به‌خاطرِ نبودِ میز، بلکه چون هنوز TABLES خالی بود.
    loadTables().then(()=>{
      if(document.getElementById('v-floor')?.classList.contains('active')) rFloor();
      if(document.getElementById('v-overview')?.classList.contains('active')) renderEnterpriseDashboard();
    });
    loadBranches();               // سوییچر شعبه را با داده‌ی واقعی پر کن
    Heartbeat.start();           // رستوران را در اپ مشتری آنلاین نگه می‌دارد
    Outbox.sync();               // اگر عملیات آفلاینِ در انتظار هست، همگام کن
  } else if(!TABLES.length){
    // حالت دمو — میزهای نمونه تا پلان سالن و KPI اشغال خالی نمانند
    TABLES = DEMO_TABLES.map(t=>({...t}));
    _tablesLoaded = true;
    rOverview();
  }
  toast('', `خوش اومدی${STAFF_INFO?.restaurant_name?' · '+STAFF_INFO.restaurant_name:''}`);
}
async function staffLogout(){
  Heartbeat.stop();                   // توقف heartbeat هنگام خروج
  await API.doLogout();               // باطل‌سازی سمت سرور + پاکسازی محلی
  STAFF_INFO = null;
  if (typeof applyPermissionsToNav === 'function') applyPermissionsToNav();  // بازگرداندنِ منو برای کاربرِ بعدی
  document.getElementById('loginOverlay').classList.remove('hidden');
  setStaffGateLocked(true);
  showStaffLoginPhone();
  toast('','از پنل خارج شدی');
}
// نشست منقضی و تمدید هم جواب نداد → برگشت به صفحه‌ی ورود
function onStaffSessionExpired(){
  STAFF_INFO = null;
  document.getElementById('loginOverlay').classList.remove('hidden');
  setStaffGateLocked(true);
  showStaffLoginPhone();
  toast('','نشست منقضی شد، دوباره وارد شو');
}

// init — نشست را از localStorage بازیابی کن، بعد ورود را چک کن
API.restoreSession();
Net.init();                    // فعال‌سازی تشخیص آنلاین/آفلاین + همگام‌سازی صف
Outbox._updateBadge();         // نمایش تعداد عملیات در انتظار (اگر از قبل هست)
if (API.getToken()) {
  // توکن ذخیره‌شده هست → مستقیم پنل (اگر منقضی باشد، اولین درخواست refresh می‌کند)
  document.getElementById('loginOverlay').classList.add('hidden');
  setStaffGateLocked(false);
  renderNotifList();
  // ⚠️ رفعِ باگ (ریویوی Copilot روی PR): این مسیرِ بازیابیِ نشست (رفرشِ
  // صفحه وقتی از قبل لاگین بودی) قبلاً loadNotifications را صدا نمی‌زد —
  // فقط enterPanel این کار را می‌کرد. یعنی با هر رفرشِ صفحه، اعلان‌های
  // دموی اولیه (NOTIFS_DEMO) برایِ همیشه به‌جایِ فعالیتِ واقعی می‌ماندند.
  if(!_notifsLoaded){ loadNotifications().then(ok=>{ if(ok) renderNotifList(); }); }
  rOverview();
  loadTables();
  loadBranches();               // سوییچر شعبه را با داده‌ی واقعی پر کن
  Heartbeat.start();           // شروع ارسال heartbeat (رستوران را در اپ مشتری آنلاین نگه می‌دارد)
} else {
  // نیاز به ورود
  setStaffGateLocked(true);
  showStaffLoginPhone();
}

</script>
<script data-src="js/chat.js">
// ═══════════ رزرونو — پنل business: چت با مشتریان (Polling) ═══════════
// اینباکس گفتگوها + پنجره‌ی گفتگو. scope مشترک (بدون import، مثل بقیه‌ی فایل‌ها).

let _chatPollTimer = null;
let _chatActiveThread = null;
let _chatLastTime = null;
let _chatRendered = new Set();
const CHAT_POLL_MS = 4000;

function chatEsc(s){ return String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function chatTime(iso){ try { return new Date(iso).toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}); } catch { return ''; } }

// ── اینباکس (view اصلی چت) ──
async function rChat(){
  const view = document.getElementById('v-chat');
  view.innerHTML = `<div class="panel"><div class="panel-head"><div class="panel-title">پیام‌های مشتریان</div><div class="panel-sub" id="chatInboxSub">در حال بارگذاری…</div></div><div id="chatInbox" class="chat-inbox"></div></div>`;
  const res = await API.get('/restaurant/chats');
  const box = document.getElementById('chatInbox');
  const sub = document.getElementById('chatInboxSub');
  if (!res.ok) { box.innerHTML = `<div class="chat-empty">اتصال برقرار نشد.</div>`; return; }
  const items = res.data.items || [];
  sub.textContent = res.data.unread_threads > 0 ? `${res.data.unread_threads} گفتگوی خوانده‌نشده` : 'همه خوانده شد';
  if (!items.length) { box.innerHTML = `<div class="chat-empty">هنوز پیامی از مشتری نیومده.</div>`; return; }
  box.innerHTML = items.map(t => `
    <div class="chat-inbox-row" onclick="openBizChat('${t.id}','${chatEsc(t.customer.name)}','${chatEsc(t.customer.phone||'')}')">
      <div class="chat-inbox-ava">${chatEsc(t.customer.name.charAt(0))}</div>
      <div class="chat-inbox-main">
        <div class="chat-inbox-top"><span class="chat-inbox-name">${chatEsc(t.customer.name)}</span>${t.reservation_code?`<span class="chat-inbox-tag">#${chatEsc(t.reservation_code)}</span>`:''}</div>
        <div class="chat-inbox-prev">${t.last_message?chatEsc(t.last_message.body).slice(0,64):'—'}</div>
      </div>
      ${t.unread>0?`<span class="chat-inbox-badge">${t.unread}</span>`:''}
    </div>`).join('');
}

// ── باز کردن یک گفتگو ──
async function openBizChat(threadId, name, phone){
  _chatActiveThread = threadId; _chatLastTime = null; _chatRendered = new Set();
  openModal(`
    <div class="chat-modal">
      <div class="chat-modal-head">
        <div><div class="chat-modal-name">${chatEsc(name)}</div>${phone?`<div class="chat-modal-phone" dir="ltr">${chatEsc(phone)}</div>`:''}</div>
        <button class="modal-x" onclick="closeBizChat()" aria-label="بستن">${icon('close',{size:18})}</button>
      </div>
      <div id="bizChatBody" class="chat-modal-body" role="log" aria-live="polite"></div>
      <div class="chat-modal-input">
        <input id="bizChatInput" placeholder="پاسخت رو بنویس…" maxlength="2000" autocomplete="off">
        <button id="bizChatSend" class="btn btn-primary">ارسال</button>
      </div>
    </div>`);
  document.getElementById('bizChatSend').onclick = sendBizChat;
  document.getElementById('bizChatInput').addEventListener('keydown', e => { if (e.key==='Enter'){ e.preventDefault(); sendBizChat(); } });
  await bizPoll(true);
  _chatPollTimer = setInterval(() => bizPoll(false), CHAT_POLL_MS);
}

function closeBizChat(){
  if (_chatPollTimer){ clearInterval(_chatPollTimer); _chatPollTimer = null; }
  _chatActiveThread = null;
  closeModal();
  rChat(); // اینباکس را تازه کن (شمارنده‌ها)
}

async function bizPoll(initial){
  if (!_chatActiveThread) return;
  const q = _chatLastTime ? `?after=${encodeURIComponent(_chatLastTime)}` : '';
  const res = await API.get(`/restaurant/chats/${_chatActiveThread}${q}`);
  if (!res.ok) return;
  const msgs = res.data.items || [];
  const body = document.getElementById('bizChatBody');
  if (!body) { if(_chatPollTimer){clearInterval(_chatPollTimer);_chatPollTimer=null;} return; }
  let appended = false;
  for (const m of msgs){
    if (_chatRendered.has(m.id)) continue;
    _chatRendered.add(m.id); _chatLastTime = m.created_at;
    body.insertAdjacentHTML('beforeend', bizBubble(m));
    appended = true;
  }
  if (initial && !msgs.length) body.innerHTML = `<div class="chat-empty-thread">هنوز پیامی نیست.</div>`;
  if (appended) body.scrollTop = body.scrollHeight;
}

function bizBubble(m){
  const mine = m.sender === 'staff';
  return `<div class="chat-b ${mine?'me':'them'}"><div>${chatEsc(m.body)}</div><div class="chat-b-t">${chatTime(m.created_at)}</div></div>`;
}

async function sendBizChat(){
  const input = document.getElementById('bizChatInput');
  const body = (input.value||'').trim();
  if (!body || !_chatActiveThread) return;
  input.value = '';
  const bodyEl = document.getElementById('bizChatBody');
  const empty = bodyEl?.querySelector('.chat-empty-thread'); if (empty) empty.remove();
  bodyEl?.insertAdjacentHTML('beforeend', `<div class="chat-b me pending"><div>${chatEsc(body)}</div><div class="chat-b-t">…</div></div>`);
  if (bodyEl) bodyEl.scrollTop = bodyEl.scrollHeight;
  const res = await API.post(`/restaurant/chats/${_chatActiveThread}`, { body });
  const pend = bodyEl?.querySelector('.chat-b.pending');
  if (res.ok && res.data?.id){
    _chatRendered.add(res.data.id); _chatLastTime = res.data.created_at;
    if (pend){ pend.classList.remove('pending'); pend.querySelector('.chat-b-t').textContent = chatTime(res.data.created_at); }
  } else {
    if (pend) pend.querySelector('.chat-b-t').innerHTML = icon('alert',{size:14});
    toast('','ارسال نشد');
  }
}

</script>
