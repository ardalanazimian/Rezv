<style data-src="css/ds-bridge.css">
/* ═══════════════════════════════════════════════════════════
   رزرونو — لایه‌ی سازگاریِ Design System (DS Bridge)
   هدف: هم‌ترازکردنِ کامپوننت‌های قدیمیِ اپ‌ها با Design System،
        بدونِ لمسِ markupِ صفحات (نه ری‌دیزاین).

   دو کار:
   ۱) نگاشتِ توکن‌های قدیمیِ هر اپ (--r-sm, --t, --blue...) به توکن‌های DS.
      → هر کلاسی که از توکنِ قدیمی استفاده می‌کند، خودکار مقدارِ DS می‌گیرد.
   ۲) هم‌ترازیِ کامپوننت‌های پایه (.btn, .inp) به استانداردِ DS.

   باید *بعد از* CSS اصلیِ هر اپ لود شود تا واگرایی را اصلاح کند.
   ═══════════════════════════════════════════════════════════ */

/* ── ۱) نگاشتِ توکن‌های قدیمی → DS (منبعِ واحدِ حقیقت) ── */
:root {
  /* شعاع: قدیمی → DS (کاملِ مقیاس، رفعِ واگراییِ r-xl=24→20، r-2xl=32→28) */
  --r-xs:  var(--radius-xs);
  --r-sm:  var(--radius-sm);
  --r-md:  var(--radius-md);
  --r:     var(--radius-md);
  --r-lg:  var(--radius-lg);
  --r-xl:  var(--radius-xl);
  --r-2xl: var(--radius-2xl);
  /* حرکت: قدیمی → DS (کامل، شاملِ t-slow=340→320 و spring) */
  --t:      var(--motion-base);
  --t-fast: var(--motion-fast);
  --t-slow: var(--motion-slow);
  --ease:   var(--ease-out);
  --spring: var(--ease-spring);
  /* برند: قدیمی → DS (حفظِ تمِ هر اپ، فقط یکدست‌سازیِ منبع) */
  --blue: var(--brand-500);
  /* توجه: سایه (--sh-*) عمداً نگاشت نمی‌شود — هر اپ سایه‌ی متناسب با تمِ خود دارد
     (مشتریِ دارک = سایه‌ی قوی‌تر با rgba بالا). نگاشتِ سراسریِ elevation روشن،
     سایه را در دارک‌مود نامرئی می‌کرد. این یک رگرسیونِ بصری بود که اصلاح شد. */
}

/* ── ۲) هم‌ترازیِ .btn به استانداردِ DS (رفعِ واگراییِ سه‌گانه) ──
   مقادیرِ یکدستِ توکنی، جایگزینِ 11px/10px و 14px/13px پراکنده. */
.btn {
  gap: var(--sp-2);
  padding: var(--sp-2) var(--sp-4);   /* block+inline کامل — override کاملِ shorthand قدیمی */
  font-size: var(--fs-md);
  min-height: var(--touch-min);
  border-radius: var(--radius-md);
  transition: transform var(--motion-fast) var(--ease-out),
              background var(--motion-fast) var(--ease-out),
              box-shadow var(--motion-fast) var(--ease-out),
              opacity var(--motion-fast) var(--ease-out);
}
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
/* ۳۶px زیرِ حداقلِ ۴۴px هر دو پلتفرم بود (WCAG 2.5.5). «کوچک» به عرض و وزنِ
   بصری برمی‌گردد، نه به کوچک‌کردنِ ناحیه‌ی لمس. */
.btn-sm { min-height: var(--touch-min); font-size: var(--fs-sm); padding: var(--sp-1) var(--sp-3); }
.btn-lg { min-height: 44px; font-size: var(--fs-lg); padding: var(--sp-3) var(--sp-6); }

/* ── ۳) هم‌ترازیِ .inp (کلاسِ قدیمی) به استانداردِ .field-input ── */
.inp {
  min-height: var(--touch-min);
  padding: var(--sp-3) var(--sp-4);   /* توکنی — override کاملِ 12px/15px قدیمی */
  border-radius: var(--radius-md);
  font-size: var(--fs-md);
  transition: border-color var(--motion-fast) var(--ease-out),
              box-shadow var(--motion-fast) var(--ease-out);
}
.inp:focus {
  border-color: var(--brand-500);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand-500) 15%, transparent);
}
.inp[aria-invalid="true"] { border-color: var(--danger); }

/* ── ۴) هم‌ترازیِ chip قدیمی (.opt) به استانداردِ .chip ── */
.opt {
  min-height: 34px;
  border-radius: var(--radius-full);
  transition: background var(--motion-fast) var(--ease-out),
              color var(--motion-fast) var(--ease-out);
}
.opt:focus-visible { box-shadow: var(--focus-ring); }

/* ── ۵) هم‌ترازیِ کارتِ قدیمی (.panel / .glass) به elevation یکدست ── */
.panel { border-radius: var(--radius-lg); }

</style>
</head>

<script data-src="js/api-core.js">
/* ═══════════════════════════════════════════════════════════
   رزرونو — هسته‌ی مشترکِ HTTP (transport) — منبعِ واحد
   این فایل منبعِ حقیقت است؛ tools/sync-design-system.sh آن را به اپ‌ها می‌سازد
   (customer نسخه‌ی ESM عیناً؛ در آینده پنل‌ها نسخه‌ی global).

   httpJson: یک fetchِ کم‌سطحِ بدونِ حالت — timeout، پارس JSON، envelope یکدست،
   و حالتِ offline. هیچ منطقِ auth/token/refresh اینجا نیست (آن سطح در هر اپ می‌ماند).
   خروجی:
     موفق   → { ok:true,  status, data }
     ناموفق → { ok:false, status, data, error }
     خطا/timeout → { ok:false, offline:true, error }
   ═══════════════════════════════════════════════════════════ */
// آدرسِ پایه‌ی API — قابلِ تنظیم بدونِ build: window.RZ_API_BASE یا
// <meta name="rz-api-base" content="https://...">. پیش‌فرض '' = same-origin
// (رفتارِ فعلی/دمو بدونِ تغییر). منبعِ واحد برای هر سه اپ.
function resolveApiBase() {
  try {
    if (typeof window !== 'undefined' && window.RZ_API_BASE) return String(window.RZ_API_BASE).replace(/\/$/, '');
    const m = (typeof document !== 'undefined') && document.querySelector('meta[name="rz-api-base"]');
    if (m && m.content) return String(m.content).trim().replace(/\/$/, '');
  } catch { /* noop */ }
  return '';
}

async function httpJson(url, opts = {}, timeoutMs = 8000) {
  // روی پروتکل file: (باز کردن مستقیم HTML) درخواستِ نسبی به file:///api/… می‌رود
  // و همیشه شکست می‌خورد + خطای کنسول می‌سازد؛ مستقیم حالتِ offline برگردان.
  try {
    if (typeof location !== 'undefined' && location.protocol === 'file:' && !/^https?:/i.test(url)) {
      return { ok: false, offline: true, error: { message: 'اتصال به سرور برقرار نشد' } };
    }
  } catch { /* noop */ }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { ...opts, signal: ctrl.signal });
    clearTimeout(timer);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      return { ok: false, status: res.status, data, error: data?.error || { message: `خطای ${res.status}` } };
    }
    return { ok: true, status: res.status, data };
  } catch (e) {
    clearTimeout(timer);
    return { ok: false, offline: true, error: { message: e.name === 'AbortError' ? 'زمان درخواست تمام شد' : 'اتصال به سرور برقرار نشد' } };
  }
}

// ── تولیدِ کلیدِ Idempotency برای عملیاتِ نوشتنیِ حساس (مثلاً ثبتِ رزرو) ──
// یک UUID per «قصدِ کاربر» (نه per تلاشِ HTTP): سرِ فراخوان (مثلاً confirmBook)
// یک‌بار ساخته می‌شود و برای همه‌ی تلاش‌های داخلیِ همان submit (شاملِ retryِ
// خودکارِ ۴۰۱→refresh) همان می‌ماند؛ submitِ بعدیِ کاربر کلیدِ تازه می‌گیرد —
// این‌طور دوبار زدنِ دکمه/ریترایِ شبکه رزروِ دوم نمی‌سازد، ولی submitِ جدید هم
// بی‌جهت به کلیدِ کهنه گیر نمی‌کند.
function genIdempotencyKey() {
  try {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  } catch { /* noop */ }
  // fallback برای مرورگر/محیطِ بدونِ crypto.randomUUID (نسخه‌ی v4-like غیررمزنگارانه؛
  // اینجا فقط برای یکتاییِ محلیِ کلیدِ idempotency لازم است، نه امنیت).
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = (Math.random() * 16) | 0;
    const v = c === 'x' ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

if (typeof window !== "undefined") { window.httpJson = httpJson; window.resolveApiBase = resolveApiBase; window.genIdempotencyKey = genIdempotencyKey; }

</script>
<script data-src="js/format.js">
/* ═══════════════════════════════════════════════════════════
   رزرونو — helperهای خالصِ نمایش/امنیت (منبعِ واحد؛ فقط پنل‌ها)
   این فایل منبعِ حقیقت است؛ tools/sync-design-system.sh نسخه‌ی global آن را
   به پنل‌های business/company می‌سازد (export حذف می‌شود؛ برای <script> کلاسیک).

   نکته: اپ customer عمداً اینجا نیست — `fa` در customer معنایِ متفاوتی دارد
   (تبدیلِ رقمِ ASCII به فارسی، نه فرمتِ عددِ fa-IR)، پس نباید یکی شود.

   fa  : فرمتِ عدد با جداکننده‌ی فارسی (۱۲٬۳۴۵).
   esc : escape کردنِ ورودی قبل از تزریق به HTML (ضدِّ XSS) — تنها پیاده‌سازیِ
         کانونیِ پنل‌ها؛ رفعِ باگِ escape یک‌جا برای هر دو پنل اعمال می‌شود.
   ═══════════════════════════════════════════════════════════ */
function fa(n){return (n==null||Number.isNaN(n))?'۰':n.toLocaleString('fa-IR')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

</script>

  completed:[],no_show:[],rejected:[],expired:[],cancelled:[],auto_cancelled:[],

// منوی تغییر وضعیت برای یک رزرو
function openStatusMenu(i){
  const r=RES[i]; if(!r)return;
  const allowed=STATUS_TRANSITIONS[r.status]||[];
  if(!allowed.length){toast('','این رزرو در وضعیت نهایی است');return;}
  const opts=allowed.map(s=>{const m=STATUS_META[s];return `<button class="status-opt" onclick="changeStatus(${i},'${s}')" style="--c:${m.fg};--bgc:${m.bg}"><span>${icon(m.icon,{size:13})}</span> ${m.label}</button>`;}).join('');
  openModal(`<div class="bs-head"><div class="bs-title">تغییر وضعیت</div><div class="bs-rest">${esc(r.name)} · میز ${fa(r.table)}</div></div>
    <div style="margin:8px 0 4px;font-size:13px;color:var(--t3)">وضعیت فعلی: ${STATUS_META[r.status]?.label||r.status}</div>
    <div class="status-opts">${opts}</div>
    <button class="btn btn-ghost btn-block" style="margin-top:12px" onclick="viewHistory(${i})">${icon('inbox',{size:14})} تاریخچه‌ی تغییرات</button>`);
}
// ⚠️ گسترش‌یافته (Tonight Board، ۲۰۲۶-۰۸-۱۴): پارامترِ reason اضافه شد تا
// «لغو» بتواند دلیل را هم در همین مسیرِ واحدِ optimistic-update+rollback
// به بک‌اند بفرستد (به‌جایِ اینکه cancelRes/doCancelRes مسیرِ جدا و
// ناقصِ خودشان را داشته باشند — رجوع کن به یافته‌ی reservations.js).
async function changeStatus(i,to,reason){
  const r=RES[i]; if(!r)return;
  closeModal();
  // به‌روزرسانی خوش‌بینانه‌ی UI
  const old=r.status, oldReason=r.cancelReason; r.status=to;
  if(reason) r.cancelReason=reason;
  // ثبت محلی در تاریخچه (برای نمایش در حالت دمو)
  r._events=r._events||[{toStatus:old,actor:'system',createdAt:new Date(Date.now()-3600000).toISOString(),isAutomatic:false}];
  r._events.push({toStatus:to,actor:'staff',createdAt:new Date().toISOString(),isAutomatic:false,reason});
  renderResList();
  toast('',`وضعیت به «${STATUS_META[to]?.label||to}» تغییر کرد`);
  // ارسال به بک‌اند؛ فقط اگر سرور آنلاین بود و خطای واقعی داد، برگردان
  if(r.code){
    const body={status:to}; if(reason) body.reason=reason;
    const res=await API.request(`/restaurant/reservations/${r.code}/status`,{method:'PATCH',body:JSON.stringify(body)});
    if(!res.ok&&!res.offline){ r.status=old; r.cancelReason=oldReason; r._events.pop(); renderResList(); toast('','تغییر وضعیت ناموفق بود — دوباره تلاش کن'); }
  }
}
async function viewHistory(i){
  const r=RES[i]; if(!r)return;
  // در دمو، تاریخچه‌ی نمونه؛ با بک‌اند واقعی از API می‌آید
  let events=r._events;
  if(!events){
    const res=await API.request(`/restaurant/reservations/${r.code}/events`);
    events=res.ok?res.data.events:[{toStatus:r.status,actor:'system',createdAt:new Date().toISOString(),isAutomatic:false}];
  }
  const rows=(events||[]).map(e=>{
    const m=STATUS_META[e.toStatus]||{label:e.toStatus,icon:'info',fg:'#666'};
    const who=e.actor==='system'||e.actor==='cron'?'سیستم':e.actor==='customer'?'مشتری':'کارمند';
    const t=new Date(e.createdAt).toLocaleString('fa-IR',{hour:'2-digit',minute:'2-digit',month:'short',day:'numeric'});
    return `<div class="hist-row"><span class="hist-ic" style="color:${m.fg}">${icon(m.icon,{size:14})}</span><div class="hist-body"><div class="hist-status">${m.label}${e.isAutomatic?' <span class="hist-auto">خودکار</span>':''}</div><div class="hist-meta">${who} · ${t}</div></div></div>`;
  }).join('');
  openModal(`<div class="bs-head"><div class="bs-title">تاریخچه‌ی رزرو</div><div class="bs-rest">${esc(r.name)} · کد ${r.code||'—'}</div></div><div class="hist-list">${rows||'<div style="color:var(--t3);text-align:center;padding:20px">رویدادی ثبت نشده</div>'}</div>`);
}
// ═══════════════════════════════════════════════════════════
//  لایه‌ی اتصال API (فاز ۳) — پنل رستوران
//  با توکن staff کار می‌کند. مثل اپ مشتری: تلاش API، fallback به نمونه.
// ═══════════════════════════════════════════════════════════
const API = {
  base: resolveApiBase(),            // '' = same-origin؛ قابلِ override با window.RZ_API_BASE یا <meta rz-api-base> (از api-core.js)
  timeout: 8000,
  _token: null,                      // توکن staff (بعد از ورود مدیر/کارمند)
  _refresh: null,                    // توکن تمدید staff
  _refreshing: null,
  online: true,
  // نگه‌داری توکن staff: حافظه + localStorage (تا رفرش صفحه، کارمند را بیرون نیندازد)
  setToken(t){ this._token = t; try { if(t) localStorage.setItem('rz_biz_access', t); else localStorage.removeItem('rz_biz_access'); } catch {} },
  getToken(){ return this._token; },
  setRefresh(t){ this._refresh = t; try { if(t) localStorage.setItem('rz_biz_refresh', t); else localStorage.removeItem('rz_biz_refresh'); } catch {} },
  restoreSession(){
    try {
      this._token = localStorage.getItem('rz_biz_access')||null;
      this._refresh = localStorage.getItem('rz_biz_refresh')||null;
      this._restaurantId = localStorage.getItem('rz_biz_restaurant_id')||null;
    } catch {}
    return !!this._token;
  },
  // ── شعبه‌ی فعال (چندشعبه‌ای): هدر X-Restaurant-Id، بدون نیاز به ورود دوباره ──
  _restaurantId: null,
  setActiveRestaurant(id){ this._restaurantId = id||null; try { if(id) localStorage.setItem('rz_biz_restaurant_id', id); else localStorage.removeItem('rz_biz_restaurant_id'); } catch {} },
  getActiveRestaurant(){ return this._restaurantId; },
  async request(path, opts = {}, _retried = false){
    // transportِ خام به httpJsonِ مشترک (window.httpJson از api-core.js) واگذار می‌شود؛
    // منطقِ auth (Authorization، X-Restaurant-Id، ۴۰۱→refresh→retry) اینجا و بدونِ تغییر می‌ماند.
    // ⚠️ برایِ FormData هدرِ Content-Type **نباید** ست شود: مرورگر باید خودش
    // `multipart/form-data; boundary=…` را بسازد. اگر ما 'application/json'
    // بگذاریم، boundary گم می‌شود و سرور بدنه را نمی‌تواند پارس کند — یعنی
    // هر آپلودِ فایلی بی‌صدا با «بدنه‌ی درخواست خوانده نشد» رد می‌شود.
    const isForm = typeof FormData !== 'undefined' && opts.body instanceof FormData;
    const headers = { ...(isForm ? {} : { 'Content-Type': 'application/json' }), ...(opts.headers || {}) };
    if (this._token) headers['Authorization'] = `Bearer ${this._token}`;
    if (this._restaurantId) headers['X-Restaurant-Id'] = this._restaurantId;
    const r = await httpJson(this.base + '/api/v1' + path, { ...opts, headers }, this.timeout);
    if (!r.ok && !r.offline && r.status === 401 && this._refresh && !_retried && !path.startsWith('/auth/')) {
      if (await this._doRefresh()) return this.request(path, opts, true);
      this._onSessionExpired();
    }
    if (r.ok) return { ok: true, status: r.status, data: r.data };
    if (r.offline) return { ok: false, offline: true, error: r.error };
    return { ok: false, status: r.status, error: r.error || { message: `خطای ${r.status}` } };
  },
  async _doRefresh(){
    if (this._refreshing) return this._refreshing;
    this._refreshing = (async () => {
      try {
        const res = await fetch(this.base + '/api/v1/auth/refresh', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh: this._refresh }) });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data?.access) { this.setToken(data.access); this.setRefresh(data.refresh); return true; }
        return false;
      } catch { return false; } finally { this._refreshing = null; }
    })();
    return this._refreshing;
  },
  _onSessionExpired(){ this.setToken(null); this.setRefresh(null); if (typeof onStaffSessionExpired === 'function') onStaffSessionExpired(); },
  /**
   * POSTِ بدنه‌ی خام (FormData) — بدونِ Content-Type تا مرورگر خودش
   * boundaryِ multipart را بگذارد. بقیه‌ی منطقِ auth (توکن، شعبه‌ی فعال،
   * ۴۰۱ → refresh → تلاشِ دوباره) دقیقاً همان request است.
   */
  async requestRaw(path, body, timeoutMs = 60000, _retried = false){
    const headers = {};
    if (this._token) headers['Authorization'] = `Bearer ${this._token}`;
    if (this._restaurantId) headers['X-Restaurant-Id'] = this._restaurantId;
    const r = await httpJson(this.base + '/api/v1' + path, { method: 'POST', body, headers }, timeoutMs);
    if (!r.ok && !r.offline && r.status === 401 && this._refresh && !_retried) {
      if (await this._doRefresh()) return this.requestRaw(path, body, timeoutMs, true);
      this._onSessionExpired();
    }
    if (r.ok) return { ok: true, status: r.status, data: r.data };
    if (r.offline) return { ok: false, offline: true, error: r.error };
    return { ok: false, status: r.status, error: r.error || { message: `خطای ${r.status}` } };
  },
  get(path){ return this.request(path); },
  // headers اختیاری: برای عملیاتِ حساس (مثلاً رزروِ دستی) که به Idempotency-Key نیاز دارند.
  post(path, body, headers){ return this.request(path, { method: 'POST', body: JSON.stringify(body || {}), headers }); },
  patch(path, body){ return this.request(path, { method: 'PATCH', body: JSON.stringify(body || {}) }); },
  chatList(){ return this.get('/restaurant/chats'); },
  chatMessages(id, after){ return this.get('/restaurant/chats/'+id+(after?('?after='+encodeURIComponent(after)):'')); },
  chatSend(id, body){ return this.post('/restaurant/chats/'+id, { body }); },
  delete(path){ return this.request(path, { method: 'DELETE' }); },
  // ── احراز هویت کارمند ──
  async requestStaffOtp(phone){ return this.post('/auth/staff/request', { phone }); },
  async verifyStaffOtp(phone, code){
    const res = await this.post('/auth/staff/verify', { phone, code });
    if (res.ok && res.data?.access) {
      this.setToken(res.data.access); this.setRefresh(res.data.refresh);
      // مجوزهای مؤثر از سرور — پنل بر اساس همین‌ها منو را محدود می‌کند.
      this.setPermissions(res.data.staff?.permissions || null);

  },
  // ── مجوزها ──
  // منبعِ حقیقت سرور است؛ این فقط برای پنهان‌کردنِ چیزی است که کاربر اجازه‌اش را ندارد،

  _perms: null,
  setPermissions(p){

  },
  getPermissions(){
    if (this._perms) return this._perms;
    try { const raw = localStorage.getItem('rz_perms'); if (raw) this._perms = JSON.parse(raw); } catch {}

  },
  can(key){
    const p = this.getPermissions();
    // بدونِ اطلاعِ مجوز (آفلاین/دمو) چیزی را پنهان نمی‌کنیم؛ سرور تصمیم‌گیرِ نهایی است.
    if (!p) return true;
    return p[key] !== false;
  },
  async doLogout(){
    if (this._refresh) { await fetch(this.base + '/api/v1/auth/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh: this._refresh }) }).catch(() => {}); }
    this.setToken(null); this.setRefresh(null); this.setPermissions(null);

  // ارسال پیامک کمپین یا winback

// ═══════════════════════════════════════════════════════════
//  آفلاین کامل — صف عملیات (Outbox) + همگام‌سازی خودکار
//  فلسفه: وقتی اینترنت نیست، هر عملیات محلی اجرا می‌شود (پرسنل بلافاصله
//  نتیجه را می‌بیند) و در صفی پایدار (localStorage) ذخیره می‌شود. با برگشت
//  اینترنت، صف به‌ترتیب به سرور فرستاده می‌شود. سرور — که با constraint ضد
//  رزرو دوبل محکم شده — منبع حقیقت نهایی است؛ اگر عملیاتی را رد کرد، به‌جای
//  گم‌شدن بی‌صدای داده، به پرسنل هشدار داده می‌شود تا خودش تصمیم بگیرد.
// ═══════════════════════════════════════════════════════════
const Outbox = {
  KEY: 'rz_biz_outbox',
  _queue: null,
  _syncing: false,

  // بارگذاری صف از حافظه‌ی پایدار
  load(){
    if(this._queue) return this._queue;
    try { this._queue = JSON.parse(localStorage.getItem(this.KEY) || '[]'); }
    catch { this._queue = []; }
    return this._queue;
  },
  _persist(){
    try { localStorage.setItem(this.KEY, JSON.stringify(this._queue || [])); } catch {}
    this._updateBadge();
  },
  count(){ return this.load().length; },

  // افزودن عملیات به صف. op = { type, path, method, body, label, localRef, headers }
  // ⚠️ اضافه‌شده (شکاف‌سنجی لانچ): headers اختیاری — برای Idempotency-Key، تا
  // وقتی این عملیات با برگشتِ اینترنت sync می‌شود همان کلیدی که موقعِ تلاشِ
  // آنلاینِ اولیه ساخته شد استفاده شود (نه کلیدی تازه، که یعنی سرور دوباره
  // اجرا می‌کند و رزروِ دوم می‌سازد). رجوع کن به walkinCheckinReal.
  enqueue(op){
    this.load();
    op.id = 'op_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
    op.queuedAt = Date.now();
    op.attempts = 0;
    this._queue.push(op);
    this._persist();
    return op.id;
  },

  // تلاش برای همگام‌سازی کل صف — به‌ترتیب، متوقف روی اولین خطای شبکه
  async sync(){
    if(this._syncing) return;
    if(!API.getToken()){ return; }          // بدون احراز هویت، sync معنی ندارد
    this.load();
    if(this._queue.length === 0) return;
    this._syncing = true;
    this._updateBadge('در حال همگام‌سازی...');
    const conflicts = [];
    let synced = 0;

    while(this._queue.length > 0){
      const op = this._queue[0];
      op.attempts = (op.attempts||0) + 1;
      let res;
      try {
        res = await API.request(op.path, { method: op.method || 'POST', body: op.body ? JSON.stringify(op.body) : undefined, headers: op.headers });
      } catch { res = { ok:false, offline:true }; }

      if(res.offline){
        // هنوز آفلاین — توقف، بعداً دوباره تلاش می‌کنیم (داده حفظ می‌شود)
        break;
      }
      if(res.ok){
        this._queue.shift(); synced++; this._persist();
        continue;
      }
      // سرور عملیات را رد کرد → تضاد. از صف خارج کن ولی برای هشدار نگه‌دار.
      conflicts.push({ op, error: res.error?.message || 'رد شد توسط سرور' });
      this._queue.shift(); this._persist();
    }

    this._syncing = false;
    this._updateBadge();
    // گزارش نتیجه به پرسنل
    if(synced > 0 && this._queue.length === 0 && conflicts.length === 0){
      toast('', `${fa(synced)} عملیات آفلاین با موفقیت همگام شد`);
    } else if(synced > 0){
      toast('', `${fa(synced)} عملیات همگام شد`);
    }
    if(conflicts.length > 0){ this._reportConflicts(conflicts); }
    // اگر view فعال است، تازه‌سازی کن تا وضعیت درست دیده شود
    if(synced>0 || conflicts.length>0) refreshActiveView();
  },

  // هشدار تضادها به پرسنل — تصمیم با انسان، نه گم‌شدن بی‌صدا
  _reportConflicts(conflicts){
    const list = conflicts.map(c => `<div style="padding:10px 12px;background:var(--amber-50);border-radius:10px;margin-bottom:8px;font-size:13px">
      <b>${esc(c.op.label||'عملیات')}</b><div style="color:var(--t2);margin-top:2px">${esc(c.error)}</div></div>`).join('');
    if(typeof openModal==='function'){
      openModal(`<div class="modal-title">${icon('alert',{size:18})} ${fa(conflicts.length)} عملیات نیاز به بررسی دارد</div>
        <div class="modal-sub">این عملیات‌ها هنگام آفلاین ثبت شدند ولی سرور نپذیرفت (احتمالاً میز یا زمان قبلاً پر شده). لطفاً دستی بررسی کن:</div>
        <div style="margin-top:14px">${list}</div>
        <button class="btn btn-primary btn-block" style="margin-top:8px" onclick="closeModal()">متوجه شدم</button>`);
    } else {
      toast('', `${fa(conflicts.length)} عملیات آفلاین رد شد — بررسی کن`);
    }
  },

  _updateBadge(customText){
    const el = document.getElementById('offlineBadge');
    if(!el) return;
    const n = this.count();
    if(customText){ el.textContent = customText; el.style.display='inline-flex'; return; }
    if(n > 0){ el.innerHTML = `${icon('clock',{size:13})} ${fa(n)} عملیات در انتظار همگام‌سازی`; el.style.display='inline-flex'; }
    else { el.style.display='none'; }
  },
};

const Net = {
  online: navigator.onLine !== false,
  init(){
    window.addEventListener('online', ()=>this._set(true));
    window.addEventListener('offline', ()=>this._set(false));
    this._render();
    // با شروع، اگر آنلاینیم و صف داریم، sync کن
    if(this.online) setTimeout(()=>Outbox.sync(), 1500);
  },
  _set(on){
    this.online = on;
    this._render();
    if(on){
      toast('','اینترنت برگشت — در حال همگام‌سازی...');
      Outbox.sync();
    } else {
      toast('','اینترنت قطع شد — اپ در حالت آفلاین کار می‌کند');
    }
  },
  _render(){
    let bar = document.getElementById('netBar');
    if(!bar){
      bar = document.createElement('div');
      bar.id = 'netBar';
      document.body.appendChild(bar);
    }
    if(this.online){ bar.className=''; bar.style.display='none'; }
    else {
      bar.className='net-offline';
      bar.innerHTML='<span class="net-dot"></span>حالت آفلاین — کارها محلی ذخیره می‌شوند و با برگشت اینترنت همگام می‌شوند';
      bar.style.display='flex';
    }
  },
};

<script data-src="js/analytics.js">
// ═══════════════════════════════════════════════════════════
//  رزرونو (پنل کسب‌وکار) — امیترِ رویدادِ رفتاری (Data Platform · فاز۲)
//
//  اسکریپتِ کلاسیک (global، بدونِ import/export). رویدادها را دسته‌ای و بی‌صدا
//  به POST /api/v1/telemetry می‌فرستد. هرگز چیزی نمی‌شکند (همه‌ی مسیرها try/catch)؛
//  دمومود امن. ناشناس بر پایه‌ی sessionId. بعد از data.js (کلاینتِ API) بارگذاری شود.
//  window.rzTrack(type, payload) را در دسترس می‌گذارد.
//  معماری: docs/INTELLIGENCE-PLATFORM-ARCHITECTURE.md
// ═══════════════════════════════════════════════════════════
(function () {
  'use strict';
  var SOURCE = 'business';
  var SID_KEY = 'rz_sid_biz';
  var Q_KEY = 'rz_evq_biz';
  var MAX_BATCH = 50;
  var FLUSH_AT = 10;

  function endpoint() {
    var base = (typeof API !== 'undefined' && API && API.base) ? API.base : '';
    return base + '/api/v1/telemetry';
  }
  function sessionId() {
    try {
      var s = localStorage.getItem(SID_KEY);
      if (!s) { s = 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); localStorage.setItem(SID_KEY, s); }
      return s;
    } catch (e) { return 'anon'; }
  }

  var queue = [];
  try { var raw = localStorage.getItem(Q_KEY); if (raw) queue = JSON.parse(raw) || []; } catch (e) { queue = []; }
  function persist() { try { localStorage.setItem(Q_KEY, JSON.stringify(queue.slice(-200))); } catch (e) { /* سهمیه پر */ } }

  function flush(useBeacon) {
    if (!queue.length) return;
    // روی file: (باز کردن مستقیم HTML) ارسال ممکن نیست — بی‌صدا در صف بماند
    try { if (location.protocol === 'file:' && !/^https?:/i.test(endpoint())) return; } catch (e) { /* noop */ }
    var batch = queue.slice(0, MAX_BATCH);
    var body = JSON.stringify({ events: batch });
    var url = endpoint();
    if (useBeacon) {
      try {
        if (navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], { type: 'application/json' }))) {
          queue = queue.slice(batch.length); persist(); return;
        }
      } catch (e) { /* به fetch برگرد */ }
    }
    try {
      fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true })
        .then(function (r) { if (r && r.ok) { queue = queue.slice(batch.length); persist(); } })
        .catch(function () { /* آفلاین — در صف می‌ماند */ });
    } catch (e) { /* no-op */ }
  }

  function track(type, payload) {
    try {
      queue.push({ type: String(type), occurredAt: new Date().toISOString(), source: SOURCE, sessionId: sessionId(), payload: payload || {} });
      persist();
      if (queue.length >= FLUSH_AT) flush(false);
    } catch (e) { /* no-op */ }
  }

  try {
    addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(true); });
    addEventListener('pagehide', function () { flush(true); });
  } catch (e) { /* no-op */ }

  try { if (queue.length) flush(false); } catch (e) { /* no-op */ }

  track('app.opened', {});
  try { window.rzTrack = track; } catch (e) { /* no-op */ }
})();

</script>

// ── لایه‌ی درآمد (آماده‌ی اتصال به API صندوق) ──
// نکته: سیستم صندوق جداست و هنوز API نمی‌دهد. این لایه فعلاً تخمین واقع‌گرایانه
// می‌زند؛ وقتی API صندوق آماده شد، فقط fetchRevenue را به آن وصل کن.
const REVENUE_CONFIG = {
  connected: false,                    // وقتی API صندوق وصل شد → true
  avgPerGuest: 850_000,                // میانگین خرید هر نفر (تومان) — تخمین پایه
  vipMultiplier: 1.8,                  // مشتری VIP بیشتر خرج می‌کند
  preorderMultiplier: 1.25,            // پیش‌سفارش = خرید بیشتر
};
// تخمین خرید یک رزرو (تا وقتی صندوق وصل نشده)
function estimateSpend(r){
  let base = REVENUE_CONFIG.avgPerGuest * r.party;
  if(r.seg==='vip') base *= REVENUE_CONFIG.vipMultiplier;
  if(r.pre) base *= REVENUE_CONFIG.preorderMultiplier;
  return Math.round(base);
}
// درآمد امروز (از رزروهای حاضر/تکمیل‌شده)
function calcRevenue(reservations){
  const realized = reservations.filter(r=>['arrived','seated','dining','completed','checked_in'].includes(r.status));
  const total = realized.reduce((s,r)=>s+estimateSpend(r),0);
  const guests = realized.reduce((s,r)=>s+r.party,0);
  return { total, guests, avgPerGuest: guests?Math.round(total/guests):0, count: realized.length };
}
// قالب‌بندی پول (تومان → خوانا)
function fmtMoney(t){
  if(t>=1_000_000) return fa(+(t/1_000_000).toFixed(1))+'م';
  if(t>=1000) return fa(Math.round(t/1000))+'ک';
  return fa(t);
}

// ── محاسبه‌ی KPIهای کلیدی امروز ──
function calcTodayKPIs(){
  syncTablesFromReservations();
  const today = RES.filter(r=>r.date==='today');
  const arrived = today.filter(r=>['arrived','seated','dining','checked_in'].includes(r.status));
  const expected = today.filter(r=>['confirmed','auto_confirmed','preparing'].includes(r.status));
  const noShows = today.filter(r=>r.status==='no_show'||r.status==='noshow');
  const peopleSeated = arrived.reduce((s,r)=>s+r.party,0);
  const peopleReserved = today.reduce((s,r)=>s+r.party,0);
  const seatedTables = TABLES.filter(t=>t.s==='seated').length;
  const totalTables = TABLES.length;
  const rev = calcRevenue(today);
  return {
    todayCount: today.length,
    arrivedCount: arrived.length,
    expectedCount: expected.length,
    expectedGuests: expected.reduce((s,r)=>s+r.party,0),
    noShowCount: noShows.length,
    noShowRate: today.length?Math.round((noShows.length/today.length)*100):0,
    peopleSeated, peopleReserved,
    occupancyPct: totalTables?Math.round((seatedTables/totalTables)*100):0,
    seatedTables, totalTables,
    revenue: rev.total, avgSpend: rev.avgPerGuest, revenueGuests: rev.guests,
  };
}

function dashAiInsight(){
  const k = calcTodayKPIs();
  const waiting = WAITLIST.filter(w=>w.status==='waiting').length;
  const freeTables = Math.max(0, k.totalTables - k.seatedTables);
  const parts = [];
  if(freeTables>0) parts.push(`<b>${fa(freeTables)} میز خالی</b> داری`);
  if(waiting>0) parts.push(`<b>${fa(waiting)} نفر</b> توی صف منتظرن`);
  if(k.noShowRate>15) parts.push(`نرخ نوشو امشب <b>${fa(k.noShowRate)}٪</b>ه — برای رزروهای پرریسک یادآوری بفرست`);
  if(parts.length===0) return 'همه‌چیز مرتبه — سالن پره و صف خالیه. برای پر نگه‌داشتن روزهای آینده، به مشتریان وفادار کش‌بک بده.';
  let msg = parts.join(' و ') + '. ';
  if(freeTables>0) msg += 'یک پیام کش‌بک به مشتریان وفاداری که این هفته نیامده‌اند بفرست تا میزهای خالی پر شود.';

// ── ساعات پیک (نمودار میله‌ای) ──
function renderPeakChart(){
  const hours={};
  RES.filter(r=>r.date==='today'||r.date==='past').forEach(r=>{
    const h=parseInt(String(r.t).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).split(':')[0]);
    if(!isNaN(h)) hours[h]=(hours[h]||0)+1;
  });
  const slots=[12,13,14,18,19,20,21,22];
  const max=Math.max(1,...slots.map(h=>hours[h]||0));
  document.getElementById('peakChart').innerHTML=slots.map(h=>{
    const c=hours[h]||0; const pct=Math.round((c/max)*100);
    const peak=c===max&&c>0;
    return `<div class="peak-col"><div class="peak-bar-wrap"><div class="peak-bar ${peak?'peak-hot':''}" style="height:0" data-h="${pct}"></div></div><div class="peak-hour">${fa(h)}</div></div>`;
  }).join('');
  setTimeout(()=>{document.querySelectorAll('.peak-bar').forEach(b=>b.style.height=Math.max(4,b.dataset.h)+'%')},300);
}

// ── Heatmap هفتگی (روز × بازه‌ی زمانی) ──
// بازه‌بندیِ ساعت: هم‌راستا با قواعدِ pricing.ts (ناهار ۱۲ تا ۱۵ شاملِ خودِ
// ۱۵، شب از ۱۹ به بعد). رفعِ باگ (ریویوی Copilot): مرزِ عصر قبلاً از ۱۵
// شروع می‌شد، یعنی ساعتِ ۱۵ برخلافِ pricing.ts در «عصر» می‌افتاد، نه «ظهر».
function slotOfHour(h){ if(h>=19||h<=5) return 2; if(h>=16&&h<=18) return 1; return 0; } // 0=ظهر(≤۱۵) 1=عصر(۱۶-۱۸) 2=شب(۱۹+)
function renderHeatmap(){
  const days=['ش','ی','د','س','چ','پ','ج']; // ترتیبِ نمایش: هفته‌ی ایرانی (شنبه..جمعه)
  const dowForDay=[6,0,1,2,3,4,5]; // dowِ واقعیِ Postgres برایِ هرکدام از days بالا (0=یکشنبه..6=شنبه)
  const slots=['ظهر','عصر','شب'];
  // ⚠️ رفعِ باگ: قبلاً اینجا یک جدولِ ۷×۳ کاملاً هاردکد بود («آخر هفته شب
  // شلوغ‌تر») که عیناً برایِ هر رستوران نشان داده می‌شد، حتی اگر الگویِ
  // واقعی‌اش کاملاً برعکس بود. حالا از HEATMAP_DATA واقعی (data.js:
  // loadHeatmapForDashboard ← /restaurant/analytics) پر می‌شود؛ تا وقتی
  // نیامده یا رستوران هنوز رزروِ کافی ندارد، جدول صفر (خالی) می‌ماند —
  // صفرِ واقعی به‌مراتب صادقانه‌تر از یک الگویِ ساختگیِ محتمل است.
  const grid=days.map(()=>[0,0,0]);
  (HEATMAP_DATA||[]).forEach(c=>{
    const di=dowForDay.indexOf(c.dow);
    if(di<0) return;
    grid[di][slotOfHour(c.hour)]+=(c.count||0);
  });
  let max=1;
  grid.forEach(row=>row.forEach(v=>{ if(v>max) max=v; }));
  let html='<div class="hm-grid"><div class="hm-corner"></div>'+slots.map(s=>`<div class="hm-slot-lbl">${s}</div>`).join('');
  days.forEach((d,di)=>{
    html+=`<div class="hm-day-lbl">${d}</div>`;
    slots.forEach((s,si)=>{
      const v=grid[di][si];
      const lvl=v?Math.min(4,Math.ceil((v/max)*4)):0;
      html+=`<div class="hm-cell hm-${lvl}" title="${d} ${s}: ${fa(v)} رزرو"></div>`;
    });
  });
  html+='</div><div class="hm-legend"><span>کم</span><div class="hm-scale"><i class="hm-0"></i><i class="hm-1"></i><i class="hm-2"></i><i class="hm-3"></i><i class="hm-4"></i></div><span>زیاد</span></div>';
  document.getElementById('heatmap').innerHTML=html;
}

  if(k.occupancyPct>80) insights.push({ic:'flame',t:'سالن تقریباً پره',d:'لیست انتظار را فعال نگه دار',c:'hot'});
  if(k.expectedCount>3) insights.push({ic:'clock',t:`${fa(k.expectedCount)} مهمان در راه`,d:'میزها را برای ورودشان آماده کن',c:'info'});
  const vipToday=RES.filter(r=>r.date==='today'&&r.seg==='vip').length;
  if(vipToday>0) insights.push({ic:'star',t:`${fa(vipToday)} مهمان VIP امروز`,d:'برخورد ویژه را فراموش نکن',c:'vip'});
  // ⚠️ رفعِ باگ: قبلاً اینجا همیشه «جمعه شب پرترددترین زمان توست» هاردکد
  // نشان داده می‌شد. WEEKDAY_INSIGHT از پاسخِ واقعیِ AI Restaurant Manager
  // پر می‌شود (data.js: loadWeekdayInsightForDashboard)؛ اگر داده کافی
  // نباشد null می‌ماند و این کارت به‌جایِ ادعایِ ساختگی، اصلاً نشان داده نمی‌شود.
  if(WEEKDAY_INSIGHT) insights.push({ic:'trending',t:WEEKDAY_INSIGHT.t,d:WEEKDAY_INSIGHT.d,c:'info'});
  // ⚠️ رفعِ XSS defense-in-depth: WEEKDAY_INSIGHT.t/.d از پاسخِ واقعیِ سرور
  // (AI Restaurant Manager) پر می‌شه — بقیه‌ی insightها محلی/هاردکدن، ولی
  // چون هردو در همین آرایه مخلوط می‌شن، escِ یکسان روی همه امن‌تره (روی
  // متنِ فارسیِ بدونِ کاراکترِ خاص، esc() بی‌اثر و بی‌ضرره).
  document.getElementById('insights').innerHTML=insights.slice(0,4).map(i=>`
    <div class="insight insight-${esc(i.c)}"><span class="insight-ic">${icon(i.ic,{size:16})}</span>
      <div><div class="insight-t">${esc(i.t)}</div><div class="insight-d">${esc(i.d)}</div></div></div>`).join('');
}

// ── یادداشت کارکنان (واقعی، از /restaurant/notes) ──
let STAFF_NOTES=[];
let _notesLoaded=false;
async function loadStaffNotes(){
  if(!API.getToken())return STAFF_NOTES;
  const res=await API.notes();
  if(res.ok && Array.isArray(res.data?.items)){
    STAFF_NOTES=res.data.items.map(n=>({id:n.id,who:n.author_name||'تیم',txt:n.body,pinned:n.pinned,time:faRelative(n.created_at)}));
  }
  _notesLoaded=true;
  return STAFF_NOTES;
}
function renderStaffNotes(){
  const el=document.getElementById('staffNotes');
  if(!el)return;
  if(API.getToken() && !_notesLoaded){ loadStaffNotes().then(renderStaffNotes); }
  el.innerHTML=STAFF_NOTES.length?STAFF_NOTES.map((n)=>`
    <div class="snote"${n.pinned?' style="border-color:var(--amber);background:var(--amber-50)"':''}><div class="snote-body"><div class="snote-txt">${n.pinned?icon('pin',{size:13})+' ':''}${esc(n.txt)}</div>

      <button class="snote-del" onclick="delStaffNote('${n.id||''}')">×</button></div>`).join(''):'<div class="snote-empty">یادداشتی ثبت نشده</div>';
}
function addStaffNote(){
  openModal(`<div class="modal-title">یادداشت جدید</div>
    <textarea id="noteTxt" class="inp" rows="3" placeholder="یادداشت برای تیم..." style="resize:none;margin-top:12px"></textarea>
    <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px;cursor:pointer"><input type="checkbox" id="notePin"> سنجاق کن (بالای لیست بمونه)</label>
    <button class="btn btn-primary btn-block" style="margin-top:12px" onclick="saveStaffNote()">ثبت یادداشت</button>`);
}
async function saveStaffNote(){
  const txt=document.getElementById('noteTxt')?.value.trim();
  if(!txt){toast('','یادداشت خالی است');return;}
  const pinned=document.getElementById('notePin')?.checked||false;
  if(API.getToken()){
    const res=await API.addNote({body:txt,pinned});
    if(!res.ok){toast('',res.error?.message||'ثبت ناموفق بود');return;}
    await loadStaffNotes();
  }else{
    const now=new Date();
    STAFF_NOTES.unshift({who:'شما',txt,pinned,time:fa(`${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`)});
  }
  closeModal();renderStaffNotes();toast('','یادداشت ثبت شد');
}
async function delStaffNote(id){
  if(id && API.getToken()){
    const res=await API.deleteNote(id);
    if(!res.ok){toast('',res.error?.message||'حذف ناموفق بود');return;}
    await loadStaffNotes();
  }else{
    STAFF_NOTES=STAFF_NOTES.filter(n=>String(n.id||'')!==String(id));
  }
  renderStaffNotes();
}

let liveTimer=null, liveOn=true;
function startLiveUpdates(){
  if(liveTimer)clearInterval(liveTimer);
  liveTimer=setInterval(()=>{
    if(!liveOn)return;

    const ov=document.getElementById('v-overview');

}
// ⚠️ رفعِ باگ: این تابع «به‌روزرسانیِ زنده» را وعده می‌داد ولی هیچ‌کاری
// نمی‌کرد — vals پرس‌وجو می‌شد ولی هرگز جایی نوشته نمی‌شد؛ calcTodayKPIs هم
// از هیچ سرور fetchای نمی‌گرفت، فقط دوباره روی همان RESِ ثابتِ محلی حساب
// می‌کرد. یعنی نشانگرِ «زنده» هر ۱۵ ثانیه پالس می‌زد ولی هیچ عددی
// (رزروِ امروز، اشغال، نوشو، درآمد، …) واقعاً به‌روز نمی‌شد — رستوران‌دار
// فکر می‌کرد اعداد زنده‌اند در حالی که کاملاً ایستا بودند.
// حالا: fetchِ واقعی + رندرِ کاملِ همین بخش (نه کلِ صفحه)، با نگه‌داشتنِ
// موقعیتِ اسکرول تا پرش UI نداشته باشد.
async function refreshLiveKPIs(){
  if(API.getToken()){
    // موازی: هردو مستقل‌اند (رزروها/KPI و مشتریانِ برتر). اگر رزروها ناموفق بود
    // کلِ رفرش لغو می‌شود (سیگنالِ اصلیِ «زنده‌بودن»)؛ اگر فقط guests ناموفق
    // بود، لیستِ قبلی دست‌نخورده می‌ماند — چیزِ مهمی نیست که هر ۱۵ ثانیه لازم
    // باشد حتماً تازه شود.
    const [ok]=await Promise.all([
      loadTodayReservationsForDashboard().catch(()=>false),
      loadTopGuestsForDashboard().catch(()=>false),
    ]);
    if(!ok) return; // fetch ناموفق → داده‌ی قبلی دست‌نخورده می‌ماند، پالسِ گمراه‌کننده نزن
  }
  const scroller=document.querySelector('.content');
  const y=scroller?scroller.scrollTop:0;
  renderEnterpriseDashboard();
  if(scroller) scroller.scrollTop=y;
  // نشانگر زنده‌بودن — فقط بعد از رفرشِ واقعاً موفق پالس می‌زند
  const ind=document.getElementById('liveInd');
  if(ind){ind.classList.add('pulse');setTimeout(()=>ind.classList.remove('pulse'),1000);}
}

// نقطه‌ی سبز نشون می‌داد، حتی وقتی RES/GUESTS/TABLES هنوز روی fallbackِ

// موقتِ API) — یعنی صاحبِ رستوران اسم‌های نمونه (نیلوفر رضایی، امیر
// حسینی، ...) رو با برچسبِ «زنده» می‌دید، انگار واقعاً رزروهایِ همون

const TONIGHT_FILTERS=[
  {v:'all',l:'همه'},
  {v:'soon30',l:'بعدی ۳۰ دقیقه'},
  {v:'notArrived',l:'نرسیده'},
  {v:'arrived',l:'رسیده'},
];
const TONIGHT_NOT_ARRIVED=['pending','confirmed','auto_confirmed','preparing','running_late'];
const TONIGHT_ARRIVED=['checked_in','arrived','seated','dining'];
function tonightFilterSet(f){tonightFilter=f;renderResList();}
/** «HH:MM» فارسی/انگلیسی → دقیقه از نیمه‌شب، برای مرتب‌سازیِ زمانی. نامعتبر → Infinity (آخرِ لیست). */
function timeToMinutes(t){
  const s=String(t||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  const m=s.match(/^(\d{1,2}):(\d{2})/);
  if(!m)return Infinity;
  return (+m[1])*60+(+m[2]);
}
function rReservations(){
  document.getElementById('v-reservations').innerHTML=`
    <div class="pg-head"><div class="pg-title">رزروها</div><div class="pg-sub">مدیریت و جستجوی همه‌ی رزروهای امروز و آینده</div></div>
    <!-- جستجو -->
    <div class="search-res">
      <div class="search-box">
        <span class="s-ic">${icon('search',{size:16})}</span>
        <input id="resSearch" placeholder="جستجو با نام، فامیل یا شماره تلفن..." value="${esc(resQuery)}" oninput="searchRes(this.value)">
        <button class="s-clear ${resQuery?'show':''}" onclick="clearResSearch()">×</button>
      </div>
      <button class="btn btn-primary" onclick="openManual()">${icon('plus',{size:16})} رزرو جدید</button>
    </div>
    <!-- تاریخ -->
    <div class="date-tabs">
      <button class="date-tab ${resDate==='today'?'active':''}" onclick="setResDate('today')">${icon('calendar',{size:14})} امروز</button>
      <button class="date-tab ${resDate==='tomorrow'?'active':''}" onclick="setResDate('tomorrow')">فردا</button>
      <button class="date-tab ${resDate==='upcoming'?'active':''}" onclick="setResDate('upcoming')">روزهای آینده</button>
      <button class="date-tab ${resDate==='past'?'active':''}" onclick="setResDate('past')">${icon('inbox',{size:14})} گزارش گذشته</button>
      <button class="date-tab ${resDate==='all'?'active':''}" onclick="setResDate('all')">همه</button>
    </div>
    ${resDate==='today'?`<div class="tonight-filters">${TONIGHT_FILTERS.map(f=>`<button class="chip ${tonightFilter===f.v?'is-active':''}" aria-pressed="${tonightFilter===f.v}" onclick="tonightFilterSet('${f.v}')">${f.l}</button>`).join('')}</div>`:''}
    <div class="panel">
      <div id="resTL"></div>
    </div>`;
  renderResList();
}
async function renderResList(){
  const el=document.getElementById('resTL');
  if(!el)return;
  // اگر توکن staff داریم، رزروها را از API بگیر (بر اساس تاریخ انتخاب‌شده)
  let source=RES, isDemo=true;
  if(API.getToken()){
    el.innerHTML=`<div style="text-align:center;padding:30px;color:var(--t2)">در حال بارگذاری رزروها...</div>`;
    const fresh=await loadReservations(resDate);
    if(fresh!==null){ source=fresh; isDemo=false; } // داده‌ی واقعی؛ در غیر این صورت نمونه
  }
  // ⚠️ رفعِ باگِ صداقتِ داده (یافته‌ی زنده): تا اینجا این تب هیچ‌وقت نمی‌گفت
  // که فهرست الان نمونه است — یعنی رستوران‌دار (بدونِ توکن، یا وقتی API
  // موقتاً جواب نمی‌داد) اسم/شماره‌ی مهمانانِ ساختگی را عینِ رزروهایِ واقعیِ
  // خودش می‌دید.
  const demoNote=isDemo?`<div class="cash-note" style="margin-bottom:14px">${icon('info',{size:13})} این فهرست نمونه است، رزروهایِ واقعیِ تو نیست.</div>`:'';
  let list=source.map((r,i)=>({r,i}));
  // API از قبل بر اساس تاریخ فیلتر کرده؛ نمونه باید محلی فیلتر شود
  if(resDate!=='all' && !API.online)list=list.filter(x=>x.r.date===resDate);
  if(resQuery.trim()){
    const q=resQuery.trim().replace(/\s/g,'');
    const qFa=toFaDigits(q);
    list=list.filter(x=>{
      const name=x.r.name.replace(/\s/g,'');
      const phone=(x.r.phone||'').replace(/\s/g,'');
      return name.includes(resQuery.trim())||phone.includes(q)||phone.includes(qFa);
    });
  }
  // ⚠️ اضافه‌شده (Part 2 — Tonight Board، ۲۰۲۶-۰۸-۱۴): تبِ «امروز» = تخته‌ی
  // امشب — همیشه بر اساسِ ساعت مرتب و طبقِ فیلترِ فعال محدود می‌شود. تبِ‌های
  // دیگر (فردا/آینده/گذشته/همه) دست‌نخورده می‌مانند — این‌ها «امشب» نیستند.
  if(resDate==='today'){
    list.sort((a,b)=>timeToMinutes(a.r.t)-timeToMinutes(b.r.t));
    if(tonightFilter==='notArrived')list=list.filter(x=>TONIGHT_NOT_ARRIVED.includes(x.r.status));
    else if(tonightFilter==='arrived')list=list.filter(x=>TONIGHT_ARRIVED.includes(x.r.status));
    else if(tonightFilter==='soon30'){
      const now=new Date(); const nowMin=now.getHours()*60+now.getMinutes();
      list=list.filter(x=>{const t=timeToMinutes(x.r.t); return t>=nowMin && t<=nowMin+30;});
    }
  }
  const dateLabel={today:'امروز',tomorrow:'فردا',upcoming:'روزهای آینده',past:'گذشته',all:'همه روزها'}[resDate];
  if(!list.length){
    el.innerHTML=`<div class="empty-state"><div class="empty-state-icon">${resDate==='past'?icon('inbox',{size:40}):icon('search',{size:40})}</div><div style="font-weight:700;margin-bottom:4px">رزروی پیدا نشد</div><div style="font-size:13px">${resQuery?'با این جستجو نتیجه‌ای نبود':'برای '+dateLabel+' رزروی نیست'}</div></div>`;
    return;
  }
  // گزارش گذشته: خلاصه‌ی آماری بالا
  if(resDate==='past'){
    const done=list.filter(x=>x.r.status==='completed'||x.r.status==='arrived').length;
    const noshow=list.filter(x=>x.r.status==='noshow').length;
    const cancelled=list.filter(x=>x.r.status==='cancelled').length;
    el.innerHTML=demoNote+`
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px">
        <div style="background:var(--green-50);border:1px solid #BBF7D0;border-radius:var(--r);padding:12px;text-align:center"><div style="font-size:22px;font-weight:800;color:#15803D">${fa(done)}</div><div style="font-size:11px;color:var(--t2);font-weight:600">${icon('check',{size:12})} انجام‌شده</div></div>
        <div style="background:var(--amber-50);border:1px solid #FDE68A;border-radius:var(--r);padding:12px;text-align:center"><div style="font-size:22px;font-weight:800;color:#D97706">${fa(noshow)}</div><div style="font-size:11px;color:var(--t2);font-weight:600">${icon('alert',{size:12})} نیومدن (no-show)</div></div>
        <div style="background:var(--red-50);border:1px solid #FECACA;border-radius:var(--r);padding:12px;text-align:center"><div style="font-size:22px;font-weight:800;color:#B91C1C">${fa(cancelled)}</div><div style="font-size:11px;color:var(--t2);font-weight:600">${icon('close',{size:12})} لغوشده</div></div>
      </div>`+
      list.map(x=>resItemHTML(x.r,x.i)).join('');
    return;
  }
  const seated=list.filter(x=>x.r.status==='arrived').length;
  el.innerHTML=demoNote+`<div style="font-size:13px;color:var(--t2);margin-bottom:14px;font-weight:600">${fa(list.length)} رزرو · ${fa(seated)} مهمان رسیده${resQuery?` · نتایج «${esc(resQuery)}»`:''}</div>`+
    list.map(x=>resItemHTML(x.r,x.i)).join('');
}
// تبدیل ارقام انگلیسی به فارسی برای جستجوی تلفن
function toFaDigits(s){return s.replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function searchRes(v){resQuery=v;document.querySelector('.s-clear')?.classList.toggle('show',!!v);renderResList()}
function clearResSearch(){resQuery='';const i=document.getElementById('resSearch');if(i)i.value='';document.querySelector('.s-clear')?.classList.remove('show');renderResList()}
function setResDate(d){resDate=d;rReservations()}

// همون اسم‌ها/آیکون‌هایی که در اپِ کاستومر (features/economy.js) نشون داده

  return `<span class="tl-tag" style="color:${b.fg};background:${b.fg}1a" title="اعتبارِ رزروِ این مشتری بر اساسِ سابقه‌ی به‌موقع‌بودنش">${icon(b.ic,{size:11})} ${b.name}</span>`;
}
function resItemHTML(r,i){
  const isPast=['completed','noshow','no_show','cancelled','auto_cancelled','rejected','expired'].includes(r.status);
  const statusChip=(STATUS_META[r.status]?`<span class="chip-status" style="background:${STATUS_META[r.status].bg};color:${STATUS_META[r.status].fg}">${icon(STATUS_META[r.status].icon,{size:12})} ${STATUS_META[r.status].label}</span>`:'');
  // ⚠️ اضافه‌شده (Part 2 — Tonight Board، ۲۰۲۶-۰۸-۱۴): دکمه‌های عملیاتی دیگر
  // بر اساسِ حدسِ ثابت («اگه arrived نیست دکمه‌ی رسید رو نشون بده») نیستند —
  // مستقیماً از STATUS_TRANSITIONS (آینه‌ی lifecycle.ts بک‌اند) می‌آیند، یعنی
  // هیچ‌وقت دکمه‌ای که سرور رد می‌کند نشان داده نمی‌شود (MUST #7 ماموریت).

  return `<div class="tl-item"><div class="tl-time"><div class="tl-time-v">${r.t}</div></div>
    <div class="tl-card ${r.status}${r.seg==='vip'?' vip':''}"${isPast?' style="opacity:.92"':''}>
      <div style="display:flex;justify-content:space-between;align-items:flex-start">
        <div class="tl-name">${esc(r.name)} ${r.seg==='vip'?'<span class="tl-tag vip">VIP</span>':r.seg==='new'?'<span class="tl-tag new">جدید</span>':''} ${reputationBadgeHTML(r.reputationTier)}</div>
        ${statusChip}
      </div>
      <div class="tl-meta">${dateBadge}${icon('users',{size:13})} ${fa(r.party)} نفر · میز ${fa(r.table)} · ${icon('phone',{size:13})} ${esc(r.phone)} ${r.pre?`· ${icon('utensils',{size:12})} پیش‌سفارش`:''}</div>
      ${r.note?`<div class="tl-meta" style="color:#D97706">${icon('inbox',{size:13})} ${esc(r.note)}</div>`:''}
      ${r.cancelReason?`<div class="tl-meta" style="color:#B91C1C">${icon('alert',{size:13})} دلیل لغو: ${esc(r.cancelReason)}</div>`:''}
      ${!isPast?`<div class="tl-actions">
        ${allowed.includes('checked_in')?`<button class="btn btn-teal ${actBtn}" onclick="markArrived(${i})">${icon('check',{size:14})} رسید</button>`:''}
        ${allowed.includes('seated')?`<button class="btn btn-primary ${actBtn}" onclick="markSeated(${i})">${icon('utensils',{size:14})} نشاند</button>`:''}
        ${allowed.includes('no_show')?`<button class="btn btn-ghost ${actBtn}" onclick="markNoShow(${i})">${icon('alert',{size:14})} نیومد</button>`:''}
        <button class="btn btn-ghost btn-sm" onclick="openStatusMenu(${i})">${icon('refresh',{size:14})} وضعیت</button>
        <button class="btn btn-ghost btn-sm" onclick="toast('','تماس با '+${JSON.stringify(esc(r.name))})">تماس</button>
        ${allowed.includes('cancelled')?`<button class="btn btn-danger ${actBtn}" onclick="cancelRes(${i})">لغو</button>`:''}
      </div>`:`<div class="tl-actions"><button class="btn btn-ghost btn-sm" onclick="viewHistory(${i})">${icon('inbox',{size:14})} تاریخچه</button><button class="btn btn-ghost btn-sm" onclick="toast('','تماس با '+${JSON.stringify(esc(r.name))})">تماس</button>${r.status==='completed'?`<button class="btn btn-ghost btn-sm" onclick="openManual()">رزرو مجدد</button>`:''}</div>`}
    </div></div>`;
}
// ⚠️ رفعِ باگِ زنده (Tonight Board، ۲۰۲۶-۰۸-۱۴): این تابع قبلاً وقتی آنلاین
// بود هیچ‌وقت PATCHِ واقعیِ تغییرِ وضعیت رو صدا نمی‌زد — فقط وضعیت رو محلی
// عوض می‌کرد و پیامکِ خوش‌آمد می‌فرستاد؛ یعنی سرور هیچ‌وقت نمی‌فهمید مهمان
// رسیده (رزرو برای بقیه‌ی سیستم‌ها — مثلِ پلانِ سالن یا گزارش — همچنان
// «نرسیده» می‌موند). حالا از مسیرِ واحدِ changeStatus (optimistic + PATCHِ
// واقعی + rollback روی خطا) استفاده می‌شه؛ رفتارِ صف‌بندیِ آفلاینِ قبلی
// (Outbox) هم عیناً حفظ شده چون آن بخش واقعاً درست بود.
async function markArrived(i){
  const r=RES[i]; if(!r)return;
  if(isOffline() && API.getToken()){
    r.status='checked_in';rReservations();
    Outbox.enqueue({ type:'checkin', path:`/restaurant/reservations/${r.code||r.id||''}/status`, method:'PATCH', body:{ status:'checked_in' }, label:`ثبت ورود ${r.name}` });
    toast('',`${r.name} رسید — با برگشت اینترنت همگام می‌شود`);
    return;
  }
  const phone=r.phone;
  await changeStatus(i,'checked_in');
  // ارسال پیامکِ خوش‌آمد فقط بعد از تأییدِ واقعیِ تغییرِ وضعیت (نه قبلش)
  if(API.getToken() && phone){
    const res=await API.sendSms({kind:'campaign',phones:[phone.replace(/\s/g,'')],message:'welcome'});
    if(res.ok)toast('',`پیامکِ خوش‌آمد برایِ ${r.name} ارسال شد`);
  }
}
async function markSeated(i){
  await changeStatus(i,'seated');
}
// no_show وضعیتِ نهایی/برگشت‌ناپذیره (STATUS_TRANSITIONS['no_show']=[]) —
// طبقِ ماموریت با تأییدِ صریح انجام می‌شه تا لمسِ اشتباه، رزروِ واقعی رو خراب نکنه.
async function markNoShow(i){
  const r=RES[i]; if(!r)return;
  if(!window.confirm(`${r.name} به‌عنوانِ «نیومد» ثبت بشه؟ این وضعیت برگشت‌پذیر نیست.`))return;
  await changeStatus(i,'no_show');
}
function cancelRes(i){
  openModal(`<div class="modal-title">لغو رزرو</div><div class="modal-sub">${esc(RES[i].name)} — ساعت ${esc(RES[i].t)}</div>
    <div class="field-label">دلیل لغو (الزامی)</div>
    <input class="inp" id="cancelReason" placeholder="مثلاً تماس مشتری، تداخل میز...">
    <div style="display:flex;gap:8px"><button class="btn btn-danger btn-lg" style="flex:1" onclick="doCancelRes(${i})">تأیید لغو</button><button class="btn btn-ghost btn-lg" onclick="closeModal()">انصراف</button></div>`);
}
// ⚠️ رفعِ باگِ زنده: قبلاً این تابع فقط RES.splice(i,1) می‌کرد — هیچ درخواستِ
// واقعی به بک‌اند نمی‌رفت، یعنی رزرو از پنل محو می‌شد ولی روی سرور همچنان
// فعال می‌موند (میزِ رزروشده هیچ‌وقت واقعاً آزاد نمی‌شد). حالا از مسیرِ
// واحدِ changeStatus استفاده می‌کنیم — هم دلیل رو می‌فرسته، هم واقعاً PATCH
// می‌زنه، هم روی خطای واقعی rollback می‌کنه (RES.splice هم دیگه حذف نمی‌کنه؛
// رزروِ لغوشده در تاریخچه/تبِ گذشته باقی می‌مونه — درست‌تر از پاک‌کردنِ کامل).
async function doCancelRes(i){
  const reason=document.getElementById('cancelReason').value.trim();
  if(!reason){toast('','دلیل لغو الزامیه');return}
  await changeStatus(i,'cancelled',reason);
}
// تولید تاریخ‌های شمسی تا ۱ ماه آینده (نمونه: از پنجشنبه ۱۵ خرداد)
function buildDateOptions(){
  const weekdays=['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه','جمعه'];
  const months=['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
  const monthLen=[31,31,31,31,31,31,30,30,30,30,30,29];
  // شروع: پنجشنبه ۱۵ خرداد (ماه index 2)، پنجشنبه = index 5 در weekdays
  let day=15, mon=2, wd=5;
  let opts='';
  for(let i=0;i<=30;i++){
    const label=`${weekdays[wd]} ${fa(day)} ${months[mon]}`;
    const val=i===0?'today':i===1?'tomorrow':'d'+i;
    const prefix=i===0?'امروز — ':i===1?'فردا — ':'';
    opts+=`<option value="${val}" data-label="${label}">${prefix}${label}</option>`;
    // پیش‌رفتن یک روز
    wd=(wd+1)%7;
    day++;
    if(day>monthLen[mon]){day=1;mon=(mon+1)%12}
  }
  return opts;
}
// تبدیل مقدار تاریخ پنل (today/tomorrow/dN) و ساعت فارسی به فرمت ISO که بک‌اند می‌خواهد
function manualDateToISO(dateVal, faTime){
  const now=new Date();
  let offset=0;
  if(dateVal==='tomorrow')offset=1;
  else if(/^d\d+$/.test(dateVal))offset=parseInt(dateVal.slice(1))||0;
  const t=new Date(now); t.setDate(now.getDate()+offset);
  const iso=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  const time=String(faTime||'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).trim()||'20:00';
  return {date:iso,time};
}

// ثبت واقعی ورود — وصل به POST /restaurant/walkin (پیدا/ساخت کاربر + عضویت باشگاه + رزرو seated + اشغال میز)
async function walkinCheckinReal(phone,firstName,lastName,birthDayMonth){
  const party=+(document.querySelector('.wparty-group .opt.sel')?.dataset.p||2);
  const tableId=document.getElementById('wTable')?.value||null;
  const btn=document.getElementById('wConfirmBtn');
  if(btn){btn.disabled=true;btn.textContent='در حال ثبت...';}
  const body={phone,party_size:party,table_id:tableId||undefined};
  if(firstName){body.first_name=firstName;body.last_name=lastName||'';}
  if(birthDayMonth){body.birth_day=birthDayMonth[0];body.birth_month=birthDayMonth[1];}
  // ⚠️ اضافه‌شده (شکاف‌سنجی لانچ، ۲۰۲۶-۰۸-۱۵): قبلاً این مسیر هیچ Idempotency-Key
  // نمی‌فرستاد — دابل‌تپِ «ثبت ورود» (یا حتی retryِ خودکارِ شبکه) می‌توانست دو
  // رزروِ seated + دو عضویتِ باشگاه برایِ همون مهمان بسازد. یک کلید برایِ کلِ
  // تلاش (آنلاین یا صف‌شده‌ی آفلاین) ساخته می‌شود تا sync بعدی هم همون کلید را بفرسته.
  const idemHeaders={ 'Idempotency-Key': genIdempotencyKey() };
  const res=await API.walkin(body, idemHeaders);
  if(!res.ok){
    // آفلاین → محلی ثبت کن و برای همگام‌سازی صف کن (واک‌این نباید در قطعی اینترنت بخوابد)
    if(res.offline){
      const nm=(firstName?firstName+(lastName?' '+lastName:''):'مهمان واک‌این');
      const localRec={t:new Date().toLocaleTimeString('fa-IR',{hour:'2-digit',minute:'2-digit'}),name:nm,party,table:tableId||null,status:'arrived',seg:'new',pre:false,note:'واک‌این (آفلاین)',phone,date:'today',dLabel:'امروز'};
      RES.push(localRec);
      if(API.getToken()){
        Outbox.enqueue({ type:'walkin', path:'/restaurant/walkin', method:'POST', body, headers:idemHeaders, label:`واک‌این ${nm}${tableId?' · میز':''}`, localRef:localRec });
      }
      closeModal();
      if(document.getElementById('v-overview').classList.contains('active'))rOverview();
      else if(document.getElementById('v-floor').classList.contains('active'))rFloor();
      toast('',`${nm} محلی ثبت شد — با برگشت اینترنت همگام می‌شود`);
      return;
    }
    toast('',res.error?.message||'ثبت ورود ناموفق بود');
    if(btn){btn.disabled=false;btn.textContent='ثبت ورود';}
    return;
  }
  closeModal();
  // داده‌های واقعی رو دوباره بکش (باشگاه، میزها، رزروهای امروز)
  await Promise.all([loadTables(), loadClubMembers().then(c=>CLUB=c)]);
  if(document.getElementById('v-overview').classList.contains('active'))rOverview();
  else if(document.getElementById('v-reservations').classList.contains('active')){resDate='today';rReservations()}
  else if(document.getElementById('v-floor').classList.contains('active'))rFloor();
  toast('',`${res.data.name} ثبت ورود شد${tableId?' · میز اختصاص یافت':''}`);
  if(res.data.enrolled_now) setTimeout(()=>toast('',`عضو باشگاه شد (${res.data.club_code})`),900);
}

async function saveManual(){
  const n=document.getElementById('mName').value.trim();
  if(!n){toast('','نام مهمان رو وارد کن');return}
  const phone=document.getElementById('mPhone').value;
  const dateSel=document.getElementById('mDate');
  const dateVal=dateSel.value;
  const opt=dateSel.options[dateSel.selectedIndex];
  const dLabel=opt.dataset.label||opt.text.replace(/^(امروز|فردا)\s*—\s*/,'').trim();
  const dateKey=(dateVal==='today'||dateVal==='tomorrow')?dateVal:'upcoming';
  const timeVal=document.getElementById('mTime').value;
  const partyVal=+document.getElementById('mParty').value.replace(/[^\d]/g,'')||2;
  const tableVal=+document.getElementById('mTable').value.replace(/[^\d]/g,'')||1;
  // ⚠️ اضافه‌شده (شکاف‌سنجی لانچ، ۲۰۲۶-۰۸-۱۵): یک کلید برایِ کلِ تلاش (چه
  // درخواستِ آنلاینِ زیر موفق شود چه به مسیرِ آفلاینِ Outbox بیفتد) — تا اگر
  // درخواستِ اول واقعاً به سرور رسیده باشد ولی پاسخش گم شده، retry/صف‌شدنِ
  // بعدی با همون کلید replay شود، نه رزروِ دومی بسازد.
  const manualIdemKey=genIdempotencyKey();

  // اگر توکن staff داریم، رزرو واقعی در دیتابیس ثبت کن
  if(API.getToken()){
    const dt=manualDateToISO(dateVal,timeVal);
    const res=await API.post('/reservations',{
      restaurant_id:STAFF_INFO?.restaurant_id||undefined,
      date:dt.date,time:dt.time,party_size:partyVal,notify_sms:!!phone,
      guest:{name:n,phone:phone,table_number:tableVal,note:'رزرو دستی'},
    },{ 'Idempotency-Key': manualIdemKey });
    if(res.ok){
      // موفق در سرور — به‌علاوه‌ی نمایش محلی
      RES.push({t:timeVal,name:n,party:partyVal,table:tableVal,status:'confirmed',seg:'new',pre:false,note:'رزرو دستی',phone,date:dateKey,dLabel,code:res.data?.reservation?.code});
      const clubBefore=CLUB.length;
      CLUB=await loadClubMembers(); // وضعیت واقعی باشگاه رو از سرور بگیر، حدس نزن
      const newlyEnrolled=CLUB.length>clubBefore;
      closeModal();resDate=dateKey;
      if(document.getElementById('v-reservations').classList.contains('active'))rReservations();
      else if(document.getElementById('v-overview').classList.contains('active'))rOverview();
      toast('',`رزرو ${dLabel} در سیستم ثبت شد${newlyEnrolled?` + ${n} به باشگاه اضافه شد`:''}`);
      return;
    }
    if(!res.offline){toast('',res.error?.message||'ثبت رزرو ناموفق بود');return;}
    // اگر offline، می‌افتد به مسیر محلی پایین
  }

  // مسیر محلی (آفلاین یا بدون توکن) — fallback
  const localRec={t:timeVal,name:n,party:partyVal,table:tableVal,status:'confirmed',seg:'new',pre:false,note:'رزرو دستی',phone,date:dateKey,dLabel};
  RES.push(localRec);
  // اگر آفلاین بودیم (نه فقط بدون توکن)، عملیات را برای همگام‌سازی بعدی صف کن
  if(isOffline() && API.getToken()){
    Outbox.enqueue({
      type:'reservation', path:'/reservations', method:'POST',
      body:{ restaurant_id:'self', date:dateKey, time:timeVal, party_size:partyVal, guest:{name:n,phone:phone.replace(/\s/g,'')} },
      headers:{ 'Idempotency-Key': manualIdemKey },
      label:`رزرو ${n} · ${dLabel} ${timeVal}`, localRef:localRec,
    });
  }
  const res=enrollClub(n,phone);
  closeModal();
  resDate=dateKey;
  if(document.getElementById('v-reservations').classList.contains('active'))rReservations();
  else if(document.getElementById('v-overview').classList.contains('active'))rOverview();
  if(res.enrolled){
    toast('',`رزرو ${dLabel} ثبت شد + ${n} به باشگاه اضافه شد (${res.member.code})`);
  }else if(res.reason==='exists'){
    toast('',`رزرو ${dLabel} ثبت شد · ${n} قبلاً عضو باشگاهه`);
  }else{
    toast('',`رزرو ${dLabel} ثبت شد`);
  }
}

// ═══════════ FLOOR PLAN ═══════════
// هماهنگ‌سازی وضعیت میزها با رزروهای فعال امروز
// میزی که رزرو «تأییدشده»ی امروز داره → reserved (اگه دستی seated نشده باشه)
// میزی که مهمانش «رسیده» → seated
function syncTablesFromReservations(){
  const todayRes=RES.filter(r=>r.date==='today'&&r.table>0&&(r.status==='confirmed'||r.status==='arrived'));
  TABLES.forEach(t=>{
    // اگه دستی روی این میز وضعیت seated گذاشته شده و رزروی نیست، دست نزن
    const res=todayRes.find(r=>r.table===t.n);
    if(res){
      // رزرو فعال داره
      if(res.status==='arrived')t.s='seated';
      else if(t.s!=='seated')t.s='reserved'; // اگه قبلاً نشسته نشده، رزرو
      t._guest=res.name; // نام مهمان برای نمایش
      t._time=res.t;
    }else{
      // رزرو فعالی روی این میز نیست — اطلاعات مهمان رو پاک کن
      delete t._guest;delete t._time;
      // اگه قبلاً reserved بوده ولی دیگه رزرو نداره، آزادش کن (مگه دستی seated شده)
      if(t.s==='reserved')t.s='free';
    }
  });
}

async function promoteNextWL(){

function tableLabel(t){ return t.name && t.name.trim() ? t.name.trim() : 'میز '+fa(t.n); }

// افزودن میز — با انتخاب ظرفیت و اسم دلخواه اختیاری
function addTable(){
  const nextNum=TABLES.length?Math.max(...TABLES.map(t=>t.n))+1:1;
  openModal(`
    <div class="modal-title">افزودن میز جدید</div>

async function confirmAddTable(num){

function removeTable(i){

        <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeModal()">انصراف</button>
      </div>`);
    return;
  }
  doRemoveTable(i);
}
async function doRemoveTable(i){
  const t=TABLES[i];
  const res = await API.deleteTable(t.id);
  if(!res.ok){ closeModal(); toast('', res.error?.message||'حذف ناموفق بود — احتمالاً رزرو فعال داره'); return; }
  lastRemoved={table:t,idx:i};
  await loadTables();
  closeModal();rFloor();
  toastUndo(`میز ${fa(lastRemoved.table.n)} حذف شد`,'undoRemoveTable');
}
async function undoRemoveTable(){
  if(!lastRemoved)return;
  const t=lastRemoved.table;
  const res = await API.createTable({ number:t.n, capacity:t.c, name:t.name });
  if(!res.ok){ toast('','برگردوندن میز ناموفق بود — شاید شماره‌ش گرفته شده'); lastRemoved=null; return; }
  lastRemoved=null;
  await loadTables();rFloor();toast('','برگردانده شد');
}

let pendingTable=null;
function openTableSheet(i){
  pendingTable=i;
  const t=TABLES[i];
  const opts=[
    ['free','var(--green)','آزاد','میز خالی و آماده‌ی پذیرش'],
    ['reserved','var(--blue)','رزروشده','میز رزرو شده، مهمان نیومده'],
    ['seated','var(--amber)','نشسته','مهمان سر میز نشسته']
  ];
  openModal(`
    <div class="modal-title">${esc(tableLabel(t))} <span style="font-weight:400;color:var(--t2);font-size:14px">· ${fa(t.c)} نفره</span></div>
    <div class="modal-sub">وضعیت میز رو انتخاب کن، بعد تأیید بزن</div>
    <div class="tbl-actions" id="tblOpts">
      ${opts.map(([s,col,name,desc])=>`
        <div class="tbl-act ${t.s===s?'sel':''}" data-s="${s}" onclick="document.querySelectorAll('#tblOpts .tbl-act').forEach(o=>o.classList.remove('sel'));this.classList.add('sel')">
          <span class="ta-dot" style="background:${col}"></span>
          <div class="ta-txt"><div class="ta-name">${name}</div><div class="ta-desc">${desc}</div></div>
          <span class="ta-check">${icon('check',{size:13})}</span>
        </div>`).join('')}
    </div>
    <div class="field-label" style="margin-top:14px">اسم میز <span style="color:var(--t3);font-weight:400">(اختیاری)</span></div>
    <input class="inp" id="tblRename" value="${esc(t.name||'')}" placeholder="میز ${fa(t.n)}" style="width:100%">
    <button class="btn btn-primary btn-block" style="margin-top:14px" onclick="confirmTableStatus()">تأیید تغییر</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeModal()">انصراف</button>
  `);
}
async function confirmTableStatus(){
  if(pendingTable===null)return;
  const sel=document.querySelector('#tblOpts .tbl-act.sel');
  if(!sel)return;
  const i=pendingTable;
  const t=TABLES[i];
  const newS=sel.dataset.s, old=t.s;
  const newName=(document.getElementById('tblRename')?.value||'').trim();
  const oldName=t.name||'';
  const nameChanged=newName!==oldName;
  if(newS===old && !nameChanged){closeModal();return}

  if(nameChanged){
    const res=await API.updateTable(t.id,{name:newName||null});
    if(!res.ok){toast('',res.error?.message||'تغییر نام ناموفق بود');return;}
  }
  if(newS!==old){
    const res=await API.setTableState(t.id, UI2BK_STATE[newS]);
    if(!res.ok){toast('',res.error?.message||'تغییر وضعیت ناموفق بود');return;}
  }
  await loadTables();
  pendingTable=null;
  closeModal();
  if(document.getElementById('v-overview').classList.contains('active'))rOverview();
  else rFloor();
  const names={free:'آزاد',reserved:'رزروشده',seated:'نشسته'};
  if(newS!==old) toast('',`${tableLabel(t)} → ${names[newS]}`);
  else toast('',`اسم میز به «${esc(newName||tableLabel(t))}» تغییر کرد`);
}
function toastUndo(msg,undoFn){
  const t=document.getElementById('toast');
  document.getElementById('toastIcon').innerHTML=icon('close',{size:16});
  document.getElementById('toastMsg').innerHTML=msg+` <button class="undo-btn" onclick="${undoFn}();document.getElementById('toast').classList.remove('show')">بازگردانی</button>`;
  t.classList.add('show','with-undo');
  clearTimeout(tt);tt=setTimeout(()=>{t.classList.remove('show','with-undo')},5000);
}

}

// می‌ماند: نه به سرور می‌رسید، نه رفرشِ صفحه دووم می‌آورد، نه رستوران‌های

// تا لوگویِ واقعی تأیید شود — با برندِ واقعی اشتباه گرفته نمی‌شود.

  const grads=[
    'linear-gradient(135deg,#34D399,#059669)',
    'linear-gradient(135deg,#2563EB,#14B8A6)',
    'linear-gradient(135deg,#F59E0B,#EF4444)',
    'linear-gradient(135deg,#8B5CF6,#EC4899)',
    'linear-gradient(135deg,#0EA5E9,#6366F1)',

    <button class="btn btn-ghost btn-block" style="margin-top:10px" onclick="document.getElementById('logoInput').click()" id="logoUploadBtn">${icon('upload',{size:15})} ${logoPhoto?'آپلودِ عکسِ جدید':'آپلود عکس لوگو'}</button>
    <input type="file" id="logoInput" accept="image/jpeg,image/png,image/webp" style="display:none" onchange="handleLogoUpload(this)">

      ${emojis.map(e=>`<div class="logo-emoji-opt ${e===logoChoice.emoji?'sel':''}" onclick="pickLogoEmoji('${e}')">${e}</div>`).join('')}
    </div>
    <div class="field-label">رنگ پس‌زمینه</div>
    <div class="logo-grad-grid" id="logoGradGrid">
      ${grads.map((g,gi)=>`<div class="logo-grad-opt ${g===logoChoice.gradient?'sel':''}" data-gi="${gi}" style="background:${g}" onclick="pickLogoGrad(${gi},'${g}')"></div>`).join('')}
    </div>

function refreshLogoPreview(){
  const pv=document.getElementById('logoPreview');
  if(!pv || currentLogoPhoto())return; // وقتی عکسِ واقعی هست، پیش‌نمایشِ ایموجی جایگزینش نمی‌شود
  pv.style.background=logoChoice.gradient;pv.textContent=logoChoice.emoji;
}
function pickLogoEmoji(e){
  logoChoice.emoji=e;
  document.querySelectorAll('#logoEmojiGrid .logo-emoji-opt').forEach(o=>o.classList.toggle('sel',o.textContent===e));
  refreshLogoPreview();
}
function pickLogoGrad(gi,g){
  logoChoice.gradient=g;
  document.querySelectorAll('#logoGradGrid .logo-grad-opt').forEach(o=>o.classList.toggle('sel',+o.dataset.gi===gi));
  refreshLogoPreview();
}
async function handleLogoUpload(input){
  const file=input.files?.[0];
  input.value='';
  if(!file)return;
  if(!PHOTO_TYPES.includes(file.type)){toast('','فقط JPEG، PNG یا WebP مجازه');return}
  if(file.size>PHOTO_MAX_BYTES){toast('',`حجم عکس نباید از ${PHOTO_MAX_BYTES/1024/1024} مگابایت بیشتر باشه`);return}
  const btn=document.getElementById('logoUploadBtn');
  if(btn){btn.disabled=true;btn.textContent='در حال آپلود…';}
  const res=await API.uploadPhoto(file,{category:'logo'});
  await loadGallery();
  refreshLogoDisplay();
  if(res.ok){
    toast('','عکس لوگو آپلود شد و برای تأیید فرستاده شد');
    closeModal();
    profRenderGallery();
  } else {
    toast('',res.error?.message||'آپلود ناموفق بود');
    if(btn){btn.disabled=false;btn.textContent='آپلود عکس لوگو';}
  }
}
// ذخیره‌یِ نمایِ جایگزینِ ایموجی/گرادیان — محلی است (فقط برایِ زمانی که هنوز
// عکسِ واقعی تأیید نشده)؛ خودِ لوگو با handleLogoUpload به سرور می‌رود.
function saveLogoFallback(){
  RESTAURANT.logoEmoji=logoChoice.emoji||'🌿';
  RESTAURANT.logoGradient=logoChoice.gradient;
  refreshLogoDisplay();
  closeModal();profRenderGallery();
  toast('','ذخیره شد');
}

// ⚠️ رفعِ باگ: قبلاً این تابع فقط RESTAURANT.name (متغیرِ محلیِ جاوااسکریپت) را
// عوض می‌کرد — هیچ درخواستی به سرور نمی‌رفت. یعنی «ذخیره شد» به رستوران‌دار
// نشان داده می‌شد، ولی با اولین رفرش (یا از دستگاه/شعبه‌ی دیگر) نامِ قبلی
// برمی‌گشت، چون هیچ‌جا واقعاً ثبت نشده بود. حالا از GET/PUT /restaurant/profile
// واقعی استفاده می‌کند (مثلِ الگویِ hoursSave/pricing).
async function saveRestName(){
  const input=document.getElementById('restName');
  const n=input.value.trim();
  if(!n){toast('','نام رو وارد کن');return}
  if(n===RESTAURANT.name){closeModal();return}
  const btn=document.getElementById('saveRestNameBtn');
  if(btn){btn.disabled=true;btn.textContent='در حال ذخیره…';}
  const res=await API.profileSave({name:n});
  if(!res.ok){
    toast('',res.error?.message||'ذخیره نشد — دوباره امتحان کن');
    if(btn){btn.disabled=false;btn.textContent='ذخیره';}
    return;
  }
  RESTAURANT.name=res.data.name;
  const swName=document.getElementById('swName');
  if(swName)swName.textContent=res.data.name; // به‌روزرسانی زنده‌ی سایدبار
  closeModal();profRenderGallery();
  toast('','نام رستوران به‌روز شد');
}
// ─── آپلود مستقیم فایل ───
// محدودیت‌ها عیناً همان‌هایی‌اند که سرور اعمال می‌کند (src/lib/media.ts).
// چکِ سمتِ کلاینت فقط برای این است که کاربر ۸ مگابایت را بی‌خود آپلود نکند و
// بعد رد بشود؛ تصمیمِ واقعی همیشه سمتِ سرور گرفته می‌شود.
const PHOTO_MAX_BYTES = 8 * 1024 * 1024;
const PHOTO_TYPES = ['image/jpeg','image/png','image/webp'];
let pendingPhotoFiles = [];

function handleGalleryUpload(input){
  const files=Array.from(input.files||[]);
  input.value='';                       // تا انتخابِ دوباره‌ی همان فایل هم رویداد بدهد
  if(!files.length)return;
  if(!API.getToken()){toast('','برای افزودن عکس باید وارد شده باشی');return}

  const tooBig=files.filter(f=>f.size>PHOTO_MAX_BYTES);
  const wrongType=files.filter(f=>!PHOTO_TYPES.includes(f.type));
  pendingPhotoFiles=files.filter(f=>f.size<=PHOTO_MAX_BYTES && PHOTO_TYPES.includes(f.type));

  if(!pendingPhotoFiles.length){
    toast('', tooBig.length?'حجم عکس نباید از ۸ مگابایت بیشتر باشه':'فقط JPEG، PNG یا WebP');
    return;
  }
  openPhotoDetails(tooBig.length+wrongType.length);
}

function openPhotoDetails(skipped){
  const n=pendingPhotoFiles.length;
  openModal(`
    <div class="modal-title">${icon('upload',{size:18})} افزودن ${fa(n)} عکس</div>
    <div class="modal-sub">این عکس‌ها بعد از تأیید تیم رزرونو روی صفحه‌ی رستورانت منتشر می‌شن</div>
    ${skipped?`<div style="font-size:12px;color:var(--danger);margin-bottom:10px">${fa(skipped)} فایل نادیده گرفته شد (حجم بیش از ۸ مگابایت یا قالب غیرمجاز)</div>`:''}
    <div class="gallery-grid" style="margin-bottom:14px">
      ${pendingPhotoFiles.map((f,i)=>`<div class="gal-item"><img id="pvw${i}" alt="${esc(f.name)}"></div>`).join('')}
    </div>
    <div class="field-label">دسته</div>
    <select class="inp" id="photoCat"><option value="food">غذا</option><option value="interior">فضا</option><option value="drink">نوشیدنی</option><option value="event">رویداد</option><option value="other">سایر</option></select>
    <div class="field-label">توضیح (اختیاری)</div>
    <input class="inp" id="photoCap" placeholder="مثلاً پاستا کربونارا">
    <button class="btn btn-primary btn-block btn-lg" id="photoSubmit" style="margin-top:14px" onclick="submitPhotoUpload()">آپلود و ارسال برای تأیید</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeModal()">انصراف</button>`);

  // پیش‌نمایشِ محلی با blob URL — بدونِ رفت‌وبرگشت به سرور.
  pendingPhotoFiles.forEach((f,i)=>{
    const img=document.getElementById('pvw'+i);
    if(!img)return;
    const u=URL.createObjectURL(f);
    img.src=u;
    // آزادسازیِ حافظه پس از رندر؛ بدونِ این، انتخابِ چندباره نشت می‌کند.
    img.onload=()=>URL.revokeObjectURL(u);
  });
}

async function submitPhotoUpload(){
  const category=document.getElementById('photoCat')?.value||'food';
  const caption=(document.getElementById('photoCap')?.value||'').trim();
  const btn=document.getElementById('photoSubmit');
  if(btn){btn.disabled=true;btn.textContent='در حال آپلود…';}

  let ok=0; const errors=[];
  for(const [i,file] of pendingPhotoFiles.entries()){
    if(btn) btn.textContent=`در حال آپلود ${fa(i+1)} از ${fa(pendingPhotoFiles.length)}…`;
    const res=await API.uploadPhoto(file,{category,caption});
    if(res.ok) ok++; else errors.push(res.error?.message||'خطای نامشخص');
  }

  pendingPhotoFiles=[];
  await loadGallery();
  closeModal();
  profRenderGallery();

  if(ok && !errors.length) toast('',`${fa(ok)} عکس آپلود شد و برای تأیید فرستاده شد`);
  else if(ok) toast('',`${fa(ok)} عکس آپلود شد · ${fa(errors.length)} ناموفق: ${errors[0]}`);
  else toast('',errors[0]||'آپلود ناموفق بود');
}
function removeGalleryImg(i){
  const g=GALLERY[i];
  openModal(`
    <div style="text-align:center">
      <div style="width:52px;height:52px;border-radius:14px;background:var(--red-50);display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px;color:var(--danger)">${icon('trash',{size:24})}</div>
      <div class="modal-title" style="text-align:center">حذف این عکس؟</div>
      <div class="modal-sub" style="text-align:center">«${esc(g.label||'عکس')}» از گالری حذف می‌شه</div>
      <button class="btn btn-danger btn-block" onclick="doRemoveGallery(${i})">بله، حذف کن</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeModal()">انصراف</button>
    </div>`);
}
async function doRemoveGallery(i){
  const g=GALLERY[i];
  if(g.id && API.getToken()){
    const res=await API.deletePhoto(g.id);
    if(!res.ok){closeModal();toast('',res.error?.message||'حذف ناموفق بود');return;}
    await loadGallery();
  }else{
    GALLERY.splice(i,1);
  }
  closeModal();profRenderGallery();
  toast('','عکس حذف شد');
}

// ─── تب نظرات ───
function profRenderReviews(){
  let list=REVIEWS;
  if(revFilter==='positive')list=REVIEWS.filter(r=>r.rating>=4);
  else if(revFilter==='negative')list=REVIEWS.filter(r=>r.rating<=3);
  else if(revFilter==='unreplied')list=REVIEWS.filter(r=>!r.replied);
  // اگر آمار واقعی از سرور داریم استفاده کن، وگرنه از همین لیست محاسبه کن
  const useReal=REVIEW_STATS.total>0;
  const avg=(useReal?REVIEW_STATS.avg:(REVIEWS.length?REVIEWS.reduce((s,r)=>s+r.rating,0)/REVIEWS.length:0)).toFixed(1);
  const totalCount=useReal?REVIEW_STATS.total:REVIEWS.length;
  const dist=[5,4,3,2,1].map(star=>({star,count:useReal?(REVIEW_STATS.distribution[star]||0):REVIEWS.filter(r=>r.rating===star).length}));
  const unreplied=useReal?REVIEW_STATS.unreplied:REVIEWS.filter(r=>!r.replied).length;
  const stars=n=>Array.from({length:5},(_,si)=>icon('star',{size:13,fill:si<Math.round(n)})).join('');
  document.getElementById('pt-reviews').innerHTML=`
    <div class="rev-summary">
      <div class="rev-big">
        <div class="rev-big-num">${fa(avg)}</div>
        <div class="rev-big-stars">${stars(+avg)}</div>
        <div class="rev-big-count">${fa(totalCount)} نظر</div>
      </div>
      <div class="rev-bars">
        ${dist.map(d=>`<div class="rev-bar-row"><span class="rl">${fa(d.star)} ستاره</span><div class="rev-bar-track"><div class="rev-bar-fill" style="width:${totalCount?d.count/totalCount*100:0}%"></div></div><span class="rv">${fa(d.count)}</span></div>`).join('')}
      </div>
    </div>
    ${unreplied>0?`<div class="ai-box" style="margin-bottom:16px"><div class="ai-insight"><span class="ic warn">${icon('message',{size:15})}</span><div><b>${fa(unreplied)} نظر بی‌پاسخ</b> — پاسخ دادن به نظرات (مخصوصاً منفی‌ها) اعتماد مشتری‌ها رو زیاد می‌کنه و نشون می‌ده بهشون اهمیت می‌دی.</div></div></div>`:''}
    <div class="rev-filters">
      <button class="rev-filter ${revFilter==='all'?'active':''}" onclick="setRevFilter('all')">همه (${fa(totalCount)})</button>
      <button class="rev-filter ${revFilter==='positive'?'active':''}" onclick="setRevFilter('positive')">${icon('thumbsUp',{size:14})} مثبت (${fa(dist[0].count+dist[1].count)})</button>
      <button class="rev-filter ${revFilter==='negative'?'active':''}" onclick="setRevFilter('negative')">${icon('thumbsDown',{size:14})} منفی (${fa(dist[2].count+dist[3].count+dist[4].count)})</button>
      <button class="rev-filter ${revFilter==='unreplied'?'active':''}" onclick="setRevFilter('unreplied')">${icon('message',{size:14})} بی‌پاسخ (${fa(unreplied)})</button>
    </div>
    <div id="revList">
      ${REVIEWS.length?(list.length?list.map((r)=>{
        const origIdx=REVIEWS.indexOf(r);
        return `<div class="rev-card">
        <div class="rev-card-top">
          <div class="rev-ava">${r.ava}</div>
          <div><div class="rev-name">${esc(r.name)} ${r.seg==='vip'?icon('crown',{size:14,fill:true}):''}</div><div class="rev-stars-sm">${Array.from({length:5},(_,si)=>icon('star',{size:12,fill:si<r.rating})).join('')}</div></div>
          <div class="rev-date">${r.date}</div>
        </div>
        <div class="rev-text">${esc(r.text)}</div>

/**
 * آیا برایِ این مشتری اصلاً دادهٔ مبلغی وجود دارد؟
 *
 * ⚠️ افزوده در ممیزیِ ۲۰۲۶-۰۸-۱۹. رزرونو عمداً POS-agnostic است و هرگز مبلغِ
 * فاکتور را نمی‌بیند؛ تنها منبعِ مبلغ، `reservation_items` (پیش‌سفارش از منو)
 * است — دقیقاً همان چیزی که کامنتِ خودِ schema رویِ `total_spend_toman`
 * می‌گوید: «جمعِ پیش‌سفارش‌ها». چون این ستون‌ها در دیتابیس `Int @default(0)`
 * (غیرِ nullable) هستند، «دادهٔ نداریم» و «خرجش صفر بود» هردو صفر ذخیره
 * می‌شوند و از هم قابلِ تفکیک نیستند. نمایشِ خامِ آن صفر به رستوران‌دار یعنی
 * ادعایِ اندازه‌گیری‌شده‌ای که هرگز اندازه‌گیری نشده. اینجا صفر را «بدونِ داده»
 * می‌خوانیم و خانه را خالی نشان می‌دهیم، نه «۰ تومان».
 */
function clvHasSpend(clv){
  // دقیقاً null/undefined را چک می‌کنیم، نه falsy: بعد از migration ۰۴۶ عددِ ۰
  // یک واقعیتِ تأییدشده است («منو داشت، پیش‌سفارش نداد») و باید «۰» نشان داده
  // شود؛ فقط null یعنی «نمی‌دانیم» و باید «—» شود. اگر اینجا `!value` بنویسیم،
  // همان دو حالتی که در دیتابیس تفکیک کردیم دوباره در UI یکی می‌شوند.
  return !!clv && clv.total_spend_toman != null;
}
