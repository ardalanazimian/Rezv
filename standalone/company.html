}
function faD(s){ return String(s).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d]); }
function showAdminLoginPhone(){
  setAdminGateLocked(true);
  document.getElementById('loginCard').innerHTML = `
    <div class="login-logo">R</div>
    <div class="login-title">پنل شرکت رزرونو</div>
    <div class="login-sub">ورود مدیر پلتفرم — شماره موبایل خود را وارد کنید</div>
    <label class="login-field-label">شماره موبایل</label>
    <input class="login-inp" id="adminPhone" inputmode="tel" placeholder="۰۹۱۲۳۴۵۶۷۸۹" onkeydown="if(event.key==='Enter')adminSendOtp()">
    <button class="login-btn" id="adminSendBtn" onclick="adminSendOtp()">ارسال کد ورود</button>
    <div class="login-foot">فقط مدیران پلتفرم به این پنل دسترسی دارند</div>`;
  setTimeout(()=>document.getElementById('adminPhone')?.focus(),200);
}
async function adminSendOtp(){
  const el = document.getElementById('adminPhone');
  const phone = (el?.value||'').trim();
  const normalized = phone.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g,'');
  if (!/^09\d{9}$/.test(normalized)) { toast('','شماره موبایل معتبر وارد کن'); return; }
  _adminPhone = normalized;
  const btn = document.getElementById('adminSendBtn');
  if (btn){ btn.disabled = true; btn.textContent = 'در حال ارسال...'; }
  if (location.protocol === 'file:') {
    showAdminLoginCode('۱۲۳۴', true);
    return;
  }
  const res = await API.requestAdminOtp(normalized);
  if (!res.ok && !res.offline){
    toast('', res.error?.message || 'این شماره دسترسی ندارد');
    if (btn){ btn.disabled = false; btn.textContent = 'ارسال کد ورود'; }
    return;
  }
  const devCode = res.data?.devCode || (res.offline ? '۱۲۳۴' : null);
  showAdminLoginCode(devCode, res.offline);
}
function showAdminLoginCode(devCode, offline){
  setAdminGateLocked(true);
  document.getElementById('loginCard').innerHTML = `
    <div class="login-logo">${icon('mail',{size:34})}</div>
    <div class="login-title">کد ورود را وارد کنید</div>
    <div class="login-sub">کد ورود به شماره‌ی ${faD(_adminPhone)} ارسال شد</div>
    <label class="login-field-label">کد ورود</label>
    <input class="login-inp code" id="adminCode" inputmode="numeric" maxlength="6" placeholder="······" onkeydown="if(event.key==='Enter')adminConfirmOtp()">
    <button class="login-btn" id="adminVerifyBtn" onclick="adminConfirmOtp()">ورود به پنل</button>
    <button class="login-back" onclick="showAdminLoginPhone()">تغییر شماره</button>
    ${devCode ? `<div class="login-hint">${offline?'حالت دمو (بک‌اند متصل نیست):':'حالت توسعه:'} کد ورود <b>${faD(devCode)}</b> است</div>` : ''}`;
  setTimeout(()=>document.getElementById('adminCode')?.focus(),200);
}
async function adminConfirmOtp(){
  const el = document.getElementById('adminCode');
  const code = (el?.value||'').trim().replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  if (!/^\d{4,6}$/.test(code)) { toast('','کد ورود را کامل وارد کن'); return; }
  const btn = document.getElementById('adminVerifyBtn');
  if (btn){ btn.disabled = true; btn.textContent = 'در حال بررسی...'; }
  if (location.protocol === 'file:') {
    if (code === '1234'){ await enterAdminPanel(true); }
    else { toast('','در حالت دمو، کد ۱۲۳۴ است'); if (btn){ btn.disabled=false; btn.textContent='ورود به پنل'; } }
    return;
  }
  const res = await API.verifyAdminOtp(_adminPhone, code);
  if (res.ok && res.data?.access){
    await enterAdminPanel();
  } else if (res.offline){
    if (code === '1234'){ await enterAdminPanel(true); }
    else { toast('','در حالت دمو، کد ۱۲۳۴ است'); if (btn){ btn.disabled=false; btn.textContent='ورود به پنل'; } }
  } else {
    toast('', res.error?.message || 'کد اشتباه است');
    if (btn){ btn.disabled=false; btn.textContent='ورود به پنل'; }
  }
}
async function enterAdminPanel(demo){
  document.getElementById('loginOverlay').classList.add('hidden');
  setAdminGateLocked(false);
  // اگر توکن واقعی داریم، داده‌ی واقعی بارگذاری کن
  if (API.getToken() && !demo){
    const [fresh] = await Promise.all([loadAdminRestaurants(), loadPlatformStats()]);
    RESTAURANTS = fresh;
    // نشان‌ها باید از همان ابتدا عددِ واقعی را نشان دهند، وگرنه کارِ منتظر
    // فقط وقتی دیده می‌شود که کاربر اتفاقی وارد آن صفحه شود.
    refreshSalesBadge();
    refreshPhotoBadge();
  }
  rOverview();
  toast('','خوش آمدید · پنل شرکت');
}
async function adminLogout(){
  await API.doLogout();
  document.getElementById('loginOverlay').classList.remove('hidden');
  setAdminGateLocked(true);
  showAdminLoginPhone();
  toast('','از پنل خارج شدید');
}
function onAdminSessionExpired(){
  document.getElementById('loginOverlay').classList.remove('hidden');
  setAdminGateLocked(true);
  showAdminLoginPhone();
  toast('','نشست منقضی شد، دوباره وارد شوید');
}

// شروع — نشست را بازیابی و ورود را چک کن
API.restoreSession();
if (API.getToken()) {
  document.getElementById('loginOverlay').classList.add('hidden');
  setAdminGateLocked(false);
  rOverview();
  (async () => {
    const [fresh] = await Promise.all([loadAdminRestaurants(), loadPlatformStats()]);
    RESTAURANTS = fresh;
    const active = document.querySelector('.view.active');
    if (active) {
      const id = active.id.replace('v-', '');
      ({overview:rOverview, restaurants:rRestaurants, detail:rDetail, analytics:rAnalytics, customers:rCustomers, billing:rBilling, sales:loadSales, photos:loadPhotos, systemhealth:rSystemHealth, security:rSecurity, support:rSupport, badges:rBadges, missions:rMissions})[id]?.();
    }
    refreshSalesBadge();
    refreshPhotoBadge();
  })();
} else {
  setAdminGateLocked(true);
  showAdminLoginPhone();
}

</script>
<script data-src="js/badges.js">
// ═══ رزرونو — پنل company: نشان‌هایِ کنترل‌شده‌یِ پلتفرم (Company Control Plane، فازِ ۳) ═══
// کاملاً جدا از BADGES قدیمیِ اپِ کاستومر (emojiِ نمایشی، بدونِ رکوردِ سرور)؛
// این‌ها را فقط ادمینِ پلتفرم تعریف/اعطا/لغو می‌کند (رجوع کن به schema.prisma
// برایِ توضیحِ کامل + یادداشتِ «آماده‌یِ بلاکچین»).
let BADGES_LIST = [];

function rBadges(){
  document.getElementById('v-badges').innerHTML=`<div style="text-align:center;padding:60px;color:var(--t2)">در حال بارگذاری...</div>`;
  loadBadges();
}
async function loadBadges(){
  const res = await API.listBadges();
  if(!res.ok){
    document.getElementById('v-badges').innerHTML=`<div class="panel" style="text-align:center;padding:40px;color:var(--t2)">${icon('alert',{size:16})} اتصال به سرور برقرار نشد — این صفحه بدون بک‌اند کار نمی‌کنه.</div>`;
    return;
  }
  BADGES_LIST = res.data.items || [];
  renderBadges();
}
function renderBadges(){
  document.getElementById('v-badges').innerHTML=`
    <div class="panel" style="margin-bottom:20px">
      <div class="panel-head"><div><div class="panel-title">${icon('sparkle',{size:16,fill:true})} نشان‌هایِ کنترل‌شده‌یِ پلتفرم</div><div class="panel-sub">این‌ها فقط با تصمیمِ دستیِ ادمین اعطا می‌شن — جدا از نشان‌هایِ خودکارِ اپ</div></div>
        <button class="btn btn-primary btn-sm" onclick="openCreateBadgeModal()">${icon('plus',{size:14})} نشانِ جدید</button>
      </div>
      ${BADGES_LIST.length?`<div class="tier-grid">${BADGES_LIST.map(b=>`
        <div class="tier-card" style="--tier-fg:${esc(b.color||'#7C3AED')}${b.isActive?'':';opacity:.55'}">
          <div class="tier-ic">${icon(b.icon||'star',{size:18})}</div>
          <div class="tier-name">${esc(b.name)}${b.isActive?'':' <span class="badge">غیرفعال</span>'}</div>
          <div class="tier-meta mono-ip">${esc(b.key)}</div>
          ${b.description?`<div class="tier-meta">${esc(b.description)}</div>`:''}
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px;justify-content:center">
            <button class="btn btn-sm" data-bid="${esc(b.id)}" data-bname="${esc(b.name)}" onclick="openGrantBadgeModal(this.dataset.bid,this.dataset.bname)">اعطا</button>
            <button class="btn btn-sm" data-bid="${esc(b.id)}" data-bname="${esc(b.name)}" onclick="openRevokeBadgeModal(this.dataset.bid,this.dataset.bname)">لغو</button>
            <button class="btn btn-ghost btn-sm" data-bid="${esc(b.id)}" onclick="toggleBadgeActive(this.dataset.bid)">${b.isActive?'غیرفعال‌کردن':'فعال‌کردن'}</button>
          </div>
        </div>`).join('')}</div>`:`<div class="empty-state"><div class="empty-state-icon">${icon('sparkle',{size:32,fill:true})}</div><div class="empty-state-desc">هنوز نشانی تعریف نشده</div></div>`}
    </div>`;
}

function openCreateBadgeModal(){
  openModal(`
    <div class="modal-title">${icon('sparkle',{size:18,fill:true})} نشانِ جدید</div>
    <div class="field-label">کلید (فقط لاتین، مثلاً founding_member)</div>
    <input class="inp" id="bgKey" placeholder="founding_member">
    <div class="field-label">نام نمایشی</div>
    <input class="inp" id="bgName" placeholder="مثلاً عضوِ بنیان‌گذار">
    <div class="field-label">توضیح (اختیاری)</div>
    <textarea class="inp" id="bgDesc" rows="2" placeholder="این نشان یعنی چی"></textarea>
    <div class="field-label">آیکون (اختیاری — نامِ آیکون از مجموعه‌ی رزرونو)</div>
    <input class="inp" id="bgIcon" placeholder="star" value="star">
    <div class="field-label">رنگ (اختیاری — hex)</div>
    <input class="inp" id="bgColor" placeholder="#7C3AED">
    <button class="btn btn-primary btn-block btn-lg" style="margin-top:14px" onclick="submitCreateBadge()">ساختِ نشان</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeModal()">انصراف</button>
  `);
}
async function submitCreateBadge(){
  const key=(document.getElementById('bgKey')?.value||'').trim();
  const name=(document.getElementById('bgName')?.value||'').trim();
  const description=(document.getElementById('bgDesc')?.value||'').trim()||undefined;
  const iconName=(document.getElementById('bgIcon')?.value||'').trim()||undefined;
  const color=(document.getElementById('bgColor')?.value||'').trim()||undefined;
  if(!key||!name){toast('','کلید و نام رو وارد کن');return;}
  const res=await API.createBadge({key,name,description,icon:iconName,color});
  if(!res.ok){toast('',res.error?.message||'ساختِ نشان ناموفق بود');return;}
  closeModal();
  toast('','نشان ساخته شد');
  loadBadges();
}
async function toggleBadgeActive(id){
  const b=BADGES_LIST.find(x=>x.id===id);if(!b)return;
  if(!confirm(`${b.isActive?'غیرفعال':'فعال'}‌کردنِ نشانِ «${b.name}»؟`))return;
  const res=await API.updateBadge(id,{is_active:!b.isActive});
  if(!res.ok){toast('',res.error?.message||'انجام نشد');return;}
  toast('','به‌روزرسانی شد');
  loadBadges();
}

// ── اعطا/لغو: جست‌وجویِ کاربر با شماره/شناسه (بازاستفاده از همون customer360) قبل از اقدام ──
async function resolveUserForBadge(query){
  const q=(query||'').trim();
  if(!q){toast('','شماره‌موبایل یا شناسه‌ی کاربر رو وارد کن');return null;}
  const res=await API.customer360(q);
  if(!res.ok){toast('',res.error?.message||'کاربر پیدا نشد');return null;}
  return res.data.user;
}
function openGrantBadgeModal(badgeId,badgeName){
  openModal(`
    <div class="modal-title">اعطایِ «${esc(badgeName)}»</div>
    <div class="field-label">شماره‌موبایل یا شناسه‌ی کاربر</div>
    <input class="inp" id="bgGrantQuery" placeholder="۰۹۱۲۳۴۵۶۷۸۹">
    <div class="field-label">یادداشت (اختیاری)</div>
    <input class="inp" id="bgGrantNote" placeholder="مثلاً دلیلِ اعطا">
    <button class="btn btn-primary btn-block btn-lg" style="margin-top:14px" data-bid="${esc(badgeId)}" onclick="submitGrantBadge(this.dataset.bid)">اعطا</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeModal()">انصراف</button>
  `);
}
async function submitGrantBadge(badgeId){
  const user=await resolveUserForBadge(document.getElementById('bgGrantQuery')?.value);
  if(!user)return;
  const note=(document.getElementById('bgGrantNote')?.value||'').trim()||undefined;
  const name=[user.first_name,user.last_name].filter(Boolean).join(' ')||user.phone;
  if(!confirm(`این نشان به «${name}» اعطا بشه؟`))return;
  const res=await API.grantBadge(badgeId,user.id,note);
  if(!res.ok){toast('',res.error?.message||'اعطا ناموفق بود');return;}
  closeModal();
  toast('',res.data?.already_granted?'این کاربر از قبل این نشان رو داشت':'نشان اعطا شد');
}
function openRevokeBadgeModal(badgeId,badgeName){
  openModal(`
    <div class="modal-title">لغوِ «${esc(badgeName)}»</div>
    <div class="field-label">شماره‌موبایل یا شناسه‌ی کاربر</div>
    <input class="inp" id="bgRevokeQuery" placeholder="۰۹۱۲۳۴۵۶۷۸۹">
    <div class="field-label">دلیل (اختیاری)</div>
    <input class="inp" id="bgRevokeReason" placeholder="مثلاً اشتباه بود">
    <button class="btn btn-danger btn-block btn-lg" style="margin-top:14px" data-bid="${esc(badgeId)}" onclick="submitRevokeBadge(this.dataset.bid)">لغوِ نشان</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeModal()">انصراف</button>
  `);
}
async function submitRevokeBadge(badgeId){
  const user=await resolveUserForBadge(document.getElementById('bgRevokeQuery')?.value);
  if(!user)return;
  const reason=(document.getElementById('bgRevokeReason')?.value||'').trim()||undefined;
  const name=[user.first_name,user.last_name].filter(Boolean).join(' ')||user.phone;
  if(!confirm(`این نشان از «${name}» لغو بشه؟`))return;
  const res=await API.revokeBadge(badgeId,user.id,reason);
  if(!res.ok){toast('',res.error?.message||'لغو ناموفق بود');return;}
  closeModal();
  toast('',res.data?.already_revoked?'این کاربر این نشان رو نداشت':'نشان لغو شد');
}

</script>
<script data-src="js/missions.js">
// ═══ رزرونو — پنل company: ماموریت‌هایِ پلتفرم (Company Control Plane، فازِ ۳) ═══
// CRUDِ خودِ رکوردِ Mission — بدونِ تغییر در updateMissionProgressTx/claimMission
// (منطقِ پیشرفتِ کاربر در lib/missions.ts دست‌نخورده می‌ماند).
let MISSIONS_LIST = [];
const MISSION_KIND_FA = { weekly:'هفتگی', seasonal:'فصلی', onboarding:'خوش‌آمدگویی', recovery:'بازگشت', general:'عمومی' };

function rMissions(){
  document.getElementById('v-missions').innerHTML=`<div style="text-align:center;padding:60px;color:var(--t2)">در حال بارگذاری...</div>`;
  loadMissions();
}
async function loadMissions(){
  const res = await API.listMissions();
  if(!res.ok){
    document.getElementById('v-missions').innerHTML=`<div class="panel" style="text-align:center;padding:40px;color:var(--t2)">${icon('alert',{size:16})} اتصال به سرور برقرار نشد — این صفحه بدون بک‌اند کار نمی‌کنه.</div>`;
    return;
  }
  MISSIONS_LIST = res.data.items || [];
  renderMissions();
}
function renderMissions(){
  document.getElementById('v-missions').innerHTML=`
    <div class="panel">
      <div class="panel-head"><div><div class="panel-title">${icon('check',{size:16})} ماموریت‌هایِ پلتفرم</div><div class="panel-sub">ماموریت‌هایِ سراسری (بدونِ رستورانِ خاص) و مختصِ یک رستوران</div></div>
        <button class="btn btn-primary btn-sm" onclick="openMissionModal()">${icon('plus',{size:14})} ماموریتِ جدید</button>
      </div>
      ${MISSIONS_LIST.length?`<div class="mini-list">${MISSIONS_LIST.map(m=>`
        <div class="mini-row">
          <div class="mini-ava">${icon('check',{size:16})}</div>
          <div class="mini-info">
            <div class="mini-name">${esc(m.title)} <span class="badge ${m.status==='active'?'active':'expired'}">${m.status==='active'?'فعال':'آرشیوشده'}</span></div>
            <div class="mini-sub">${esc(MISSION_KIND_FA[m.kind]||m.kind)} · هدف: ${fa(m.targetCount)} · XP: ${fa(m.xpReward)} · سکه: ${fa(m.walletReward)}${m.restaurantId?'':' · سراسری'}</div>
          </div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-ghost btn-sm" data-mid="${esc(m.id)}" onclick="openMissionModal(this.dataset.mid)">ویرایش</button>
            <button class="btn btn-sm" data-mid="${esc(m.id)}" data-status="${m.status}" onclick="toggleMissionStatus(this.dataset.mid,this.dataset.status)">${m.status==='active'?'آرشیو':'فعال‌سازی'}</button>
          </div>
        </div>`).join('')}</div>`:`<div class="empty-state"><div class="empty-state-icon">${icon('check',{size:32})}</div><div class="empty-state-desc">هنوز ماموریتی تعریف نشده</div></div>`}
    </div>`;
}

function openMissionModal(id){
  const m = id ? MISSIONS_LIST.find(x=>x.id===id) : null;
  openModal(`
    <div class="modal-title">${m?'ویرایشِ ماموریت':'ماموریتِ جدید'}</div>
    <div class="field-label">عنوان</div>
    <input class="inp" id="msTitle" placeholder="مثلاً «۳ رزرو این هفته»" value="${m?esc(m.title):''}">
    <div class="field-label">توضیح (اختیاری)</div>
    <textarea class="inp" id="msDesc" rows="2">${m?esc(m.description||''):''}</textarea>
    ${m?'':`<div class="field-label">نوع</div>
    <select class="inp" id="msKind">
      ${Object.entries(MISSION_KIND_FA).map(([v,l])=>`<option value="${v}">${l}</option>`).join('')}
    </select>`}
    <div class="field-label">هدف (تعداد)</div>
    <input class="inp" id="msTarget" type="number" min="1" value="${m?m.targetCount:1}">
    <div class="field-label">پاداشِ XP</div>
    <input class="inp" id="msXp" type="number" min="0" value="${m?m.xpReward:0}">
    <div class="field-label">پاداشِ سکه</div>
    <input class="inp" id="msWallet" type="number" min="0" value="${m?m.walletReward:0}">
    <button class="btn btn-primary btn-block btn-lg" style="margin-top:14px" data-mid="${m?esc(m.id):''}" onclick="submitMission(this.dataset.mid||null)">${m?'ذخیره':'ساختِ ماموریت'}</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeModal()">انصراف</button>
  `);
}
async function submitMission(id){
  const title=(document.getElementById('msTitle')?.value||'').trim();
  const description=(document.getElementById('msDesc')?.value||'').trim()||undefined;
  const target_count=+((document.getElementById('msTarget')?.value)||1);
  const xp_reward=+((document.getElementById('msXp')?.value)||0);
  const wallet_reward=+((document.getElementById('msWallet')?.value)||0);
  if(!title){toast('','عنوانِ ماموریت رو بنویس');return;}

  const res = id
    ? await API.updateMission(id,{title,description,target_count,xp_reward,wallet_reward})
    : await API.createMission({title,description,kind:document.getElementById('msKind')?.value||'general',target_count,xp_reward,wallet_reward});
  if(!res.ok){toast('',res.error?.message||'ذخیره ناموفق بود');return;}
  closeModal();
  toast('',id?'ماموریت به‌روزرسانی شد':'ماموریت ساخته شد');
  loadMissions();
}
async function toggleMissionStatus(id,current){
  const next = current==='active' ? 'archived' : 'active';
  if(!confirm(next==='archived'?'این ماموریت آرشیو بشه؟ دیگه به کاربرها نشون داده نمی‌شه.':'این ماموریت دوباره فعال بشه؟'))return;
  const res=await API.updateMission(id,{status:next});
  if(!res.ok){toast('',res.error?.message||'انجام نشد');return;}
  toast('','به‌روزرسانی شد');
  loadMissions();
}

</script>
<script data-src="js/sales.js">
// ═══════════════════════════════════════════════════════════════════════
//  رزرونو — پنل company: صفِ درخواست‌های وب‌سایت (فروش و فعال‌سازی)
//
//  اینجا همان صفی است که «اپِ شرکت» برای فعال‌سازیِ اشتراک مسئولش است:
//  درخواستِ خریدی که از وب‌سایتِ عمومی ثبت شده، با یک کلیک به اشتراکِ واقعیِ
//  کسب‌وکار تبدیل می‌شود (tenant.plan + planExpiresAt) و روی همان ردیف ثبت
//  می‌شود چه‌کسی و چه‌زمانی فعالش کرده.
//
//  منبعِ داده: GET /api/v1/admin/site/orders و /admin/site/overview
//  عملیات:    PATCH /api/v1/admin/site/orders/{id}  { action: ... }
//
//  بدونِ بک‌اند حالتِ خالیِ صادقانه نشان داده می‌شود (نه دادهٔ نمونه) — چون
//  اینجا تصمیمِ مالی گرفته می‌شود و دادهٔ ساختگی می‌تواند گمراه‌کننده باشد.
// ═══════════════════════════════════════════════════════════════════════

let SALES_ORDERS = [];
let SALES_INQUIRIES = [];
let SALES_TAB = 'orders';       // orders | inquiries
let SALES_FILTER = 'pending';   // pending | all
let SALES_LOADING = false;
let SALES_ERROR = null;
let SALES_BADGE = 0;            // شمارشِ کارِ باقی‌مانده برای نشانِ کنارِ منو

const SALES_STATUS = {
  pending: { label: 'در انتظار', cls: 'expiring' },
  contacted: { label: 'تماس گرفته شد', cls: 'trial' },
  activated: { label: 'فعال شد', cls: 'active' },
  rejected: { label: 'رد شد', cls: 'expired' },
  cancelled: { label: 'لغو شد', cls: 'expired' },
};
const INQUIRY_STATUS = {
  open: { label: 'باز', cls: 'expiring' },
  in_progress: { label: 'در حالِ پیگیری', cls: 'trial' },
  closed: { label: 'بسته', cls: 'active' },
};
const TOPIC_LABEL = {
  sales: 'خرید و قیمت', support: 'پشتیبانی', partnership: 'همکاری', press: 'رسانه', other: 'سایر',
};

/** تومان با ارقامِ فارسی و جداکننده‌ی هزارگان. */
function salesToman(n) {
  if (n === null || n === undefined) return '—';
  return fa(Number(n).toLocaleString('en-US')) + ' تومان';
}

/** تاریخِ کوتاهِ خوانا از ISO. */
function salesDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  try {
    return new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
      year: 'numeric', month: 'short', day: 'numeric', timeZone: 'Asia/Tehran',
    }).format(d);
  } catch { return fa(d.toISOString().slice(0, 10)); }
}

// ════════ بارگذاری ════════

async function loadSales() {
  SALES_LOADING = true;
  SALES_ERROR = null;
  rSales();

  const qs = SALES_FILTER === 'pending' ? '?status=pending' : '';
  const [orders, inquiries] = await Promise.all([
    API.get('/admin/site/orders' + qs),
    API.get('/admin/site/inquiries'),
  ]);

  SALES_LOADING = false;
  if (!orders.ok) {
    SALES_ERROR = orders.offline
      ? 'اتصال به سرور برقرار نیست — این بخش دادهٔ نمونه ندارد چون تصمیمِ مالی روی آن گرفته می‌شود.'
      : (orders.error && orders.error.message) || 'دریافتِ درخواست‌ها ناموفق بود.';
    SALES_ORDERS = [];
  } else {
    SALES_ORDERS = orders.data.items || [];
  }
  SALES_INQUIRIES = inquiries.ok ? (inquiries.data.items || []) : [];
  rSales();
  refreshSalesBadge();
}

/** شمارشِ کارِ باقی‌مانده روی نشانِ منو (بدونِ رندرِ کلِ صفحه). */
async function refreshSalesBadge() {
  const res = await API.get('/admin/site/overview');
  if (!res.ok) return;
  SALES_BADGE = (res.data.funnel && res.data.funnel.action_required) || 0;
  const el = document.getElementById('salesBadge');
  if (!el) return;
  el.textContent = SALES_BADGE ? fa(SALES_BADGE) : '';
  el.style.display = SALES_BADGE ? 'inline-flex' : 'none';
}

// ════════ رندر ════════

function rSales() {
  const el = document.getElementById('v-sales');
  if (!el) return;

  const pendingCount = SALES_ORDERS.filter((o) => o.status === 'pending' && o.kind === 'purchase').length;
  const openInquiries = SALES_INQUIRIES.filter((q) => q.status === 'open').length;

  el.innerHTML = `
    <div class="bill-summary">
      <div class="bill-stat"><div class="bs-val" style="color:var(--amber-600)">${fa(pendingCount)}</div><div class="bs-label">درخواستِ خریدِ در انتظارِ فعال‌سازی</div></div>
      <div class="bill-stat"><div class="bs-val" style="color:var(--ink)">${fa(SALES_ORDERS.filter(o=>o.kind==='trial').length)}</div><div class="bs-label">حسابِ دمو در این فهرست</div></div>
      <div class="bill-stat"><div class="bs-val" style="color:var(--green-600)">${fa(openInquiries)}</div><div class="bs-label">پیامِ بازنشده‌ی سایت</div></div>
    </div>

    <div class="panel">
      <div class="panel-head" style="flex-wrap:wrap;gap:10px">
        <div>
          <div class="panel-title">درخواست‌های وب‌سایت</div>
          <div class="panel-sub">فعال‌سازیِ اشتراک از همین‌جا انجام می‌شود و در گزارشِ حسابرسی ثبت می‌گردد</div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          <button class="btn btn-sm ${SALES_TAB==='orders'?'btn-primary':'btn-ghost'}" onclick="salesTab('orders')">سفارش‌ها</button>
          <button class="btn btn-sm ${SALES_TAB==='inquiries'?'btn-primary':'btn-ghost'}" onclick="salesTab('inquiries')">پیام‌ها${openInquiries?` (${fa(openInquiries)})`:''}</button>
          ${SALES_TAB==='orders' ? `
            <button class="btn btn-sm ${SALES_FILTER==='pending'?'btn-primary':'btn-ghost'}" onclick="salesFilter('pending')">در انتظار</button>
            <button class="btn btn-sm ${SALES_FILTER==='all'?'btn-primary':'btn-ghost'}" onclick="salesFilter('all')">همه</button>` : ''}
          <button class="btn btn-ghost btn-sm" onclick="loadSales()">${SALES_LOADING?'در حال بارگذاری…':'تازه‌سازی'}</button>
        </div>
      </div>

      ${SALES_ERROR ? `<div style="padding:22px;text-align:center;color:var(--red-600);font-size:13px">${esc(SALES_ERROR)}</div>` : ''}
      ${SALES_LOADING ? `<div style="padding:22px;text-align:center;color:var(--muted);font-size:13px">در حال دریافت…</div>` : ''}
      ${!SALES_LOADING && !SALES_ERROR ? (SALES_TAB === 'orders' ? renderSalesOrders() : renderSalesInquiries()) : ''}
    </div>`;
}

function renderSalesOrders() {
  if (!SALES_ORDERS.length) {
    return `<div style="padding:28px;text-align:center;color:var(--muted);font-size:13px">
      ${SALES_FILTER === 'pending' ? 'هیچ درخواستی در انتظارِ اقدام نیست. ✓' : 'هنوز درخواستی از وب‌سایت ثبت نشده است.'}
    </div>`;
  }

  return `<div class="mini-list">${SALES_ORDERS.map((o) => {
    const st = SALES_STATUS[o.status] || { label: o.status, cls: 'trial' };
    const isPurchase = o.kind === 'purchase';
    const canAct = isPurchase && o.status !== 'activated' && o.status !== 'rejected';
    const tenantHint = o.tenant_id
      ? 'کسب‌وکار متصل است'
      : (o.suggested_tenant ? `پیشنهاد: ${esc(o.suggested_tenant.tenantName)}` : 'بدونِ کسب‌وکارِ متصل');

    return `<div class="mini-row" style="flex-wrap:wrap;gap:10px">
      <div class="mini-info" style="min-width:200px;flex:1">
        <div class="mini-name">${esc(o.business_name)} <span class="plan-badge ${isPurchase?'pro':'trial'}">${isPurchase?'خرید':'دمو'}</span></div>
        <div class="mini-sub" style="direction:ltr;text-align:right">${esc(o.code)} · ${esc(o.contact_name)} · ${esc(o.phone)}</div>
        <div class="mini-sub">${o.plan_name?esc(o.plan_name)+' · ':''}${salesDate(o.created_at)} · ${esc(tenantHint)}</div>
      </div>
      <div style="min-width:120px;font-size:13px;font-weight:700">${salesToman(o.amount_toman)}</div>
      <span class="badge ${st.cls}" style="align-self:flex-start"><span class="bdot"></span>${st.label}</span>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <button class="btn btn-ghost btn-sm" onclick="openSalesOrder('${esc(o.id)}')">جزئیات</button>
        ${canAct ? `<button class="btn btn-primary btn-sm" onclick="activateSalesOrder('${esc(o.id)}')">فعال‌سازی</button>` : ''}
      </div>
    </div>`;
  }).join('')}</div>`;
}

function renderSalesInquiries() {
  if (!SALES_INQUIRIES.length) {
    return `<div style="padding:28px;text-align:center;color:var(--muted);font-size:13px">صندوقِ ورودی خالی است.</div>`;
  }
  return `<div class="mini-list">${SALES_INQUIRIES.map((q) => {
    const st = INQUIRY_STATUS[q.status] || { label: q.status, cls: 'trial' };
    return `<div class="mini-row" style="flex-wrap:wrap;gap:10px;align-items:flex-start">
      <div class="mini-info" style="min-width:220px;flex:1">
        <div class="mini-name">${esc(q.name)}${q.company?' — '+esc(q.company):''}</div>
        <div class="mini-sub" style="direction:ltr;text-align:right">${esc(q.code)} · ${esc(q.phone)}${q.email?' · '+esc(q.email):''}</div>
        <div class="mini-sub">${esc(TOPIC_LABEL[q.topic]||q.topic)} · ${salesDate(q.created_at)}</div>
        <div style="margin-top:6px;font-size:12.5px;line-height:1.8;white-space:pre-wrap">${esc(q.message)}</div>
      </div>
      <span class="badge ${st.cls}" style="align-self:flex-start"><span class="bdot"></span>${st.label}</span>
      <div style="display:flex;gap:6px">
        ${q.status === 'open' ? `<button class="btn btn-ghost btn-sm" onclick="setInquiryStatus('${esc(q.id)}','in_progress')">در حالِ پیگیری</button>` : ''}
        ${q.status !== 'closed' ? `<button class="btn btn-primary btn-sm" onclick="setInquiryStatus('${esc(q.id)}','closed')">بستن</button>` : ''}
      </div>
    </div>`;
  }).join('')}</div>`;
}

// ════════ تعامل ════════

function salesTab(tab) { SALES_TAB = tab; rSales(); }
function salesFilter(f) { SALES_FILTER = f; loadSales(); }

function openSalesOrder(id) {
  const o = SALES_ORDERS.find((x) => String(x.id) === String(id));
  if (!o) return;
  const st = SALES_STATUS[o.status] || { label: o.status };

  openModal(`
    <div class="modal-title">${esc(o.business_name)}</div>
    <div class="modal-sub" style="direction:ltr;text-align:right">${esc(o.code)} · ${st.label}</div>

    <div class="field-label">تماس</div>
    <div style="font-size:13px;line-height:2">
      ${esc(o.contact_name)}<br>
      <span style="direction:ltr;display:inline-block">${esc(o.phone)}</span>${o.email?`<br><span style="direction:ltr;display:inline-block">${esc(o.email)}</span>`:''}
      ${o.city?`<br>${esc(o.city)}`:''}${o.branch_count?` · ${fa(o.branch_count)} شعبه`:''}
    </div>

    <div class="field-label">اشتراک</div>
    <div style="font-size:13px;line-height:2">
      ${o.kind === 'purchase' ? `${esc(o.plan_name||'—')} · ${fa(o.months||0)} ماه · ${salesToman(o.amount_toman)}` : 'دموی ۳۰ روزه'}<br>
      ثبت: ${salesDate(o.created_at)}
      ${o.trial_ends_at?`<br>پایانِ دمو: ${salesDate(o.trial_ends_at)}`:''}
      ${o.plan_expires_at?`<br>اعتبار تا: ${salesDate(o.plan_expires_at)}`:''}
    </div>

    ${o.note ? `<div class="field-label">یادداشتِ متقاضی</div><div style="font-size:13px;line-height:1.9;white-space:pre-wrap">${esc(o.note)}</div>` : ''}
    ${o.rejected_reason ? `<div class="field-label">دلیلِ رد</div><div style="font-size:13px;color:var(--red-600)">${esc(o.rejected_reason)}</div>` : ''}
    ${(o.utm_source || o.landing_path) ? `<div class="field-label">منبعِ سرنخ</div><div style="font-size:12px;color:var(--muted);direction:ltr;text-align:right">${esc([o.utm_source,o.utm_campaign,o.landing_path].filter(Boolean).join(' · '))}</div>` : ''}

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeModal()">بستن</button>
      ${o.status !== 'activated' && o.status !== 'rejected' ? `
        <button class="btn btn-ghost" onclick="rejectSalesOrder('${esc(o.id)}')">رد کردن</button>
        ${o.status === 'pending' ? `<button class="btn btn-ghost" onclick="contactSalesOrder('${esc(o.id)}')">تماس گرفتم</button>` : ''}
        ${o.kind === 'purchase' ? `<button class="btn btn-primary" onclick="activateSalesOrder('${esc(o.id)}')">فعال‌سازیِ اشتراک</button>` : ''}
      ` : ''}
    </div>`);
}

/** فراخوانِ مشترکِ عملیاتِ سفارش؛ خطا را به کاربر نشان می‌دهد و فهرست را تازه می‌کند. */
async function patchSalesOrder(id, body, successMsg) {
  const res = await API.patch(`/admin/site/orders/${id}`, body);
  if (!res.ok) {
    toast('✕', (res.error && res.error.message) || 'انجامِ عملیات ناموفق بود');
    return false;
  }
  closeModal();
  toast('✓', successMsg);
  await loadSales();
  return true;
}

async function activateSalesOrder(id) {
  const o = SALES_ORDERS.find((x) => String(x.id) === String(id));
  if (!o) return;

  // تنانتِ مقصد: از خودِ سفارش، وگرنه پیشنهادِ سرور، وگرنه از مدیر می‌پرسیم.
  let tenantId = o.tenant_id || (o.suggested_tenant && o.suggested_tenant.tenantId) || null;
  if (!tenantId) {
    tenantId = window.prompt(
      'شناسه‌ی کسب‌وکارِ مقصد (tenant id):\n' +
      'این شماره هنوز به هیچ کسب‌وکاری وصل نیست. اگر حساب ندارند، اول باید دموی رایگان بسازند.',
    );
    if (!tenantId || !tenantId.trim()) return;
    tenantId = tenantId.trim();
  }

  const who = o.suggested_tenant ? `«${o.suggested_tenant.tenantName}»` : 'این کسب‌وکار';
  if (!window.confirm(
    `اشتراکِ ${who} برای ${fa(o.months || 0)} ماه فعال شود؟\n` +
    'تاریخِ انقضای واقعی تغییر می‌کند و عمل در گزارشِ حسابرسی ثبت می‌شود.',
  )) return;

  await patchSalesOrder(id, { action: 'activate', tenant_id: tenantId }, 'اشتراک فعال شد');
}

async function rejectSalesOrder(id) {
  const reason = window.prompt('دلیلِ رد کردن (برای متقاضی هم در صفحه‌ی پیگیری دیده می‌شود):');
  if (!reason || reason.trim().length < 3) return;
  await patchSalesOrder(id, { action: 'reject', reason: reason.trim() }, 'درخواست رد شد');
}

async function contactSalesOrder(id) {
  await patchSalesOrder(id, { action: 'contact' }, 'وضعیت به «تماس گرفته شد» تغییر کرد');
}

async function setInquiryStatus(id, status) {
  const res = await API.patch(`/admin/site/inquiries/${id}`, { status });
  if (!res.ok) {
    toast('✕', (res.error && res.error.message) || 'به‌روزرسانی ناموفق بود');
    return;
  }
  toast('✓', 'وضعیتِ پیام به‌روز شد');
  await loadSales();
}

</script>
<script data-src="js/photos.js">
// ═══════════════════════════════════════════════════════════════════════
//  رزرونو — پنل company: صفِ بازبینیِ عکسِ گالری
//
//  رستوران عکس را از پنلِ کسب‌وکار آپلود می‌کند و عکس با وضعیتِ pending
//  می‌نشیند. تا وقتی اینجا تأیید نشود، در اپ مشتری و صفحه‌ی عمومیِ رستوران
//  دیده نمی‌شود. یعنی هیچ تصویری بدونِ بازبینیِ انسانی روی برندِ پلتفرم
//  منتشر نمی‌شود.
//
//  منبعِ داده: GET  /api/v1/admin/photos?status=pending
//  عملیات:    PATCH /api/v1/admin/photos/{id}  { action: 'approve'|'reject', reason? }
//             DELETE /api/v1/admin/photos/{id}  (موردِ حاد — فایل هم پاک می‌شود)
//
//  صف عمداً FIFO است (قدیمی‌ترین اول): وگرنه عکسِ یک رستورانِ کوچک می‌تواند
//  هفته‌ها پشتِ آپلودهای تازه بماند.
// ═══════════════════════════════════════════════════════════════════════

let PHOTO_ITEMS = [];
let PHOTO_FILTER = 'pending';   // pending | approved | rejected | all
let PHOTO_LOADING = false;
let PHOTO_ERROR = null;
let PHOTO_BADGE = 0;
let PHOTO_DEMO = false;         // آیا چیزی که روی صفحه است دادهٔ نمونه است؟

// نمونه‌ی نمایشی — فقط وقتی سرور در دسترس نیست (نسخه‌ی آفلاینِ پنل برای
// ارائه). نام‌ها عمداً با [DEMO] برچسب خورده‌اند تا هیچ‌وقت با دادهٔ واقعی
// اشتباه گرفته نشوند، و در این حالت دکمه‌های تأیید/رد کاری انجام نمی‌دهند —
// تصمیمِ انتشار نباید روی دادهٔ ساختگی گرفته شود.
const PHOTO_SAMPLE = [
  { id: 'demo-1', url: '', caption: 'میزهای کنارِ پنجره', category: 'interior', status: 'pending',
    width: 1600, height: 1067, byte_size: 384000, original_name: 'salon-window.jpg',
    created_at: new Date(Date.now() - 36e5 * 3).toISOString(), reviewed_at: null, rejection_reason: null,
    restaurant: { id: 'd1', name: '[DEMO] کافه‌رستوران ویستا', slug: 'demo-vista', city: 'تهران' } },
  { id: 'demo-2', url: '', caption: 'خورشتِ ویژه‌ی شب', category: 'food', status: 'pending',
    width: 1200, height: 1200, byte_size: 268000, original_name: 'dish-01.jpg',
    created_at: new Date(Date.now() - 36e5 * 9).toISOString(), reviewed_at: null, rejection_reason: null,
    restaurant: { id: 'd2', name: '[DEMO] سفره‌خانه گرام', slug: 'demo-geram', city: 'اصفهان' } },
  { id: 'demo-3', url: '', caption: '', category: 'drink', status: 'pending',
    width: 900, height: 1600, byte_size: 512000, original_name: 'bar.png',
    created_at: new Date(Date.now() - 36e5 * 26).toISOString(), reviewed_at: null, rejection_reason: null,
    restaurant: { id: 'd3', name: '[DEMO] کافه هانا', slug: 'demo-hana', city: 'تهران' } },
];

const PHOTO_STATUS = {
  pending: { label: 'در انتظار تأیید', cls: 'expiring' },
  approved: { label: 'تأییدشده', cls: 'active' },
  rejected: { label: 'ردشده', cls: 'expired' },
};
const PHOTO_CATEGORY = {
  food: 'غذا', interior: 'فضا', drink: 'نوشیدنی', event: 'رویداد', other: 'سایر',
};

/** حجم به کیلو/مگابایت با ارقامِ فارسی. */
function photoSize(bytes) {
  if (!bytes) return '—';
  return bytes >= 1024 * 1024
    ? fa((bytes / 1024 / 1024).toFixed(1)) + ' مگابایت'
    : fa(Math.round(bytes / 1024)) + ' کیلوبایت';
}

function photoDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return '—';
  try {
    return new Intl.DateTimeFormat('fa-IR-u-ca-persian', {
      month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Tehran',
    }).format(d);
  } catch { return fa(d.toISOString().slice(0, 16).replace('T', ' ')); }
}

// ════════ بارگذاری ════════

async function loadPhotos() {
  PHOTO_LOADING = true;
  PHOTO_ERROR = null;
  rPhotos();

  const res = await API.get('/admin/photos?status=' + PHOTO_FILTER + '&limit=100');
  PHOTO_LOADING = false;

  if (!res.ok) {
    if (res.offline) {
      // نسخه‌ی آفلاینِ پنل (برای ارائه): نمونه نشان داده می‌شود ولی با برچسبِ
      // آشکار و بدونِ اینکه دکمه‌ها کاری کنند. تصمیمِ انتشار نباید روی دادهٔ
      // ساختگی گرفته شود — همان قاعده، فقط به‌جای صفحه‌ی خالی، شفاف.
      PHOTO_DEMO = true;
      PHOTO_ERROR = null;
      PHOTO_ITEMS = PHOTO_FILTER === 'pending' || PHOTO_FILTER === 'all' ? PHOTO_SAMPLE : [];
      PHOTO_BADGE = PHOTO_SAMPLE.length;
    } else {
      PHOTO_DEMO = false;
      PHOTO_ERROR = (res.error && res.error.message) || 'دریافتِ صفِ بازبینی ناموفق بود.';
      PHOTO_ITEMS = [];
    }
  } else {
    PHOTO_DEMO = false;
    PHOTO_ITEMS = res.data.items || [];
    PHOTO_BADGE = res.data.pending_count || 0;
  }
  rPhotos();
  paintPhotoBadge();
}

function paintPhotoBadge() {
  const el = document.getElementById('photoBadge');
  if (!el) return;
  el.textContent = PHOTO_BADGE ? fa(PHOTO_BADGE) : '';
  el.style.display = PHOTO_BADGE ? 'inline-flex' : 'none';
}

/**
 * فقط شمارشِ صف را می‌گیرد، بدونِ رندرِ صفحه.
 * هنگامِ ورود صدا زده می‌شود تا کارِ منتظر از همان ابتدا دیده شود، نه فقط
 * وقتی که کاربر اتفاقی وارد این صفحه شود. limit=1 چون فقط عدد را می‌خواهیم.
 */
async function refreshPhotoBadge() {
  const res = await API.get('/admin/photos?status=pending&limit=1');
  if (!res.ok) return;
  PHOTO_BADGE = res.data.pending_count || 0;
  paintPhotoBadge();
}

function photoFilter(f) { PHOTO_FILTER = f; loadPhotos(); }

// ════════ رندر ════════

function rPhotos() {
  const el = document.getElementById('v-photos');
  if (!el) return;

  el.innerHTML = `
    <div class="bill-summary">
      <div class="bill-stat"><div class="bs-val" style="color:var(--amber-600)">${fa(PHOTO_BADGE)}</div><div class="bs-label">عکسِ در انتظارِ بازبینی</div></div>
      <div class="bill-stat"><div class="bs-val" style="color:var(--ink)">${fa(PHOTO_ITEMS.length)}</div><div class="bs-label">در فهرستِ فعلی</div></div>
    </div>

    <div class="panel">
      <div class="panel-head" style="flex-wrap:wrap;gap:10px">
        <div>
          <div class="panel-title">بازبینیِ عکسِ گالری</div>
          <div class="panel-sub">عکس تا تأییدِ اینجا در اپ مشتری و صفحه‌ی رستوران دیده نمی‌شود · هر تصمیم در گزارشِ حسابرسی ثبت می‌گردد</div>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap">
          ${['pending', 'approved', 'rejected', 'all'].map((f) => `
            <button class="btn btn-sm ${PHOTO_FILTER === f ? 'btn-primary' : 'btn-ghost'}" onclick="photoFilter('${f}')">
              ${f === 'pending' ? 'در انتظار' : f === 'approved' ? 'تأییدشده' : f === 'rejected' ? 'ردشده' : 'همه'}
            </button>`).join('')}
          <button class="btn btn-ghost btn-sm" onclick="loadPhotos()">${PHOTO_LOADING ? 'در حال بارگذاری…' : 'تازه‌سازی'}</button>
        </div>
      </div>

      ${PHOTO_DEMO ? `<div style="margin:0 0 14px;padding:11px 14px;background:var(--amber-50);border:1px solid #FDE68A;border-radius:10px;font-size:12.5px;color:#92400E;line-height:1.7">
        <b>نمایشِ نمونه.</b> سرور در دسترس نیست، پس این عکس‌ها ساختگی‌اند و با <b>[DEMO]</b> برچسب خورده‌اند.
        دکمه‌های تأیید و رد در این حالت چیزی را تغییر نمی‌دهند.
      </div>` : ''}
      ${PHOTO_ERROR ? `<div style="padding:22px;text-align:center;color:var(--red-600);font-size:13px">${esc(PHOTO_ERROR)}</div>` : ''}
      ${PHOTO_LOADING ? `<div style="padding:22px;text-align:center;color:var(--muted);font-size:13px">در حال دریافت…</div>` : ''}
      ${!PHOTO_LOADING && !PHOTO_ERROR ? renderPhotoQueue() : ''}
    </div>`;
}

function renderPhotoQueue() {
  if (!PHOTO_ITEMS.length) {
    return `<div style="padding:34px;text-align:center;color:var(--muted);font-size:13px">
      ${PHOTO_FILTER === 'pending' ? 'صف خالی است — همه‌ی عکس‌ها بازبینی شده‌اند.' : 'موردی در این فیلتر نیست.'}
    </div>`;
  }

  return `<div class="photo-queue">
    ${PHOTO_ITEMS.map((p) => {
      const st = PHOTO_STATUS[p.status] || PHOTO_STATUS.pending;
      return `<div class="photo-card">
        ${p.url ? `<a class="photo-card__img" href="${esc(p.url)}" target="_blank" rel="noopener noreferrer">
          <img src="${esc(p.url)}" alt="${esc(p.caption || 'عکسِ گالری')}" loading="lazy">
        </a>` : `<div class="photo-card__img photo-card__img--demo">${PHOTO_CATEGORY[p.category] || 'عکس'}</div>`}
        <div class="photo-card__body">
          <div class="photo-card__top">
            <span class="photo-card__rest">${esc(p.restaurant.name)}</span>
            <span class="badge ${st.cls}">${st.label}</span>
          </div>
          <div class="photo-card__meta">
            ${PHOTO_CATEGORY[p.category] || p.category} ·
            ${p.width && p.height ? fa(p.width) + '×' + fa(p.height) : '—'} ·
            ${photoSize(p.byte_size)} · ${photoDate(p.created_at)}
          </div>
          ${p.caption ? `<div class="photo-card__cap">${esc(p.caption)}</div>` : ''}
          ${p.rejection_reason ? `<div class="photo-card__reason">دلیلِ رد: ${esc(p.rejection_reason)}</div>` : ''}
          <div class="photo-card__actions">
            ${p.status !== 'approved' ? `<button class="btn btn-primary btn-sm" onclick="approvePhoto('${p.id}')">تأیید و انتشار</button>` : ''}
            ${p.status !== 'rejected' ? `<button class="btn btn-ghost btn-sm" onclick="rejectPhoto('${p.id}')">رد</button>` : ''}
            <button class="btn btn-ghost btn-sm" style="color:var(--red-600)" onclick="deletePhotoHard('${p.id}')">حذفِ کامل</button>
          </div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

// ════════ عملیات ════════

/** در حالتِ نمونه هیچ تصمیمی ثبت نمی‌شود — و کاربر باید بداند، نه اینکه حدس بزند. */
function demoBlocked() {
  if (!PHOTO_DEMO) return false;
  toast('', 'این یک نمایشِ نمونه است — برای تأیید یا رد باید به سرور وصل باشی');
  return true;
}

async function approvePhoto(id) {
  if (demoBlocked()) return;
  const res = await API.patch('/admin/photos/' + id, { action: 'approve' });
  if (!res.ok) { toast('✕', (res.error && res.error.message) || 'تأیید ناموفق بود'); return; }
  toast('✓', 'عکس تأیید شد و روی صفحه‌ی رستوران منتشر شد');
  loadPhotos();
}

async function rejectPhoto(id) {
  if (demoBlocked()) return;
  // دلیل اختیاری است ولی خواسته می‌شود: رستوران‌دار همین متن را در پنلش
  // می‌بیند و بدونِ آن فقط می‌فهمد «نشد»، نه اینکه چه چیزی را اصلاح کند.
  const reason = window.prompt('دلیلِ رد (برای رستوران نمایش داده می‌شود):', '');
  if (reason === null) return;
  const res = await API.patch('/admin/photos/' + id, { action: 'reject', reason: reason.trim() });
  if (!res.ok) { toast('✕', (res.error && res.error.message) || 'رد کردن ناموفق بود'); return; }
  toast('✓', 'عکس رد شد');
  loadPhotos();
}

async function deletePhotoHard(id) {
  if (demoBlocked()) return;
  if (!window.confirm('عکس و فایلش برای همیشه حذف می‌شود. مطمئنی؟')) return;
  const res = await API.del('/admin/photos/' + id);
  if (!res.ok) { toast('✕', (res.error && res.error.message) || 'حذف ناموفق بود'); return; }
  toast('✓', 'عکس حذف شد');
  loadPhotos();
}

</script>
</body>
</html>
