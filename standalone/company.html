/* ═══════════════════════════════════════════════════════════
   رزرونو — لایه‌ی فونت (منبعِ واحد)
   این فایل منبعِ حقیقت است؛ tools/sync-design-system.sh آن را به اپ‌ها کپی
   می‌کند، همراهِ خودِ فایلِ فونت در `shared/fonts/`.

   ⚠️ چرا این فایل ساخته شد (یافته‌ی P0، ممیزیِ UI/UX ۲۰۲۶-۰۸-۲۴):
   هر سه پنل فونت را با یک <link> از `https://fonts.googleapis.com` می‌گرفتند.
   سه پیامدِ واقعی:
     ۱. **بسته‌ی آفلاینِ تک‌فایلی هیچ فونتِ فارسی نداشت.** روی `file://`
        درخواست به CDN شکست می‌خورد و کلِ UI با فونتِ پیش‌فرضِ سیستم رندر
        می‌شد — همان بسته‌ای که README به کاربر می‌گوید بازش کند.

     ۳. FOUT/پرشِ چیدمان در هر بارِ اول، چون فونت روی مسیرِ بحرانیِ شبکه بود.

   حالا فونت **self-host** است: یک فایلِ variableِ ۱۰۸KB که کلِ بازه‌ی وزنِ

/* ── پشته‌ی فونت — منبعِ واحد برایِ هر سه اپ ──
   `--font-ui` تنها جایی است که خانواده‌ی فونت اعلام می‌شود؛ بقیه‌ی CSS باید
   `font-family: inherit` یا همین توکن را به‌کار ببرد، نه نامِ خانوادگیِ خام.
   (پیش از این `panel.css` و `app.css` هرکدام رشته‌ی 'Vazirmatn',… را دستی
   تکرار می‌کردند — یعنی افزودنِ Piyade باید در چند فایل انجام می‌شد.) */
:root {
  --font-ui: 'Piyade', 'Vazirmatn', -apple-system, BlinkMacSystemFont,
             'Segoe UI', system-ui, 'Noto Sans Arabic', sans-serif;
  /* اعداد و کدها (کدِ رزرو، شماره‌ی تلفن، مبلغ) — عرضِ ثابت برایِ هم‌ترازی */
  --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
}

<style data-src="css/tokens.css">
/* ═══════════════════════════════════════════════════════════
   رزرونو — سیستم توکنِ طراحیِ مشترک (Design Tokens)
   منبعِ واحدِ حقیقت برای هر سه اپ. دو لایه:
     ۱) Primitive  — مقادیرِ خام (رنگ، اندازه). هیچ‌جا مستقیم استفاده نکن.
     ۲) Semantic   — نقش‌ها (bg, text, brand, danger...). فقط این‌ها را استفاده کن.
   هر اپ تمِ خودش را با override کردنِ لایه‌ی Semantic می‌سازد.
   ═══════════════════════════════════════════════════════════ */

/* ── فونتِ Vazirmatn — self-hosted، نه از Google Fonts ──────────────────
   چرا: مخاطبِ رزرونو در ایران است و fonts.googleapis.com آن‌جا معمولاً در
   دسترس نیست. تا پیش از این، فونت فقط از Google لود می‌شد و هیچ نسخه‌ی
   محلی وجود نداشت؛ یعنی برای بخشِ بزرگی از کاربرانِ واقعی UI بی‌صدا روی
   sans-serifِ سیستم می‌افتاد (متنِ فارسی با متریک و شکلِ نادرست).

   یک فایلِ variable (۱۱۲KB) کلِ بازه‌ی وزنِ ۱۰۰..۹۰۰ را می‌دهد — جایگزینِ
   ۷ فایلِ استاتیکی که قبلاً از Google خواسته می‌شد.

   font-display: swap → متن بلافاصله با فونتِ جایگزین دیده می‌شود و بعد
   عوض می‌شود؛ هیچ‌وقت صفحه‌ی خالیِ منتظرِ فونت نداریم.
   ──────────────────────────────────────────────────────────────────── */
/* [merge ۰۸-۲۴] بلوکِ @font-face که اینجا بود به css/fonts.css منتقل شد —
   هر دو خطِ توسعه فونت را مستقل self-host کرده بودند (فایلِ باینری بایت‌به‌بایت
   یکی بود!) و دو اعلانِ هم‌زمان یعنی دوبار جاسازیِ ~۱۴۵KB در بسته‌ی آفلاین.
   fonts.css ماند چون توکن‌های --font-ui/--font-mono (پشته‌ی آماده‌ی Piyade)
   هم آنجاست و body همه‌ی اپ‌ها از var(--font-ui) می‌خواند. */

:root {
  /* ── لایه ۱: Primitive — مقیاسِ تایپوگرافی (۴px-baseline، پرش‌های واضح) ── */
  --fs-2xs: 11px;
  --fs-xs:  12px;
  --fs-sm:  13px;
  --fs-md:  14px;   /* بدنه‌ی پیش‌فرض */
  --fs-lg:  16px;
  --fs-xl:  20px;
  --fs-2xl: 24px;
  --fs-3xl: 32px;
  --fs-4xl: 40px;

  --lh-tight:   1.2;
  --lh-snug:    1.4;
  --lh-normal:  1.6;
  --lh-relaxed: 1.8;

  --ls-tight: -0.02em;   /* عنوان‌های بزرگ (به سبک Linear) */
  --ls-snug:  -0.01em;
  --ls-normal: 0;

  --fw-normal:   400;
  --fw-medium:   500;
  --fw-semibold: 600;
  --fw-bold:     700;
  --fw-extra:    800;

  /* ── لایه ۱: Primitive — مقیاسِ فاصله (۴px grid، پیکسل‌پرفکت) ── */
  --sp-0:  0;
  --sp-1:  4px;
  --sp-2:  8px;
  --sp-3:  12px;
  --sp-4:  16px;
  --sp-5:  20px;
  --sp-6:  24px;
  --sp-8:  32px;
  --sp-10: 40px;
  --sp-12: 48px;
  --sp-16: 64px;

  /* ── لایه ۱: Primitive — شعاع ── */
  --radius-xs: 8px;
  --radius-sm: 10px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-xl: 20px;
  --radius-2xl: 28px;
  --radius-full: 9999px;

  /* ── لایه ۱: Primitive — حرکت (یک سیستمِ زمانی واحد) ── */
  --motion-fast:  130ms;
  --motion-base:  200ms;
  --motion-slow:  320ms;
  --ease-out:    cubic-bezier(.4, 0, .2, 1);
  --ease-spring: cubic-bezier(.34, 1.56, .64, 1);

  /* ── لایه ۱: Primitive — رنگ‌های برند (خام) ── */
  --brand-500: #4F46E5;
  --brand-600: #4338CA;
  --brand-400: #6A4BFF;
  --violet-500: #7C3AED;
  --warm-500:  #E8925A;

  /* ── لایه ۲: Semantic — حالت‌های معنایی (مشترک بینِ همه‌ی اپ‌ها) ── */
  --success:      #12A150;
  --success-soft: #E7F6EE;
  --success-ink:  #0A7A3C;
  --warning:      #C2410C;
  --warning-soft: #FEF0E7;
  --warning-ink:  #9A3412;
  --danger:       #DC2626;
  --danger-soft:  #FDECEC;
  --danger-ink:   #B91C1C;
  --info:         #2563EB;
  --info-soft:    #E8F0FE;
  --info-ink:     #1D4ED8;

  /* ── هدفِ لمسیِ حداقل (Apple HIG / Material) ── */
  --touch-min: 44px;

  /* ── focus ring یکدست (دسترسی‌پذیری) ── */
  --focus-ring: 0 0 0 2px var(--bg, #fff), 0 0 0 4px var(--brand-500);

  /* ── لایه ۱: Primitive — Elevation (سایه‌های لایه‌ای، ۵ سطح) ──
     ⚠️ رفع‌شده (حسابرسیِ دیزاینِ Desire، ۲۰۲۶-۰۸-۱۴): این بلاک تا امروز
     بیرونِ :root تعریف شده بود (بعد از یک `}` زودهنگام) — یعنی از نظرِ CSS
     نامعتبر و کاملاً بی‌اثر بود؛ هر جا که var(--elevation-*)/var(--sh-*)/
     var(--z-*)/var(--grid-*)/var(--bp-*) بدونِ fallback استفاده می‌شد (مثلِ
     .modal، .sheet، .switch-thumb در foundation.css) مقدار به initial
     برمی‌گشت — یعنی z-index: var(--z-modal) عملاً auto بود، نه ۵۰۰. حالا
     داخلِ همان :root اصلی است؛ هیچ مقداری عوض نشده، فقط واقعاً اعمال می‌شود. */
  --elevation-0: none;
  --elevation-1: 0 1px 2px rgba(11,16,32,.05), 0 1px 1px rgba(11,16,32,.03);
  --elevation-2: 0 2px 6px rgba(11,16,32,.06), 0 1px 2px rgba(11,16,32,.04);
  --elevation-3: 0 6px 16px rgba(11,16,32,.08), 0 2px 4px rgba(11,16,32,.05);
  --elevation-4: 0 12px 32px rgba(11,16,32,.10), 0 4px 8px rgba(11,16,32,.06);
  --elevation-5: 0 24px 60px rgba(11,16,32,.16), 0 8px 16px rgba(11,16,32,.08);
  /* نام‌های مستعارِ معنایی */
  --sh-sm: var(--elevation-1);
  --sh-md: var(--elevation-3);
  --sh-lg: var(--elevation-4);
  --sh-xl: var(--elevation-5);

  /* ── لایه ۱: Primitive — Grid (۱۲ ستون، container، gutter) ── */
  --grid-cols: 12;

     (نشانِ «فعال»، «۸ روز مونده»، «۱۲ روز منقضی»، چیپِ کم‌موجودی) و
     به‌ترتیب ۳٫۱۵ / ۳٫۰۷ / ۴٫۴۱ می‌داد — هر سه زیرِ ۴٫۵.
     فقط نسخه‌ی ۶۰۰ (که مخصوصِ متن است) عمیق‌تر شد؛ ۵۰۰ و ۵۰ دست‌نخورده‌اند تا
     پُرکننده‌ها و تینت‌ها همان‌طور بمانند. حالا ۴٫۶۶ / ۴٫۶۶ / ۴٫۶۱. */
  --green:#22C55E;--green-50:#F0FDF4;--green-600:#12823B;
  --amber:#F59E0B;--amber-50:#FFFBEB;--amber-600:#AB5E05;
  --red:#EF4444;--red-50:#FEF2F2;--red-600:#D82323;
  --t1:#0F172A;--t2:#64748B;/* هم‌ایرادِ پنلِ رستوران — به مقدارِ --t2 همین پنل رسید (۴.۷۶:۱). */--t3:#64748B;--border:#E2E8F0;--border-strong:#CBD5E1;
  /* لهجه‌ی شرکت: ایندیگو/بنفش — سطح کنترل مرکزی، متمایز از پنل رستوران (آبی/سبز) */
  --ink:#4F46E5;--ink-600:#4338CA;--ink-700:#3730A3;--ink-50:#EEF2FF;--ink-100:#E0E7FF;
  --violet:#7C3AED;--violet-50:#F5F3FF;
  --ink-grad:linear-gradient(135deg,#4F46E5,#7C3AED);
  --r-xs:8px;--r-sm:10px;--r:14px;--r-lg:18px;--r-xl:24px;
  --sh-sm:0 1px 2px rgba(15,23,42,.06);
  --sh:0 1px 3px rgba(15,23,42,.08),0 1px 2px rgba(15,23,42,.04);
  --sh-md:0 4px 12px rgba(15,23,42,.06),0 2px 4px rgba(15,23,42,.04);
  --sh-lg:0 12px 32px rgba(15,23,42,.10);
  --sh-ink:0 8px 24px rgba(79,70,229,.24);
  --t-fast:130ms;--t:200ms;--ease:cubic-bezier(.4,0,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{font-family:var(--font-ui);background:var(--bg);color:var(--t1);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font-family:inherit;cursor:pointer}
::selection{background:var(--ink-100)}

/* ===== Layout ===== */
/* `svh` و نه `dvh`: برایِ min-height باید ارتفاعِ **کوچکِ** ویوپورت (با نوارِ
   آدرسِ باز) ملاک باشد. با `dvh` هر بار که نوارِ مرورگر با اسکرول ظاهر/محو
   می‌شود min-height تغییر می‌کند و کلِ صفحه می‌پرد. با `svh` صفحه ثابت است و
   اسکرولِ الکیِ چندپیکسلی هم ایجاد نمی‌شود. خطِ `100vh` fallbackِ قدیمی است. */
.app{display:flex;min-height:100vh;min-height:100svh}
/* `height:100vh` رویِ موبایل ارتفاعِ صفحه را **بدونِ** نوارِ آدرس حساب می‌کند، پس
   ته‌یِ کشو (آیتمِ خروج) زیرِ نوارِ مرورگر می‌رفت و کلیک‌ناپذیر می‌شد. `100dvh`
   ارتفاعِ واقعیِ لحظه‌ای است؛ خطِ `100vh` قبلش برایِ مرورگرِ قدیمی می‌ماند. */
.sidebar{width:248px;background:var(--white);border-left:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;right:0;height:100vh;height:100dvh;z-index:40;transition:transform var(--t) var(--ease);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.main{flex:1;margin-right:248px;min-width:0}
.sb-brand{display:flex;align-items:center;gap:11px;padding:20px;border-bottom:1px solid var(--border)}
.sb-logo{width:36px;height:36px;border-radius:10px;background:var(--ink-grad);display:flex;align-items:center;justify-content:center;
  color:#fff;font-weight:800;font-size:17px;box-shadow:var(--sh-ink)}
.sb-brand-text{font-weight:800;font-size:16px;letter-spacing:-.03em}
.sb-brand-text small{display:block;font-size:10px;font-weight:600;color:var(--ink);letter-spacing:.02em}
.sb-nav{flex:1;padding:8px;overflow-y:auto}
.sb-nav-label{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;padding:14px 12px 6px}
.sb-item{display:flex;align-items:center;gap:11px;width:100%;padding:11px 13px;border:none;background:none;border-radius:var(--r-sm);
  color:var(--t2);font-size:14px;font-weight:600;text-align:right;transition:all var(--t-fast);margin-bottom:2px}
.sb-item svg{width:19px;height:19px;flex-shrink:0}
.sb-item:hover{background:var(--s-50);color:var(--t1)}
.sb-item.active{background:var(--ink-50);color:var(--ink-700)}
.sb-foot-logout{margin-inline-start:auto;min-width:var(--touch-min);min-height:var(--touch-min);display:inline-flex;align-items:center;justify-content:center;padding:0 10px;border:1px solid var(--border);background:var(--white);border-radius:var(--r-sm);color:var(--t2);font-size:12px;font-weight:700;cursor:pointer}
.sb-foot-logout:hover{color:var(--red);border-color:#FECACA}
.sb-foot{padding:14px;border-top:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sb-foot-ava{width:36px;height:36px;border-radius:50%;background:var(--ink-grad);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.sb-foot-info{flex:1;min-width:0}
.sb-foot-name{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-foot-meta{font-size:11px;color:var(--t3)}

/* ===== Topbar ===== */
.topbar{height:64px;background:rgba(255,255,255,.85);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);
  display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:30}
.tb-title{font-size:19px;font-weight:800;letter-spacing:-.03em}
.tb-right{display:flex;align-items:center;gap:12px}
.tb-search{position:relative;display:flex;align-items:center}
.tb-search input{width:240px;padding:9px 36px 9px 14px;border:1.5px solid var(--border);border-radius:50px;outline:none;
  font-size:13px;background:var(--s-50);transition:all var(--t-fast)}
.tb-search input:focus{border-color:var(--ink);background:var(--white);width:280px}
.tb-search .s-ic{position:absolute;right:13px;color:var(--t3);pointer-events:none;font-size:14px}
.tb-burger{display:none;width:var(--touch-min);height:var(--touch-min);border:1px solid var(--border);background:var(--white);border-radius:var(--r-sm);font-size:18px}
.content{padding:28px;max-width:1400px}

/* ===== Components ===== */
.panel{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:22px;box-shadow:var(--sh-sm)}
.panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.panel-title{font-size:16px;font-weight:800;letter-spacing:-.02em}
.panel-sub{font-size:12.5px;color:var(--t2);margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 18px;border-radius:var(--r-sm);
  border:none;font-size:13.5px;font-weight:700;transition:all var(--t-fast);white-space:nowrap}
.btn-sm{padding:7px 13px;font-size:12.5px}
.btn-lg{padding:13px 24px;font-size:15px}
.btn:active{transform:scale(.97)}
.btn-block{width:100%}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:var(--ink-600);box-shadow:var(--sh-ink)}
.btn-ghost{background:var(--white);color:var(--t1);border:1.5px solid var(--border)}
.btn-ghost:hover{border-color:var(--border-strong);background:var(--s-50)}
.btn-danger{background:var(--red-50);color:var(--red-600)}
.btn-danger:hover{background:#FEE2E2}

/* ===== Hero KPIs ===== */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:24px}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-sm);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;top:0;right:0;width:100%;height:3px;background:var(--ink-grad);opacity:0;transition:opacity var(--t)}
.kpi:hover::before{opacity:1}
.kpi-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.kpi-ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px}
.kpi-ic.ink{background:var(--ink-50)}.kpi-ic.green{background:var(--green-50)}.kpi-ic.amber{background:var(--amber-50)}.kpi-ic.violet{background:var(--violet-50)}
.kpi-delta{font-size:11px;font-weight:800;padding:3px 9px;border-radius:50px}
.kpi-delta.up{background:var(--green-50);color:var(--green-600)}
.kpi-delta.down{background:var(--red-50);color:var(--red-600)}
.kpi-val{font-size:30px;font-weight:800;letter-spacing:-.03em;line-height:1}
.kpi-label{font-size:13px;color:var(--t2);font-weight:600;margin-top:5px}

/* ===== Restaurant table ===== */
.rest-controls{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.filter-chip{padding:8px 16px;border:1.5px solid var(--border);border-radius:50px;background:var(--white);
  font-size:12.5px;font-weight:700;color:var(--t2);transition:all var(--t-fast)}
.filter-chip:hover{border-color:var(--border-strong)}
.filter-chip.active{background:var(--s-900);border-color:var(--s-900);color:#fff}
.rest-list{display:flex;flex-direction:column;gap:0}
.rest-row{display:grid;grid-template-columns:2.4fr 1fr 1fr 1.1fr 0.6fr;align-items:center;gap:16px;padding:16px 8px;
  border-bottom:1px solid var(--border);transition:background var(--t-fast);cursor:pointer}
.rest-row:hover{background:var(--s-50)}
.rest-row:last-child{border-bottom:none}
.rest-head{display:grid;grid-template-columns:2.4fr 1fr 1fr 1.1fr 0.6fr;gap:16px;padding:0 8px 10px;
  font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.04em}
.rest-name-cell{display:flex;align-items:center;gap:12px;min-width:0}
.rest-logo{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
.rest-logo img{width:100%;height:100%;object-fit:cover}
.rest-name{font-size:14.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rest-loc{font-size:12px;color:var(--t2)}
.rest-metric{font-size:14px;font-weight:700}
.rest-metric small{display:block;font-size:11px;color:var(--t3);font-weight:600}
.badge{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:50px;font-size:11.5px;font-weight:700}
.badge .bdot{width:6px;height:6px;border-radius:50%;background:currentColor}
.badge.active{background:var(--green-50);color:var(--green-600)}
.badge.expiring{background:var(--amber-50);color:var(--amber-600)}
.badge.expired{background:var(--red-50);color:var(--red-600)}
.badge.trial{background:var(--ink-50);color:var(--ink-700)}
.rest-arrow{color:var(--t3);font-size:18px;text-align:left}
/* ── back button ── */
.back-btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border:1.5px solid var(--border);background:var(--white);
  border-radius:50px;font-size:13px;font-weight:700;color:var(--t2);margin-bottom:18px;transition:all var(--t-fast)}
.back-btn:hover{border-color:var(--border-strong);color:var(--t1)}
/* ── detail header ── */
.detail-hero{display:flex;align-items:center;gap:18px;padding:24px;background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);margin-bottom:20px;flex-wrap:wrap;box-shadow:var(--sh-sm)}
.detail-logo{width:72px;height:72px;border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:34px;flex-shrink:0;box-shadow:var(--sh-sm)}
.detail-info{flex:1;min-width:200px}
.detail-name{font-size:22px;font-weight:800;letter-spacing:-.02em}
.detail-meta{font-size:13px;color:var(--t2);margin-top:3px}
.detail-actions{display:flex;gap:8px;flex-wrap:wrap}
/* ── inner tabs ── */
.itabs{display:flex;gap:4px;background:var(--s-100);padding:4px;border-radius:var(--r);margin-bottom:20px;overflow-x:auto}
.itab{flex:1;min-width:max-content;padding:10px 16px;border:none;background:none;cursor:pointer;border-radius:var(--r-sm);
  font-size:13.5px;font-weight:700;color:var(--t2);transition:all var(--t-fast);white-space:nowrap}
.itab:hover{color:var(--t1)}
.itab.active{background:var(--white);color:var(--ink);box-shadow:var(--sh-sm)}
.isub{display:none}.isub.active{display:block;animation:fadeUp .25s var(--ease)}
/* ── member list ── */
.mini-list{display:flex;flex-direction:column}
.mini-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}
.mini-row:last-child{border:none}
.mini-ava{width:38px;height:38px;border-radius:50%;background:var(--ink-50);display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.mini-info{flex:1;min-width:0}
.mini-name{font-size:13.5px;font-weight:700}
.mini-sub{font-size:11.5px;color:var(--t2)}
.mini-tag{font-size:10px;font-weight:800;padding:3px 9px;border-radius:50px;background:var(--ink-50);color:var(--ink-700)}
/* ── donut ── */
.donut-wrap{display:flex;align-items:center;gap:24px;flex-wrap:wrap}
.donut{width:120px;height:120px;border-radius:50%;flex-shrink:0;position:relative;display:flex;align-items:center;justify-content:center}
.donut-hole{width:78px;height:78px;background:var(--white);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-hole .dv{font-size:22px;font-weight:800;line-height:1}
.donut-hole .dl{font-size:10px;color:var(--t2)}
.legend{flex:1;min-width:120px}
.legend-item{display:flex;align-items:center;gap:8px;font-size:12.5px;margin-bottom:9px}
.legend-dot{width:10px;height:10px;border-radius:3px}
.legend-val{margin-right:auto;font-weight:700}
/* ── billing card ── */
.bill-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}
.bill-stat{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:18px;text-align:center;box-shadow:var(--sh-sm)}
.bill-stat .bs-val{font-size:26px;font-weight:800;letter-spacing:-.02em}
.bill-stat .bs-label{font-size:12px;color:var(--t2);margin-top:4px}
.plan-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;border-radius:50px;font-size:11.5px;font-weight:700}
.plan-badge.pro{background:var(--ink-50);color:var(--ink-700)}
.plan-badge.basic{background:var(--s-100);color:var(--s-600)}
.plan-badge.trial{background:var(--violet-50);color:var(--violet)}
.progress-track{height:8px;background:var(--s-100);border-radius:4px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:4px;transition:width .8s var(--ease)}
/* ── support tools ── */
.support-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;margin-bottom:20px}
.support-card{background:var(--white);border:1px solid var(--border);border-radius:var(--r-lg);padding:20px;box-shadow:var(--sh-sm);transition:all var(--t)}
.support-card:hover{box-shadow:var(--sh-md);transform:translateY(-2px)}
.support-ic{width:46px;height:46px;border-radius:12px;background:var(--ink-50);display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px}
.support-title{font-size:15px;font-weight:800;margin-bottom:5px}
.support-desc{font-size:12.5px;color:var(--t2);line-height:1.5;margin-bottom:14px}
.session-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--border)}
.session-row:last-child{border:none}
.session-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.session-dot.live{background:var(--green);box-shadow:0 0 0 3px var(--green-50);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

/* ── دیتای مشتریان (مرکز فرماندهی) ── */
.click-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.click-stat{display:flex;align-items:center;gap:10px;background:var(--s-50);border-radius:var(--r);padding:13px}
.click-ic{font-size:22px;flex-shrink:0}
.click-count{font-size:19px;font-weight:800;color:var(--t1);line-height:1}
.click-label{font-size:11px;color:var(--t2);margin-top:3px;line-height:1.4}
.funnel-note{margin-top:14px;padding:11px 14px;background:var(--ink-50);border-radius:var(--r-sm);font-size:12.5px;color:var(--ink-700);font-weight:600;text-align:center}
.cust-controls{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap;align-items:center}
.cust-search{flex:1;min-width:220px;padding:11px 15px;border:1px solid var(--border);border-radius:var(--r-sm);font-family:inherit;font-size:14px;background:var(--white)}
.cust-search:focus{outline:none;border-color:var(--ink-700)}
.cust-filters{display:flex;gap:7px}
.cust-fbtn{padding:9px 16px;border:1px solid var(--border);background:var(--white);border-radius:50px;font-size:13px;font-weight:600;color:var(--t2);cursor:pointer;font-family:inherit;transition:all .15s}
.cust-fbtn.active{background:var(--ink-700);color:#fff;border-color:var(--ink-700)}
.cust-table{display:flex;flex-direction:column}
.cust-row{display:flex;align-items:center;gap:14px;padding:13px 8px;border-bottom:1px solid var(--s-100);cursor:pointer;transition:background .15s}
.cust-row:hover{background:var(--s-50)}.cust-row:last-child{border-bottom:none}
.cust-ava{font-size:30px;flex-shrink:0}
.cust-main{flex:1;min-width:0}
.cust-name{font-size:14.5px;font-weight:700;color:var(--t1);display:flex;align-items:center;gap:7px}
.cust-vip{font-size:9px;background:linear-gradient(135deg,#FBBF24,#F59E0B);color:#fff;padding:2px 8px;border-radius:50px;font-weight:800}
.cust-new{font-size:9px;background:var(--green);color:#fff;padding:2px 8px;border-radius:50px;font-weight:800}
.cust-phone{font-size:12.5px;color:var(--t2);margin-top:2px;font-variant-numeric:tabular-nums}
.cust-stats-mini{display:flex;gap:18px}
.csm{font-size:11px;color:var(--t3);text-align:center;display:flex;flex-direction:column;gap:1px}
.csm span{font-size:14px;font-weight:700;color:var(--t1)}
.csm-bday span{font-size:12px;color:var(--ink-700)}
.cust-arrow{font-size:22px;color:var(--t3)}
/* جزئیات مشتری */
.cd-head{display:flex;gap:14px;align-items:center;margin-bottom:18px}
.cd-ava{font-size:46px}
.cd-name{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.cd-sub{font-size:13px;color:var(--t2);margin-top:3px}
.cd-section{font-size:12px;font-weight:700;color:var(--t3);text-transform:uppercase;margin:18px 0 10px;letter-spacing:.04em}
.cd-info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cd-info{background:var(--s-50);border-radius:var(--r-sm);padding:11px 13px;display:flex;flex-direction:column;gap:3px}
.cd-il{font-size:11px;color:var(--t3)}.cd-iv{font-size:14px;font-weight:700;color:var(--t1);font-variant-numeric:tabular-nums}
.cd-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.cd-stat{background:var(--s-50);border-radius:var(--r-sm);padding:13px;text-align:center}
.cd-sv{font-size:18px;font-weight:800;color:var(--t1)}.cd-sl{font-size:11px;color:var(--t3);margin-top:3px}
.cd-bars{display:flex;flex-direction:column;gap:12px}
.cd-bar-row{display:flex;align-items:center;gap:10px}
.cd-bl{font-size:12.5px;color:var(--t2);width:80px;flex-shrink:0}
.cd-bar{flex:1;height:8px;background:var(--s-100);border-radius:50px;overflow:hidden}

<script>
// ── آدرسِ APIِ قابلِ‌تنظیم بدونِ build (۲۰۲۶-۰۸-۲۶) ──
// چرا: پنل استاتیک است و پیش‌فرضِ api-core «same-origin» — پشتِ nginxِ
// استقرار درست است، ولی هر سروِ استاتیکِ دیگر (serve محلی، بسته‌ی آفلاین
// رویِ یک بک‌اندِ واقعی) POST را با 405 برمی‌گرداند و ورود ناممکن می‌شود.
// یک‌بار «?api=http://host:port» به URL بده تا ذخیره شود؛ «?api=» خالی
// پاکش می‌کند. بدونِ آن هیچ رفتاری عوض نمی‌شود (localStorage خالی = همان
// same-origin). try/catch برای حالتِ خصوصیِ مرورگر.
(function(){try{
  var q=new URLSearchParams(location.search);
  if(q.has('api')){var v=q.get('api')||'';v?localStorage.setItem('rz_api_base',v):localStorage.removeItem('rz_api_base');}
  var s=localStorage.getItem('rz_api_base');
  if(s) window.RZ_API_BASE=s;
}catch(e){}})();
</script>

<script data-src="js/api-core.js">
/* ═══════════════════════════════════════════════════════════
   رزرونو — هسته‌ی مشترکِ HTTP (transport) — منبعِ واحد
   این فایل منبعِ حقیقت است؛ tools/sync-design-system.sh آن را به اپ‌ها می‌سازد
   (customer نسخه‌ی ESM عیناً؛ در آینده پنل‌ها نسخه‌ی global).

   httpJson: یک fetchِ کم‌سطحِ بدونِ حالت — timeout، پارس JSON، envelope یکدست،
   و حالتِ offline. هیچ منطقِ auth/token/refresh اینجا نیست (آن سطح در هر اپ می‌ماند).
   خروجی:
     موفق   → { ok:true,  status, data }
     ناموفق → { ok:false, status, data, error }
     خطا/timeout → { ok:false, offline:true, error }
   ═══════════════════════════════════════════════════════════ */
// ── بسته‌ی آفلاینِ تک‌فایلی یا نه؟ ──
// `location.protocol === 'file:'` تنها نشانه‌ی قابلِ‌اعتمادِ «این نسخه عمداً
// بدونِ بک‌اند اجرا می‌شود» است (standalone/*.html). این تمایز حیاتی است و
// نباید با «سرور موقتاً در دسترس نیست» یکی گرفته شود:
//   • file://  → دمویِ آفلاینِ اعلام‌شده؛ دادهٔ نمونه و کدِ ثابتِ OTP مجازند.
//   • http(s) → استقرارِ واقعی؛ شکستِ شبکه باید **خطا** نشان دهد، نه موفقیتِ
//     جعلی یا دادهٔ نمونه‌ای که کاربر آن را واقعی می‌پندارد (پروتکل §۱۰).
// منبعِ واحد برای هر سه اپ — قبلاً همین شرط در ۵ جا کپی شده بود.
function isOfflineDemo() {
  try { return typeof location !== 'undefined' && location.protocol === 'file:'; }
  catch { return false; }
}

// آدرسِ پایه‌ی API — قابلِ تنظیم بدونِ build: window.RZ_API_BASE یا
// <meta name="rz-api-base" content="https://...">. پیش‌فرض '' = same-origin
// (رفتارِ فعلی/دمو بدونِ تغییر). منبعِ واحد برای هر سه اپ.
function resolveApiBase() {
  try {
    if (typeof window !== 'undefined' && window.RZ_API_BASE) return String(window.RZ_API_BASE).replace(/\/$/, '');
    const m = (typeof document !== 'undefined') && document.querySelector('meta[name="rz-api-base"]');
    if (m && m.content) return String(m.content).trim().replace(/\/$/, '');
  } catch { /* noop */ }
  return '';
}

async function httpJson(url, opts = {}, timeoutMs = 8000) {
  // روی پروتکل file: (باز کردن مستقیم HTML) درخواستِ نسبی به file:///api/… می‌رود
  // و همیشه شکست می‌خورد + خطای کنسول می‌سازد؛ مستقیم حالتِ offline برگردان.
  if (isOfflineDemo() && !/^https?:/i.test(url)) {
    return { ok: false, offline: true, error: { message: 'اتصال به سرور برقرار نشد' } };
  }
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), timeoutMs);
  try {
    const res = await fetch(url, { ...opts, signal: ctrl.signal });
    clearTimeout(timer);
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      return { ok: false, status: res.status, data, error: data?.error || { message: `خطای ${res.status}` } };
    }
    return { ok: true, status: res.status, data };
  } catch (e) {
    clearTimeout(timer);
    return { ok: false, offline: true, error: { message: e.name === 'AbortError' ? 'زمان درخواست تمام شد' : 'اتصال به سرور برقرار نشد' } };
  }
}

// ═══════════════════════════════════════════════════════════
//  تمدیدِ توکن — منبعِ واحد برایِ هر سه اپ
//
//  ⚠️ چرا اضافه شد (پروتکل §۶ «duplicated authentication logic»):
//  همین منطق **سه بار** کپی شده بود — `apps/customer/js/api.js`،
//  `apps/business/js/data.js`، `apps/company/js/api.js` — با تنها تفاوتِ
//  پیشوندِ کلیدِ localStorage و نامِ callbackِ انقضا. یعنی هر رفعِ امنیتی رویِ
//  مسیرِ refresh باید سه بار اعمال می‌شد و **جاافتادنِ یکی یک آسیب‌پذیریِ
//  واقعی** بود (نشستی که باید باطل می‌شد، باطل نمی‌شد).
//
//  عمداً فقط همین هسته مشترک شد، نه کلِ `request`: پنلِ کسب‌وکار داخلِ
//  `request` منطقِ اضافیِ چندشعبه‌ای دارد (هدرِ X-Restaurant-Id و بازیابیِ
//  شعبه‌ی کهنه، با تاریخچه‌ی P0). ادغامِ آن یعنی یا از دست دادنِ آن رفتار یا
//  ساختنِ یک انتزاعِ پرشاخه — دقیقاً چیزی که §۷ منع می‌کند.
//
//  رفتار عیناً همان قبل است: چند ۴۰۱ِ هم‌زمان یک Promiseِ مشترک می‌گیرند
//  (بدونِ رقابت)، و refresh هم rotate می‌شود.
// ═══════════════════════════════════════════════════════════
function refreshAccessToken(api) {
  if (api._refreshing) return api._refreshing;
  api._refreshing = (async () => {
    try {
      const res = await fetch(api.base + '/api/v1/auth/refresh', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ refresh: api._refresh }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data?.access) {
        api.setToken(data.access);
        api.setRefresh(data.refresh);   // rotation: refresh هم نو می‌شود
        return true;
      }
      return false;
    } catch { return false; }
    finally { api._refreshing = null; }
  })();
  return api._refreshing;
}

// ── تولیدِ کلیدِ Idempotency برای عملیاتِ نوشتنیِ حساس (مثلاً ثبتِ رزرو) ──
// یک UUID per «قصدِ کاربر» (نه per تلاشِ HTTP): سرِ فراخوان (مثلاً confirmBook)
// یک‌بار ساخته می‌شود و برای همه‌ی تلاش‌های داخلیِ همان submit (شاملِ retryِ
// خودکارِ ۴۰۱→refresh) همان می‌ماند؛ submitِ بعدیِ کاربر کلیدِ تازه می‌گیرد —
// این‌طور دوبار زدنِ دکمه/ریترایِ شبکه رزروِ دوم نمی‌سازد، ولی submitِ جدید هم
// بی‌جهت به کلیدِ کهنه گیر نمی‌کند.
function genIdempotencyKey() {
  try {
    if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID();
  } catch { /* noop */ }
  // fallback برای مرورگر/محیطِ بدونِ crypto.randomUUID (نسخه‌ی v4-like غیررمزنگارانه؛
  // اینجا فقط برای یکتاییِ محلیِ کلیدِ idempotency لازم است، نه امنیت).
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
    const r = (Math.random() * 16) | 0;
    const v = c === 'x' ? r : (r & 0x3) | 0x8;
    return v.toString(16);
  });
}

if (typeof window !== "undefined") { window.httpJson = httpJson; window.resolveApiBase = resolveApiBase; window.genIdempotencyKey = genIdempotencyKey; window.isOfflineDemo = isOfflineDemo; window.refreshAccessToken = refreshAccessToken; }

</script>
<script data-src="js/format.js">
/* ═══════════════════════════════════════════════════════════
   رزرونو — helperهای خالصِ نمایش/امنیت (منبعِ واحد؛ فقط پنل‌ها)
   این فایل منبعِ حقیقت است؛ tools/sync-design-system.sh نسخه‌ی global آن را
   به پنل‌های business/company می‌سازد (export حذف می‌شود؛ برای <script> کلاسیک).

   نکته: اپ customer عمداً اینجا نیست — `fa` در customer معنایِ متفاوتی دارد
   (تبدیلِ رقمِ ASCII به فارسی، نه فرمتِ عددِ fa-IR)، پس نباید یکی شود.

   fa  : فرمتِ عدد با جداکننده‌ی فارسی (۱۲٬۳۴۵).
   esc : escape کردنِ ورودی قبل از تزریق به HTML (ضدِّ XSS) — تنها پیاده‌سازیِ
         کانونیِ پنل‌ها؛ رفعِ باگِ escape یک‌جا برای هر دو پنل اعمال می‌شود.
   ═══════════════════════════════════════════════════════════ */
function fa(n){return (n==null||Number.isNaN(n))?'۰':n.toLocaleString('fa-IR')}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ───────────────────────────────────────────────────────────
   jsq : یک literalِ **کاملِ** رشته‌ی JS که داخلِ attributeِ HTML هم امن است.

   ⚠️ چرا esc() برای این بافت کافی نیست (آسیب‌پذیریِ واقعیِ ۲۰۲۶-۰۸-۲۵):
   در `onclick="f('${esc(x)}')"` پارسرِ HTML مقدارِ attribute را **پیش از**
   پارسرِ JS decode می‌کند. esc آپاستروف را به `&#39;` می‌برد، ولی مرورگر
   همان را دوباره به `'` برمی‌گرداند و آن آپاستروف رشته‌ی JS را می‌بندد:
       نامِ مهمان = x');alert(1)//   →   f('x');alert(1)//')
   یعنی هر متنی که کاربر کنترل می‌کند (نامِ مهمان، یادداشت، نامِ آیتمِ منو)
   در مرورگرِ کارکنان کد اجرا می‌کند → سرقتِ توکن → تصرفِ تنانت.

   ترتیبِ jsq حیاتی است: **اول** JSON.stringify (escapeِ رشته‌ی JS)،
   **بعد** esc (escapeِ HTML). پس از decodeِ مرورگر، آنچه به پارسرِ JS
   می‌رسد یک literalِ درست‌escape‌شده است.

   استفاده: onclick="f(${jsq(x)})"   — نه   onclick="f('${esc(x)}')"
   خودِ jsq کوتیشن‌ها را می‌گذارد؛ دورش کوتیشن نگذار.
   ─────────────────────────────────────────────────────────── */
function jsq(v){return esc(JSON.stringify(String(v==null?'':v)))}

</script>
<script data-src="js/api.js">
// ═══ رزرونو — پنل company: ابزارها + لایه‌ی اتصال API admin (Vanilla JS، scope مشترک) ═══
let tt;
function toast(icon,msg){const t=document.getElementById('toast');document.getElementById('toastIcon').textContent=icon;document.getElementById('toastMsg').textContent=msg;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2600)}
function toggleSidebar(){const open=document.getElementById('sidebar').classList.toggle('open');document.getElementById('sbOverlay').classList.toggle('show');
  // aria-expanded باید با وضعیتِ واقعی همگام بماند وگرنه صفحه‌خوان همیشه «بسته» اعلام می‌کند (پنلِ business از قبل داشت؛ اینجا جا مانده بود).
  document.querySelector('.tb-burger')?.setAttribute('aria-expanded',String(open))}

// ═══════════════════════════════════════════════════════════
//  لایه‌ی اتصال API (فاز ۳) — پنل شرکت به endpointهای admin
//  با بک‌اند → داده‌ی واقعی · بدون بک‌اند → نمونه (پنل نمی‌شکند)
// ═══════════════════════════════════════════════════════════
const API = {
  base: resolveApiBase(),            // '' = same-origin؛ قابلِ override با window.RZ_API_BASE یا <meta rz-api-base> (از api-core.js)
  timeout: 8000,
  _token: null,
  _refresh: null,
  _refreshing: null,
  online: true,
  setToken(t){ this._token = t; try { if(t) localStorage.setItem('rz_co_access', t); else localStorage.removeItem('rz_co_access'); } catch {} },
  getToken(){ return this._token; },
  setRefresh(t){ this._refresh = t; try { if(t) localStorage.setItem('rz_co_refresh', t); else localStorage.removeItem('rz_co_refresh'); } catch {} },
  restoreSession(){ try { this._token = localStorage.getItem('rz_co_access')||null; this._refresh = localStorage.getItem('rz_co_refresh')||null; } catch {} return !!this._token; },
  async request(path, opts = {}, _retried = false){
    // transportِ خام به httpJsonِ مشترک (window.httpJson) واگذار می‌شود؛ منطقِ auth
    // (Authorization، ۴۰۱→refresh→retry، session-expired) اینجا و بدونِ تغییر می‌ماند.
    const headers = { 'Content-Type': 'application/json', ...(opts.headers || {}) };
    if (this._token) headers['Authorization'] = `Bearer ${this._token}`;
    const r = await httpJson(this.base + '/api/v1' + path, { ...opts, headers }, this.timeout);
    if (!r.ok && !r.offline && r.status === 401 && this._refresh && !_retried && !path.startsWith('/auth/')) {
      if (await this._doRefresh()) return this.request(path, opts, true);
      this._onSessionExpired();
    }
    if (r.ok) return { ok: true, status: r.status, data: r.data };
    if (r.offline) return { ok: false, offline: true, error: r.error };
    return { ok: false, status: r.status, error: r.error || { message: `خطای ${r.status}` } };
  },
  // منطقِ تمدید حالا در shared/js/api-core.js است (§۶ — سه کپیِ یکسان یکی شد).
  async _doRefresh(){ return refreshAccessToken(this); },
  _onSessionExpired(){ this.setToken(null); this.setRefresh(null); if (typeof onAdminSessionExpired === 'function') onAdminSessionExpired(); },
  get(path){ return this.request(path); },
  post(path, body){ return this.request(path, { method:'POST', body: JSON.stringify(body||{}) }); },
  patch(path, body){ return this.request(path, { method:'PATCH', body: JSON.stringify(body||{}) }); },
  del(path){ return this.request(path, { method:'DELETE' }); },
  // ── ورود با نام کاربری و رمز (مهاجرتِ ۰۷۴) ──
  // مسیرِ اصلیِ ورود به پنلِ شرکت. OTP کنارش می‌ماند چون مسیرِ پشتیبان است:
  // اگر رمز فراموش شد و کاوه‌نگار راه افتاده باشد، راهِ برگشت وجود دارد.
  // آیا سرور عاملِ سوم (TOTP) می‌خواهد؟ پاسخِ منفی یعنی فیلد اصلاً رندر نشود.
  // ⚠️ تصمیم عمداً سمتِ سرور است: پنل استاتیک است و env را نمی‌بیند، و
  // پنهان‌کردنِ فیلد با CSS قبلاً در همین مخزن دور زده شده بود.
  adminTotpRequired(){ return this.get('/auth/admin/login'); },
  async adminLogin(username, password, totp){
    const res = await this.request('/auth/admin/login', {
      method:'POST',
      body: JSON.stringify(totp ? { username, password, totp } : { username, password }),
    });
    if (res.ok && res.data?.access) { this.setToken(res.data.access); this.setRefresh(res.data.refresh); }
    return res;
  },
  // ── اعتبارنامه‌ی بیزنس‌ها (پنلِ شرکت یوزر/پسورد می‌سازد) ──
  staffCredentials(restaurantId){ return this.get(`/admin/staff-credentials?restaurant_id=${encodeURIComponent(restaurantId)}`); },
  setStaffCredentials(payload){ return this.post('/admin/staff-credentials', payload); },
  // ── SPEC-B: provisioningِ کسب‌وکار از پنلِ شرکت ──
  // Idempotency-Key اجباری است (دابل‌کلیک/retry = همان یک رستوران).
  adminCreateRestaurant(body, idemKey){
    return this.request('/admin/restaurants', { method:'POST', body: JSON.stringify(body||{}), headers:{ 'Idempotency-Key': idemKey } });
  },
  adminResendInvite(id){ return this.post(`/admin/restaurants/${id}/resend-invite`, {}); },
  adminCreateBranch(id, body){ return this.post(`/admin/restaurants/${id}/branches`, body); },
  async requestAdminOtp(phone){ return this.request('/auth/admin/request', { method:'POST', body: JSON.stringify({ phone }) }); },
  async verifyAdminOtp(phone, code){
    const res = await this.request('/auth/admin/verify', { method:'POST', body: JSON.stringify({ phone, code }) });
    if (res.ok && res.data?.access) { this.setToken(res.data.access); this.setRefresh(res.data.refresh); }
    return res;
  },
  async doLogout(){
    if (this._refresh) { await fetch(this.base + '/api/v1/auth/logout', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh: this._refresh }) }).catch(() => {}); }
    this.setToken(null); this.setRefresh(null);
  },
  overview(){ return this.get('/admin/overview'); },
  systemHealth(){ return this.get('/admin/system-health'); },
  modelHealth(){ return this.get('/admin/ai/model-health'); },
  businessIntelligence(){ return this.get('/admin/business-intelligence'); },
  security(){ return this.get('/admin/security'); },
  abuseFlagAction(userId, action, reason){ return this.patch(`/admin/abuse-flags/${userId}`, { action, reason }); },
  // ── Customer 360 (Company Control Plane، فازِ ۲) ──
  customer360(idOrPhone){
    const isUuid = /^[0-9a-f]{8}-[0-9a-f]{4}-[1-5][0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/i.test(idOrPhone);
    return isUuid ? this.get(`/admin/users/${idOrPhone}`) : this.get(`/admin/users?phone=${encodeURIComponent(idOrPhone)}`);

    API.online = true;

      // ⚠️ رفع‌شده (ممیزیِ ۲۰۲۶-۰۸-۲۴): apiR.id همیشه UUID است و idِ نمونه عددِ
      // ۱..۸ — پس find همیشه شکست می‌خورد و *همه‌ی* رستوران‌های واقعی دقیقاً
      // لوگو/گرادیانِ نمونه‌ی شماره‌ی ۱ (🌿 سبز) را می‌گرفتند. حالا انتخابِ
      // تزئینی، قطعی و متنوع بر اساسِ هَشِ id است (همان الگویِ اپ مشتری).
      const key = String(apiR.id || '');
      let h = 0; for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;

  // اعدادِ کاملاً جعلی (۱۲۴۰ عضو، ۳۴۲۰ رزرو) را عینِ داده‌ی واقعی می‌دید.
  return RESTAURANTS_SAMPLE.map(s => ({
    ...s,
    name: s.name.startsWith('[DEMO]') ? s.name : `[DEMO] ${s.name}`,

  }));
}

<script data-src="js/analytics.js">
// ═══════════════════════════════════════════════════════════
//  رزرونو (پنل کمپانی) — امیترِ رویدادِ رفتاری (Data Platform · فاز۲)
//
//  اسکریپتِ کلاسیک (global، بدونِ import/export). رویدادها را دسته‌ای و بی‌صدا
//  به POST /api/v1/telemetry می‌فرستد. هرگز چیزی نمی‌شکند (همه‌ی مسیرها try/catch)؛
//  دمومود امن. ناشناس بر پایه‌ی sessionId. بعد از api.js بارگذاری شود.
//  window.rzTrack(type, payload) را در دسترس می‌گذارد.
//  معماری: docs/INTELLIGENCE-PLATFORM-ARCHITECTURE.md
// ═══════════════════════════════════════════════════════════
(function () {
  'use strict';
  var SOURCE = 'company';
  var SID_KEY = 'rz_sid_co';
  var Q_KEY = 'rz_evq_co';
  var MAX_BATCH = 50;
  var FLUSH_AT = 10;

  function endpoint() {
    var base = (typeof API !== 'undefined' && API && API.base) ? API.base : '';
    return base + '/api/v1/telemetry';
  }
  function sessionId() {
    try {
      var s = localStorage.getItem(SID_KEY);
      if (!s) { s = 's_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); localStorage.setItem(SID_KEY, s); }
      return s;
    } catch (e) { return 'anon'; }
  }

  var queue = [];
  try { var raw = localStorage.getItem(Q_KEY); if (raw) queue = JSON.parse(raw) || []; } catch (e) { queue = []; }
  function persist() { try { localStorage.setItem(Q_KEY, JSON.stringify(queue.slice(-200))); } catch (e) { /* سهمیه پر */ } }

  function flush(useBeacon) {
    if (!queue.length) return;
    // روی file: (باز کردن مستقیم HTML) ارسال ممکن نیست — بی‌صدا در صف بماند
    try { if (location.protocol === 'file:' && !/^https?:/i.test(endpoint())) return; } catch (e) { /* noop */ }
    var batch = queue.slice(0, MAX_BATCH);
    var body = JSON.stringify({ events: batch });
    var url = endpoint();
    if (useBeacon) {
      try {
        if (navigator.sendBeacon && navigator.sendBeacon(url, new Blob([body], { type: 'application/json' }))) {
          queue = queue.slice(batch.length); persist(); return;
        }
      } catch (e) { /* به fetch برگرد */ }
    }
    try {
      fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: body, keepalive: true })
        .then(function (r) { if (r && r.ok) { queue = queue.slice(batch.length); persist(); } })
        .catch(function () { /* آفلاین — در صف می‌ماند */ });
    } catch (e) { /* no-op */ }
  }

  /** شناسه‌ی تصادفیِ ۳۲ کاراکتری — فقط برایِ یکتاییِ محلی، نه امنیت. */
  function newEventId() {
    try {
      if (typeof crypto !== 'undefined' && crypto.randomUUID) return crypto.randomUUID().replace(/-/g, '');
    } catch (e) { /* no-op */ }
    return (Date.now().toString(36) + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 12)).slice(0, 32);
  }

  function track(type, payload) {
    try {
      // eventId: شناسه‌ی یکتا per «قصد» برایِ dedupِ سمتِ سرور (پروتکل §۱۴).
      // تحویلِ کلاینت ذاتاً at-least-once است (صفِ localStorage + sendBeacon
      // + retryِ بارگذاریِ بعدی)، پس idempotency باید سمتِ سرور باشد — و
      // سرور برایِ آن به یک شناسه‌ی پایدار per رویداد نیاز دارد.
      queue.push({ type: String(type), eventId: newEventId(), occurredAt: new Date().toISOString(), source: SOURCE, sessionId: sessionId(), payload: payload || {} });
      persist();
      if (queue.length >= FLUSH_AT) flush(false);
    } catch (e) { /* no-op */ }
  }

  try {
    addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(true); });
    addEventListener('pagehide', function () { flush(true); });
  } catch (e) { /* no-op */ }

  try { if (queue.length) flush(false); } catch (e) { /* no-op */ }

  track('app.opened', {});
  try { window.rzTrack = track; } catch (e) { /* no-op */ }
})();

</script>

// ⚠️ برابریِ دسترس‌پذیری با پنلِ رستوران (فازِ ۲، §۲۶–۲۹).
//
// این مودال فقط یک کلاس toggle می‌کرد: نه focus داخلش می‌رفت، نه Esc می‌بستش،
// نه Tab داخلش می‌ماند، نه focus بعد از بستن برمی‌گشت. پنلِ رستوران دقیقاً
// همین ویجت را کامل پیاده کرده بود (staff-system.js) — این‌جا همان پیاده‌سازی
// تکرار می‌شود، نه یک طراحیِ تازه.
let _modalLastFocus = null;
function openModal(html){
  _modalLastFocus = document.activeElement;
  document.getElementById('modalBody').innerHTML = html;
  const bg = document.getElementById('modalBg');
  bg.classList.add('show');
  bg.setAttribute('aria-hidden','false');
  const body = document.getElementById('modalBody');
  const first = body.querySelector('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])');
  (first || body).focus?.();
  // صفحه‌ی پشتی نباید زیرِ مودال اسکرول بخورد (رویِ موبایل کاربر با یک
  // کشیدنِ انگشت، زمینه را جابه‌جا می‌کرد و بعد از بستن گم می‌شد).
  document.body.style.overflow = 'hidden';
}
function closeModal(){
  const bg = document.getElementById('modalBg');
  bg.classList.remove('show');
  bg.setAttribute('aria-hidden','true');
  document.body.style.overflow = '';
  if (_modalLastFocus && document.contains(_modalLastFocus)) _modalLastFocus.focus?.();
  _modalLastFocus = null;
}
// Esc می‌بندد + focus-trap با Tab داخلِ مودال می‌ماند.
document.addEventListener('keydown', e => {
  const bg = document.getElementById('modalBg');
  if (!bg || !bg.classList.contains('show')) return;
  if (e.key === 'Escape') { e.preventDefault(); closeModal(); return; }
  if (e.key !== 'Tab') return;
  const items = [...document.getElementById('modalBody')
    .querySelectorAll('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])')]
    .filter(el => !el.disabled && el.offsetParent !== null);
  if (!items.length) return;
  const first = items[0], last = items[items.length - 1];
  if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
  else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
});

// ═══════════ SPEC-B — مودالِ «رستوران جدید» (provisioning از پنلِ شرکت) ═══════════
// Idempotency-Key یک‌بار هنگامِ بازشدنِ مودال ساخته می‌شود: دابل‌کلیک روی
// «بساز» یا retryِ شبکه با همان کلید می‌رود و سرور همان پاسخ را برمی‌گرداند —
// دو رستوران ساخته نمی‌شود. چهار حالتِ الزامی: loading/error/success/(empty
// در خودِ لیست).
let _provIdemKey = null;
function _provSlugPreview(name){
  // پیش‌نمایشِ سمتِ کلاینت — منبعِ حقیقت سرور است (uniqueRestaurantSlug).
  const ascii = (name||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
  return ascii.length >= 3 ? ascii.slice(0,40) : '(خودکار از سرور)';
}
function openProvisionModal(){

  // fillِ تست) را می‌بلعید. اگر مودالِ همین فرم باز است، فقط focus.
  if (document.getElementById('pvName')) { document.getElementById('pvName').focus(); return; }
  _provIdemKey = 'prov-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,10);

      <label style="display:grid;gap:4px;font-size:13px"><span>روزهای آزمایشی (۰–۹۰)</span><input id="pvTrial" class="inp" type="number" min="0" max="90" value="14" dir="ltr"></label>

const PROV_REASON_FA = {

async function submitProvision(){

  const phone=(document.getElementById('pvPhone')?.value||'').trim();

  if(!/^09\d{9}$/.test(phone.replace(/[۰-۹]/g,(d)=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)))){ showErr('شماره‌ی موبایلِ معتبر واردکن (09xxxxxxxxx).'); return; }
  const body={
    business_name:name,
    owner_phone:phone.replace(/[۰-۹]/g,(d)=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)),
    plan:document.getElementById('pvPlan')?.value||'free',

  };

  const tables=parseInt(document.getElementById('pvTables')?.value||'8',10);
  if(Number.isFinite(tables)) body.seed_defaults={tables:Math.max(0,Math.min(100,tables))};

  // ── loading: قفلِ submit (چهار حالتِ الزامی) ──
  if(btn){ btn.disabled=true; btn.textContent='در حالِ ساخت…'; }
  const res=await API.adminCreateRestaurant(body,_provIdemKey);
  if(res.ok){
    const d=res.data||{};
    openModal(`

    return;
  }
  // ── error: پیامِ فارسی بر اساسِ details.reason — نه «خطای ناشناخته» ──
  if(btn){ btn.disabled=false; btn.textContent='بساز و دعوت بفرست'; }
  const reason=res.error?.details?.reason;
  showErr(PROV_REASON_FA[reason] || res.error?.message || (res.offline?'اتصال به سرور برقرار نشد.':'ساخت ناموفق بود؛ دوباره تلاش کن.'));
}

<script data-src="js/restaurant.js">
// ═══ رزرونو — پنل company: جزئیات رستوران + آنالیز پلتفرم (Vanilla JS، scope مشترک) ═══
function rDetail(){

    <div class="detail-hero">

        ${r.provision_status && r.provision_status!=='ACTIVE' ? `<span class="badge ${r.provision_status==='PENDING_ACTIVATION'?'trial':'expired'}" style="align-self:center" title="وضعیتِ provisioning">${({PENDING_ACTIVATION:'در انتظارِ فعال‌سازی',SUSPENDED:'معلق',OFFBOARDED:'خارج‌شده'})[r.provision_status]||esc(r.provision_status)}</span>`:''}
        ${r.provision_status==='PENDING_ACTIVATION' ? `<button class="btn btn-ghost btn-sm" onclick="resendProvisionInvite(${jsq(r.id)},this)" aria-label="ارسالِ مجددِ دعوتِ اولین‌ورود">${icon('mail',{size:14})} ارسالِ مجددِ دعوت</button>`:''}
        <button class="btn btn-ghost btn-sm" onclick="toggleRestOpen(${jsq(r.id)})">${r.isOpen?`${icon('lock',{size:14})} غیرفعال کردن`:`${icon('check',{size:14})} فعال کردن`}</button>

      </div>
    </div>
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-top"><div class="kpi-ic ink">${icon('users',{size:17})}</div></div><div class="kpi-val">${fa(r.members)}</div><div class="kpi-label">عضو باشگاه</div></div>
      <div class="kpi"><div class="kpi-top"><div class="kpi-ic violet">${icon('calendar',{size:17})}</div></div><div class="kpi-val">${fa(r.reservations)}</div><div class="kpi-label">کل رزروها</div></div>

      <div class="kpi"><div class="kpi-top"><div class="kpi-ic green">${icon('phone',{size:17})}</div></div><div class="kpi-val">${fa(r.smsBalance||0)}</div><div class="kpi-label">موجودی پیامک</div></div>

        <b style="color:var(--t1)">پنل خودِ همان رستوران</b> شوی — این داده‌ها برای حفظ حریم خصوصی مشتری‌ها در پنل شرکت به‌صورت جزء‌به‌جزء نمایش داده نمی‌شن.

// ═══════════ اعتبارنامه‌ی پنلِ رستوران (مهاجرتِ ۰۷۴) ═══════════
// ⚠️ چرا این بخش وجود دارد: تنها راهِ ورود به پنل‌ها OTPِ پیامکی بود و
// بدونِ کلیدِ کاوه‌نگار هیچ رستورانی نمی‌توانست وارد شود. حالا شرکت برایشان
// یوزر/پسورد می‌سازد و ورود به پیامک وابسته نیست.
//
// ⚠️ رمز **هرگز** از سرور خوانده نمی‌شود — سرور فقط می‌گوید «رمز دارد یا نه».
// یعنی این صفحه نمی‌تواند رمزِ فعلی را نشان دهد، فقط رمزِ تازه ست کند.
async function loadCredentials(restaurantId){
  const box = document.getElementById('credBody');
  if (!box) return;
  const res = await API.staffCredentials(restaurantId);
  if (!res.ok) {
    box.innerHTML = `<div class="empty-state-title">فهرست دسترسی‌ها بارگذاری نشد</div>
      <div style="margin-top:6px">${esc(res.error?.message || 'خطای ناشناخته')}</div>`;
    return;
  }
  const rows = (res.data?.staff || []).map(sf => `
    <tr>
      <td>${esc(sf.name || '—')}</td>
      <td>${sf.username ? `<code>${esc(sf.username)}</code>` : '<span style="color:var(--t3)">ندارد</span>'}</td>
      <td>${esc(sf.role)}</td>
      <td>${sf.has_password ? `${icon('check',{size:13})} دارد` : '<span style="color:var(--t3)">ندارد</span>'}</td>
      <td>${sf.is_active ? 'فعال' : 'غیرفعال'}</td>
    </tr>`).join('');
  box.innerHTML = `
    ${rows ? `<div style="overflow-x:auto"><table class="tbl"><thead><tr>
        <th>نام</th><th>نام کاربری</th><th>نقش</th><th>رمز</th><th>وضعیت</th>
      </tr></thead><tbody>${rows}</tbody></table></div>`
      : '<div style="margin-bottom:10px">هنوز هیچ کاربری برای این رستوران ثبت نشده.</div>'}
    <div style="margin-top:16px;display:grid;gap:10px">
      <div class="panel-title" style="font-size:14px">ساخت / تغییر دسترسی</div>
      <label class="login-field-label" for="credName">نام مسئول</label>
      <input class="login-inp" id="credName" placeholder="مثلاً: علی رضایی">
      <label class="login-field-label" for="credPhone">شماره موبایل</label>
      <input class="login-inp" id="credPhone" inputmode="tel" placeholder="۰۹۱۲۳۴۵۶۷۸۹">
      <label class="login-field-label" for="credUser">نام کاربری</label>
      <input class="login-inp" id="credUser" spellcheck="false" placeholder="فقط حروف انگلیسی، رقم، نقطه، خط تیره">
      <label class="login-field-label" for="credPass">رمز عبور</label>
      <input class="login-inp" id="credPass" type="password" autocomplete="new-password" placeholder="حداقل ۸ کاراکتر">
      <button class="btn btn-primary btn-block" id="credSaveBtn" onclick="saveCredentials(${jsq(String(restaurantId))})">ذخیره‌ی دسترسی</button>
      <div style="font-size:12px;color:var(--t3);line-height:1.9">
        اگر این شماره از قبل ثبت شده باشد، فقط نام کاربری و رمزش عوض می‌شود و کاربرِ تکراری ساخته نمی‌شود.
        رمز را جای امنی نگه دار — بعد از ذخیره دیگر قابلِ دیدن نیست.
      </div>
    </div>`;
}

async function saveCredentials(restaurantId){
  const name = (document.getElementById('credName')?.value||'').trim();
  const phoneRaw = (document.getElementById('credPhone')?.value||'').trim();
  const username = (document.getElementById('credUser')?.value||'').trim();
  const password = document.getElementById('credPass')?.value||'';
  // ارقامِ فارسی را به انگلیسی برگردان — همان کاری که فرمِ ورود می‌کند.
  const phone = phoneRaw.replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/\D/g,'');
  if (!/^09\d{9}$/.test(phone)) { toast('','شماره موبایل معتبر وارد کن'); return; }
  if (!username) { toast('','نام کاربری را وارد کن'); return; }
  if (password.length < 8) { toast('','رمز باید حداقل ۸ کاراکتر باشد'); return; }

  const btn = document.getElementById('credSaveBtn');
  if (btn){ btn.disabled = true; btn.textContent = 'در حال ذخیره…'; }
  const res = await API.setStaffCredentials({
    restaurant_id: restaurantId, phone, username, password,
    ...(name ? { name } : {}),
  });
  if (btn){ btn.disabled = false; btn.textContent = 'ذخیره‌ی دسترسی'; }
  if (!res.ok) { toast('', res.error?.message || 'ذخیره نشد'); return; }
  toast('', res.data?.created ? 'دسترسی ساخته شد' : 'دسترسی به‌روز شد');
  await loadCredentials(restaurantId);
}
async function toggleRestOpen(id){
  const r=RESTAURANTS.find(x=>String(x.id)===String(id));if(!r)return;
  const action = r.isOpen ? 'deactivate' : 'activate';
  const res = await API.control(id, { action });
  if(res.ok){
    r.isOpen = res.data.is_open;
    toast('', r.isOpen?'رستوران فعال شد':'رستوران غیرفعال شد');
    rDetail();
  } else {
    toast('', res.error?.message || 'عملیات ناموفق بود');
  }
}

      <div class="kpi"><div class="kpi-top"><div class="kpi-ic violet">${icon('calendar',{size:17})}</div></div><div class="kpi-val">${fa(totalRes)}</div><div class="kpi-label">کل رزروها</div></div>

      <div class="kpi"><div class="kpi-top"><div class="kpi-ic green">${icon('store',{size:17})}</div></div><div class="kpi-val">${fa(PLATFORM_STATS?.subscription_breakdown?.active ?? RESTAURANTS.filter(r=>r.status==='active').length)}</div><div class="kpi-label">رستوران فعال در پلتفرم</div></div>

      </div>

        <div class="panel-head"><div class="panel-title">برترین بر اساس رزرو</div></div>
        ${topByRes.map((r,i)=>`<div class="list-stat" style="cursor:pointer" onclick="openRest(${jsq(r.id)})"><div class="ls-rank">${fa(i+1)}</div><div class="rest-logo" style="background:${esc(r.grad)};width:34px;height:34px;font-size:15px">${esc(r.logo)}</div><div class="ls-info"><div class="ls-name">${esc(r.name)}</div><div class="ls-meta">${fa(r.members)} عضو</div></div><div class="ls-val">${fa(r.reservations)}</div></div>`).join('')}

// ════════ هوش تجاری مشتریان — تجمیعی و واقعی، از /admin/business-intelligence ════════

// ═══════════ SPEC-B — ارسالِ مجددِ دعوتِ اولین‌ورود (وضعیتِ PENDING) ═══════════
// چهار حالت: loading (قفلِ دکمه) / error (toast با پیامِ سرور) / success
// (toast با ماسکِ شماره). دکمه فقط برای رستورانِ PENDING_ACTIVATION رندر می‌شود.
async function resendProvisionInvite(id, btn){
  const label = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.textContent = 'در حالِ ارسال…'; }
  const res = await API.adminResendInvite(id);
  if(btn){ btn.disabled = false; btn.innerHTML = label; }
  if(res.ok){
    toast('', `دعوتِ تازه به ${res.data?.invite_sent_to || 'مالک'} ارسال شد`);
  } else {
    toast('', res.error?.message || (res.offline ? 'اتصال به سرور برقرار نشد' : 'ارسالِ دعوت ناموفق بود'));
  }
}

<script data-src="js/intelligence.js">
// ═══ رزرونو — پنل company: هوش تجاری + سلامت سیستم + امنیت + اشتراک + init (Vanilla JS، scope مشترک) ═══
// نکته‌ی مهم حریم خصوصی: نام/شماره‌ی تک‌تک مشتریان همه‌ی رستوران‌ها عمداً اینجا نشون داده نمی‌شه؛
// فقط داده‌ی تجمیعی (RFM/CLV/سگمنت) که برای تصمیم‌گیری کسب‌وکار لازمه.
const RFM_LABEL={champions:'قهرمانان',loyal:'وفادار',potential:'بالقوه',at_risk:'در خطر ریزش',new:'جدید',hibernating:'غیرفعال',lost:'از دست‌رفته'};
let BI_DATA=null;
function rCustomers(){
  document.getElementById('v-customers').innerHTML=`<div style="text-align:center;padding:60px;color:var(--t2)">در حال بارگذاری...</div>`;
  loadBusinessIntelligence();
}
async function loadBusinessIntelligence(){
  const res=await API.businessIntelligence();
  if(!res.ok){
    document.getElementById('v-customers').innerHTML=`<div class="panel" style="text-align:center;padding:40px;color:var(--t2)">${icon('alert',{size:16})} اتصال به سرور برقرار نشد — این صفحه بدون بک‌اند کار نمی‌کنه.</div>`;
    return;
  }
  BI_DATA=res.data;
  renderCustomers();
}
function renderCustomers(){
  const d=BI_DATA;if(!d)return;
  const fnl=n=>n==null?'—':n>=1000000?fa(+(n/1000000).toFixed(1))+'م':n>=1000?fa(Math.round(n/1000))+'ک':fa(n);
  document.getElementById('v-customers').innerHTML=`
    <div class="kpi-grid">
      <div class="kpi"><div class="kpi-top"><div class="kpi-ic ink">${icon('users',{size:17})}</div></div><div class="kpi-val">${fa(d.guests.total)}</div><div class="kpi-label">کل مهمانان شناسایی‌شده</div></div>
      <div class="kpi"><div class="kpi-top"><div class="kpi-ic amber">${icon('star',{size:17,fill:true})}</div></div><div class="kpi-val">${fa(d.guests.vips)}</div><div class="kpi-label">مهمانان VIP</div></div>
      <div class="kpi"><div class="kpi-top"><div class="kpi-ic green">${icon('wallet',{size:17})}</div></div><div class="kpi-val">${fnl(d.guests.total_clv_toman)}</div><div class="kpi-label">ارزش طول عمر کل (تومان)${d.guests.total_clv_toman==null?' — اندازه‌گیری‌ناپذیر':d.guests.measured_guests!=null&&d.guests.measured_guests<d.guests.total?` (از ${fa(d.guests.measured_guests)} مهمانِ دارای مبلغ)`:''}</div></div>
    </div>
    <div class="row-2">
      <div class="panel">
        <div class="panel-head"><div><div class="panel-title">توزیع سگمنت RFM</div><div class="panel-sub">کل پلتفرم</div></div></div>
        ${d.rfm_distribution.length?d.rfm_distribution.map(r=>{const mx=Math.max(...d.rfm_distribution.map(x=>x.count))||1;return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><span style="width:110px;font-size:12.5px;font-weight:600">${RFM_LABEL[r.segment]||r.segment}</span><div style="flex:1;height:8px;background:var(--s-100);border-radius:4px;overflow:hidden"><div style="height:100%;width:${r.count/mx*100}%;background:var(--ink);border-radius:4px"></div></div><span style="font-weight:700;font-size:12px;width:36px;text-align:left">${fa(r.count)}</span></div>`}).join(''):'<div style="text-align:center;color:var(--t2);padding:20px">هنوز محاسبه نشده — کرون شبانه‌ی customer-insights باید یک‌بار اجرا شده باشه</div>'}
      </div>
      <div class="panel">
        <div class="panel-head"><div><div class="panel-title">سگمنت رفتاری</div><div class="panel-sub">کل پلتفرم</div></div></div>
        ${d.behavior_segments.length?d.behavior_segments.map(r=>{const mx=Math.max(...d.behavior_segments.map(x=>x.count))||1;return `<div style="display:flex;align-items:center;gap:12px;margin-bottom:12px"><span style="width:110px;font-size:12.5px;font-weight:600">${esc(r.segment)}</span><div style="flex:1;height:8px;background:var(--s-100);border-radius:4px;overflow:hidden"><div style="height:100%;width:${r.count/mx*100}%;background:var(--violet);border-radius:4px"></div></div><span style="font-weight:700;font-size:12px;width:36px;text-align:left">${fa(r.count)}</span></div>`}).join(''):'<div style="text-align:center;color:var(--t2);padding:20px">داده‌ای نیست</div>'}
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><div class="panel-title">رستوران‌های برتر بر اساس ارزش مشتری (CLV)</div><div class="panel-sub">ارزش واقعی هر رستوران برای پلتفرم</div></div></div>

function rBilling(){
  const totalSms=RESTAURANTS.reduce((s,r)=>s+r.sms,0);
  const activeSubsc=RESTAURANTS.filter(r=>r.status==='active').length;
  // ⚠️ رفع‌شده (ممیزیِ ۲۰۲۶-۰۸-۲۴): MRR قبلاً همیشه از یک ثابتِ کلاینتیِ
  // ناقص و کهنه (PRICE={free,pro,enterprise} — بدونِ basic/trial و ناسازگار
  // با قیمت‌های واقعیِ CMS) جمع زده می‌شد — حتی وقتی داده‌ی رستوران‌ها واقعی
  // بود. یک رقمِ درآمدِ اشتباه بدترین نوعِ KPI است. حالا: چون بک‌اند قیمتِ
  // پلن را برنمی‌گرداند، در حالتِ آنلاین «—» نشان می‌دهیم (اندازه‌گیری‌نشده،
  // نه صفر — همان قاعده‌ی ML_CONTRACT)؛ عددِ نمونه فقط در دموی آفلاین با
  // داده‌ی [DEMO] می‌ماند.
  const PRICE={free:0,pro:890,enterprise:2400};
  const mrr=API.online?null:RESTAURANTS.filter(r=>r.status==='active'||r.status==='expiring').reduce((s,r)=>s+(PRICE[r.plan]||0),0);
  document.getElementById('v-billing').innerHTML=`
    <div class="bill-summary">
      <div class="bill-stat"><div class="bs-val" style="color:var(--ink)">${fa(activeSubsc)}</div><div class="bs-label">اشتراک فعال</div></div>
      <div class="bill-stat"><div class="bs-val" style="color:var(--green-600)">${mrr==null?'—':fa(mrr)+'<span style="font-size:14px"> هزارتومان</span>'}</div><div class="bs-label">${mrr==null?'درآمد ماهانه — اندازه‌گیری‌نشده (قیمتِ پلن در API نیست)':'درآمد ماهانه (نمونه‌ی دمو)'}</div></div>
      <div class="bill-stat"><div class="bs-val" style="color:var(--amber-600)">${fa(totalSms)}</div><div class="bs-label">کل پیامک ارسالی</div></div>
    </div>
    <div class="panel">
      <div class="panel-head"><div><div class="panel-title">اشتراک و مصرف پیامک رستوران‌ها</div><div class="panel-sub">مدیریت تمدید، لغو و سهمیه‌ی پیامک</div></div></div>
      <div class="mini-list">
        ${RESTAURANTS.map(r=>{
          const badgeCls=r.status==='trial_expired'?'expired':r.status;
          let st=STATUS_LABEL[r.status];
          if(r.status==='active')st=r.daysLeft!=null?`فعال · ${fa(r.daysLeft)} روز`:'فعال · نامحدود';
          else if(r.status==='expired'||r.status==='trial_expired')st=r.daysLeft!=null?`${fa(Math.abs(r.daysLeft))} روز منقضی`:'منقضی';
          else if(r.status==='expiring')st=`${fa(r.daysLeft)} روز مونده`;
          else st=`آزمایشی · ${fa(r.daysLeft)} روز`;
          return `<div class="mini-row" style="flex-wrap:wrap">
            <div class="rest-logo" style="background:${esc(r.grad)};width:38px;height:38px;font-size:16px">${esc(r.logo)}</div>
            <div class="mini-info" style="min-width:140px"><div class="mini-name">${esc(r.name)}</div><div class="mini-sub"><span class="plan-badge ${esc(r.plan)}">${PLAN_LABEL[r.plan]}</span> · موجودی: ${fa(r.smsBalance||0)} پیامک</div>
            </div>
            <span class="badge ${badgeCls}" style="align-self:flex-start"><span class="bdot"></span>${st}</span>
            <div style="display:flex;gap:6px">
              <button class="btn btn-primary btn-sm" onclick="openSmsTopup(${jsq(r.id)})">${icon('phone',{size:13})} شارژ پیامک</button>
              <button class="btn btn-ghost btn-sm" onclick="openRenew(${jsq(r.id)})">مدیریت</button>
            </div>
          </div>`;
        }).join('')}
      </div>
    </div>`;
}
// ════════ شارژ موجودی پیامک (وصل به API واقعی) ════════
let _topupRestId=null;
function openSmsTopup(id){
  const r=RESTAURANTS.find(x=>String(x.id)===String(id));if(!r)return;
  _topupRestId=id;
  openModal(`
    <div class="modal-title">${icon('phone',{size:18})} شارژ موجودی پیامک</div>
    <div class="modal-sub">${esc(r.name)} · موجودی فعلی: ${fa(r.smsBalance||0)} پیامک</div>
    <div class="field-label">تعداد پیامک برای افزودن</div>
    <div class="opt-row" id="smsAmountOpts">
      ${[[1000,'۱۰۰۰'],[5000,'۵۰۰۰'],[10000,'۱۰٬۰۰۰'],[50000,'۵۰٬۰۰۰']].map(([v,l],i)=>`<div role="button" tabindex="0" class="opt ${i===0?'sel':''}" data-amt="${v}" onclick="pickSmsAmount(${v},this)">${l}</div>`).join('')}
    </div>
    <div class="field-label">یا مقدار دلخواه</div>
    <input class="inp" id="smsCustomAmount" type="number" min="1" placeholder="مثلاً ۲۵۰۰" oninput="document.querySelectorAll('#smsAmountOpts .opt').forEach(o=>o.classList.remove('sel'))">
    <div style="font-size:12px;color:var(--t2);margin:14px 0;line-height:1.6;background:var(--ink-50);padding:12px 14px;border-radius:var(--r)">${icon('info',{size:13})} رستوران پس از پرداخت به شما، موجودی‌اش را اینجا شارژ کنید. هر شارژ ثبت و قابل‌پیگیری است.</div>
    <button class="btn btn-primary btn-block btn-lg" onclick="submitSmsTopup(this)">تأیید و شارژ</button>
  `);
}
let _topupAmount=1000;
function pickSmsAmount(v,el){_topupAmount=v;document.querySelectorAll('#smsAmountOpts .opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');document.getElementById('smsCustomAmount').value='';}
// ⚠️ همان گاردِ ضدِ دوبارکلیک: شارژِ پیامک هم یک نوشتنِ افزایشیِ برگشت‌ناپذیر است.
async function submitSmsTopup(btn){
  const custom=parseInt(document.getElementById('smsCustomAmount')?.value||'');
  const amount=Number.isInteger(custom)&&custom>0?custom:_topupAmount;
  if(!amount||amount<=0){toast('','تعداد نامعتبر');return;}
  if(btn){ if(btn.disabled) return; btn.disabled=true; btn.textContent='در حال شارژ…'; }
  const res=await API.post(`/admin/restaurants/${_topupRestId}/sms`,{amount});
  if(res.ok){
    closeModal();
    toast('',`${fa(amount)} پیامک شارژ شد · موجودی جدید: ${fa(res.data.balance)}`);
    const r=RESTAURANTS.find(x=>String(x.id)===String(_topupRestId));
    if(r)r.smsBalance=res.data.balance;
    if(typeof rBilling==='function'&&document.getElementById('v-billing'))rBilling();
  } else {
    if(btn){ btn.disabled=false; btn.textContent='تأیید و شارژ'; }
    toast('',res.error?.message||'شارژ ناموفق بود');
  }
}

// ════════ مدیریت اشتراک (تمدید واقعی / لغو واقعی) — وصل به PATCH /admin/restaurants/:id/control ════════
function openRenew(id){
  const r=RESTAURANTS.find(x=>String(x.id)===String(id));if(!r)return;
  // ⚠️ فازِ ۲: فهرستِ چیپ‌ها فقط pro/enterprise است، ولی renewPlan از پلنِ
  // فعلی پر می‌شد. برایِ تنانتِ `starter` (پلنی که خودِ همین پنل از صفِ فروش
  // اختصاص می‌دهد) هیچ چیپی انتخاب‌شده نبود و خلاصه «پلن جدید: شروع» می‌گفت،
  // در حالی که ارسالش را بک‌اند رد می‌کرد. فقط پلن‌هایِ تمدیدشدنی مجازند.
  renewPlan=(r.plan==='pro'||r.plan==='enterprise')?r.plan:'pro';renewMonths=12;
  openModal(`
    <div class="modal-title">مدیریت اشتراک</div>
    <div class="modal-sub">${esc(r.name)} · وضعیت فعلی: ${STATUS_LABEL[r.status]}</div>
    <div class="field-label">پلن</div>
    <div class="opt-row" id="planOpts">
      ${[['pro','حرفه‌ای'],['enterprise','سازمانی']].map(([v,l])=>`<div role="button" tabindex="0" class="opt ${v===renewPlan?'sel':''}" data-plan="${v}" onclick="pickPlan(${jsq(v)},this)">${l}</div>`).join('')}
    </div>
    <div class="field-label">مدت تمدید</div>
    <div class="opt-row" id="monthOpts">
      ${[[1,'۱ ماه'],[3,'۳ ماه'],[6,'۶ ماه'],[12,'۱ سال']].map(([v,l])=>`<div role="button" tabindex="0" class="opt ${v===12?'sel':''}" data-m="${v}" onclick="pickMonths(${v},this)">${l}</div>`).join('')}
    </div>
    <div class="summary-box">
      <div class="sum-row"><span class="k">رستوران</span><span class="v">${esc(r.name)}</span></div>
      <div class="sum-row"><span class="k">پلن جدید</span><span class="v" id="sumPlan">${PLAN_LABEL[renewPlan]}</span></div>
      <div class="sum-row"><span class="k">مدت</span><span class="v" id="sumMonths">۱ سال</span></div>
    </div>
    <button class="btn btn-primary btn-block btn-lg" onclick="doRenew(${jsq(id)},this)">${icon('check',{size:15})} تمدید اشتراک</button>
    <button class="btn btn-danger btn-block" style="margin-top:8px" onclick="confirmCancel(${jsq(id)})">لغو اشتراک</button>
  `);
}
let renewPlan='pro',renewMonths=12;
function pickPlan(v,el){renewPlan=v;document.querySelectorAll('#planOpts .opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');document.getElementById('sumPlan').textContent=PLAN_LABEL[v]}
function pickMonths(v,el){renewMonths=v;document.querySelectorAll('#monthOpts .opt').forEach(o=>o.classList.remove('sel'));el.classList.add('sel');document.getElementById('sumMonths').textContent={1:'۱ ماه',3:'۳ ماه',6:'۶ ماه',12:'۱ سال'}[v]}
// ⚠️ رفعِ «دوبار نوشتنِ افزایشی» (فازِ ۲، §۳): دکمه حینِ درخواست زنده می‌ماند،
// پس دو کلیک اشتراکِ یک مشتریِ پولی را دو برابر تمدید می‌کرد (دو ردیفِ مجزّایِ
// `plan.changed`) — و از این پنل برگشت‌پذیر نیست. همان گاردی که abuseFlagAct
// از قبل دارد، این‌جا هم اعمال شد.
async function doRenew(id,btn){
  const r=RESTAURANTS.find(x=>String(x.id)===String(id));if(!r)return;
  if(btn){ if(btn.disabled) return; btn.disabled=true; btn.textContent='در حال تمدید…'; }
  const res=await API.control(id,{action:'extend_plan',plan:renewPlan,months:renewMonths});
  if(!res.ok){
    if(btn){ btn.disabled=false; btn.textContent='تمدید اشتراک'; }
    toast('',res.error?.message||'تمدید ناموفق بود');return;
  }
  r.plan=renewPlan;r.status='active';r.planExpiresAt=res.data.plan_expires_at;
  const days=Math.ceil((new Date(res.data.plan_expires_at).getTime()-Date.now())/86400000);
  r.daysLeft=days;
  closeModal();refreshActive();
  toast('',`اشتراک ${r.name} تمدید شد (${renewMonths===12?'۱ سال':fa(renewMonths)+' ماه'})`);
}
function confirmCancel(id){
  const r=RESTAURANTS.find(x=>String(x.id)===String(id));if(!r)return;
  openModal(`
    <div style="text-align:center">
      <div style="width:54px;height:54px;border-radius:14px;background:var(--red-50);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:var(--warning)">${icon('alert',{size:26})}</div>
      <div class="modal-title" style="text-align:center">لغو اشتراک ${esc(r.name)}؟</div>
      <div class="modal-sub" style="text-align:center">اشتراک فوراً منقضی می‌شه. این کار قابل بازگشته (با تمدید مجدد).</div>
      <button class="btn btn-danger btn-block btn-lg" onclick="doCancel(${jsq(id)})">بله، لغو کن</button>
      <button class="btn btn-ghost btn-block" style="margin-top:8px" onclick="closeModal()">انصراف</button>
    </div>`);
}
async function doCancel(id){
  const r=RESTAURANTS.find(x=>String(x.id)===String(id));if(!r)return;
  const res=await API.control(id,{action:'cancel_subscription'});
  if(!res.ok){toast('',res.error?.message||'لغو ناموفق بود');return;}
  r.status='expired';r.daysLeft=0;
  closeModal();refreshActive();
  toast('',`اشتراک ${r.name} لغو شد`);
}
function refreshActive(){
  const active=document.querySelector('.view.active');if(!active)return;
  const id=active.id.replace('v-','');
  ({overview:rOverview,restaurants:rRestaurants,detail:rDetail,analytics:rAnalytics,customers:rCustomers,billing:rBilling,systemhealth:rSystemHealth,aihealth:rModelHealth,security:rSecurity,support:rSupport,badges:rBadges,missions:rMissions})[id]?.();
}

// append-only آموزش‌ها (model_training_runs، migration 042) — شاملِ
// آموزش‌هایی که نتیجه‌شون فعال‌سازی نبوده، نه فقط آخرین وضعیت.
const RUN_KIND_FA = { no_show: 'ریسکِ عدم‌حضور', demand_forecast: 'پیش‌بینیِ تقاضا' };
const PRED_TYPE_FA = { no_show: 'ریسکِ عدم‌حضور', demand: 'پیش‌بینیِ تقاضا' };
const MODEL_SOURCE_FA = { learned: 'مدلِ یادگرفته', heuristic: 'قانونِ دستی (heuristic)' };

// ═══════ دقتِ واقعیِ تولید (فازِ ۵) ═══════
// تفاوتِ این پنل با پنلِ بالا حیاتی است و عمداً در متنِ UI هم گفته می‌شه:
// «Brierِ یادگرفته» در جدولِ وضعیت، کاراییِ لحظه‌ی آموزش روی دادهٔ نگه‌داشته‌شده‌ی
// گذشته است. این پنل چیزی رو نشون می‌ده که واقعاً در تولید رخ داد — پیش‌بینی
// شد، بعد نتیجه‌ش مشاهده شد. تا قبل از فازِ ۵ این عدد اصلاً قابلِ محاسبه نبود.
function productionAccuracyPanelHTML(pa){
  if(!pa) return '';
  const g = pa.groups || [];
  const num=(v,d)=>v==null?null:fa(Math.round(v*Math.pow(10,d))/Math.pow(10,d));
  const totalOverdue = g.reduce((s,x)=>s+(x.overdue_count||0),0);
  return `<div class="panel" style="margin-top:20px">
    <div class="panel-head"><div>
      <div class="panel-title">دقتِ واقعی در تولید — از دفترِ پیش‌بینی و نتیجه</div>
      <div class="panel-sub">${fa(pa.window_days)} روزِ گذشته · «پیش‌بینی کردیم، بعد واقعاً چه شد» — نه کاراییِ لحظه‌ی آموزش</div>
    </div></div>
    ${totalOverdue>0?`<div class="mini-row" style="background:var(--amber-50,#FFFBEB)">
      <div class="mini-info">
        <div class="mini-name" style="color:var(--amber-700,#B45309)">${icon('alert',{size:14})} ${fa(totalOverdue)} پیش‌بینی نتیجه‌ش ثبت نشده</div>
        <div class="mini-sub">افقِ زمانی‌شون گذشته ولی رزرو به وضعیتِ نهایی نرسیده. تا وقتی این عدد بالا بمونه، دقتِ زیر روی زیرمجموعه‌ای از رزروها حساب می‌شه، نه همه‌شون.</div>
      </div>
    </div>`:''}
    ${g.length?g.map(x=>{
      const enough = x.resolved_count >= pa.min_resolved;
      return `<div class="mini-row">
        <div class="mini-info">
          <div class="mini-name">${PRED_TYPE_FA[x.prediction_type]||esc(x.prediction_type)} · ${MODEL_SOURCE_FA[x.model_source]||esc(x.model_source)}</div>
          <div class="mini-sub">${fa(x.resolved_count)} نتیجه‌ی مشاهده‌شده · ${fa(x.pending_count)} در انتظارِ وقوع${x.overdue_count?` · ${fa(x.overdue_count)} بدونِ نتیجه`:''}</div>
        </div>
        ${enough
          ? `<span class="badge active" title="میانگینِ خطایِ مربع (Brier) روی نتایجِ واقعیِ تولید">Brier ${num(x.brier,3)}</span>`
          : `<span class="badge expired" title="کف: ${pa.min_resolved} نتیجه">دادهٔ کافی نیست</span>`}
      </div>`;
    }).join(''):`<div class="empty-state"><div class="empty-state-desc">هنوز پیش‌بینی‌ای با نتیجه‌ی مشاهده‌شده ثبت نشده — دفتر از لحظه‌ی استقرارِ فازِ ۵ پر می‌شه</div></div>`}
  </div>`;
}
// ═══════ رانشِ مدل (فازِ ۷) ═══════
// این پنل تنها جایی است که می‌گوید «بازآموزی لازم است» — و عمداً فقط وقتی
// می‌گوید که شواهد کافی باشد. حکمِ insufficient_data صریحاً نمایش داده
// می‌شود، نه اینکه به‌عنوانِ «پایدار» جا بزند؛ چون «نمی‌دانیم» و «خوب است»
// دو چیزِ کاملاً متفاوت‌اند.
const DRIFT_FA = {
  drifted:            { label:'رانش کرده — بازآموزی لازم است', cls:'expired' },
  watch:              { label:'زیرِ نظر',                      cls:'expired' },
  stable:             { label:'پایدار',                        cls:'active'  },
  insufficient_data:  { label:'دادهٔ کافی نیست',                cls:'expired' },
};
function driftPanelHTML(dr){
  if(!dr) return '';
  const rows = dr.restaurants || [];
  const pct=(v)=>v==null?'—':fa((v*100).toFixed(1))+'٪';
  const br=(v)=>v==null?'—':fa(Math.round(v*1000)/1000);
  const drifted = rows.filter(r=>r.verdict==='drifted').length;
  return `<div class="panel" style="margin-top:20px">
    <div class="panel-head"><div>
      <div class="panel-title">رانشِ مدل — آیا مدل هنوز همان‌قدر خوب است؟</div>
      <div class="panel-sub">مقایسه‌ی Brierِ ${fa(dr.window_days)} روزِ اخیرِ تولید با Brierِ همان نسخه روی هولدآوتِ زمانِ آموزش · آستانه: ${fa((dr.threshold*100).toFixed(0))}٪ بدترشدن</div>
    </div></div>
    ${drifted>0?`<div class="mini-row" style="background:var(--red-50,#FEF2F2)">
      <div class="mini-info"><div class="mini-name" style="color:var(--red-600,#DC2626)">${icon('alert',{size:14})} ${fa(drifted)} مدل رانش کرده</div>
      <div class="mini-sub">این مدل‌ها هنوز فعال‌اند ولی در تولید محسوس بدتر از زمانِ آموزش عمل می‌کنند.</div></div>
    </div>`:''}
    ${rows.length?rows.map(r=>{
      const v = DRIFT_FA[r.verdict] || { label:esc(r.verdict), cls:'expired' };
      return `<div class="mini-row">
        <div class="mini-info">
          <div class="mini-name">${esc(r.restaurant_name)}</div>
          <div class="mini-sub">${r.verdict==='insufficient_data'
            ? `${fa(r.resolved_count)} نتیجه در پنجره — برای حکم‌دادن کافی نیست`
            : `تولید ${br(r.production_brier)} در برابرِ هولدآوت ${br(r.holdout_brier)} · تغییر: ${pct(r.relative_change)} · ${fa(r.resolved_count)} نتیجه`}</div>
        </div>
        <span class="badge ${v.cls}">${v.label}</span>
      </div>`;
    }).join(''):`<div class="empty-state"><div class="empty-state-desc">هیچ رستورانی مدلِ فعالِ دارایِ نسب‌نامه ندارد — پس از اولین بازآموزیِ شبانه قابلِ سنجش می‌شود</div></div>`}
  </div>`;
}

    const brierPct=(v)=>v==null?'—':fa(Math.round(v*1000)/1000);
    const maePct=(v)=>v==null?'—':fa(Math.round(v*100)/100);
    document.getElementById('v-aihealth').innerHTML=`

        <div style="font-size:13px;color:var(--ink-700);line-height:1.8">
          ${icon('info',{size:13})} هر مدل فقط وقتی «فعال» می‌شه که شبانه روی تاریخچه‌ی خودِ همون رستوران آموزش دیده باشه و روی دادهٔ نگه‌داشته‌شده (هولدآوت) واقعاً از قانونِ دستیِ فعلی (heuristic) بهتر عمل کنه — وگرنه بی‌صدا از heuristic استفاده می‌شه. جزئیاتِ کامل در docs/ML_CONTRACT.md.
