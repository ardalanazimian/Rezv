name: CI

# اجرای خودکار روی هر push و pull request به main/develop
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── مرحله ۱: type-check + build ──
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
          # نکته: پس از اولین npm install و commit کردن package-lock.json، می‌توان به npm ci سوییچ کرد

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (Next.js)
        run: npm run build
        env:
          # متغیرهای ساختگی برای build (مقادیر واقعی در deploy می‌آیند)
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          JWT_SECRET: ci-build-only-secret-not-used-in-prod
          JWT_REFRESH_SECRET: ci-build-only-refresh-secret
          REDIS_URL: redis://localhost:6379
          # لازم چون middleware در production نبودِ آن را خطا می‌دهد؛
          # مقدارِ ساختگی فقط برای عبورِ build است، نه استفاده‌ی واقعی.
          ALLOWED_ORIGINS: https://ci.example.invalid

  # ── مرحله ۲: تست‌ها (با Postgres + Redis واقعی در CI) ──
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rezervno_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
          # نکته: پس از اولین npm install و commit کردن package-lock.json، می‌توان به npm ci سوییچ کرد

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run migrations
        run: |
          # db push اسکیمای تست را مستقیم از schema.prisma می‌سازد.
          npx prisma db push --skip-generate
          # اجرای SQLهای دستی (prisma/sql) با همان مسیرِ کدِ Docker.
          sh prisma/apply-sql.sh
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rezervno_test
          DATABASE_DIRECT_URL: postgresql://test:test@localhost:5432/rezervno_test

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rezervno_test
          REDIS_URL: redis://localhost:6379
          # لازم چون middleware در production نبودِ آن را خطا می‌دهد؛
          # مقدارِ ساختگی فقط برای عبورِ build است، نه استفاده‌ی واقعی.
          ALLOWED_ORIGINS: https://ci.example.invalid
          # حداقل ۳۲ کاراکتر — همان قیدی که jwt.ts در زمانِ اجرا اعمال می‌کند.
          JWT_SECRET: ci-test-secret-at-least-32-chars-long
          JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars

  # ── مرحله ۳: چک امنیتی پایه ──
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
          # نکته: پس از اولین npm install و commit کردن package-lock.json، می‌توان به npm ci سوییچ کرد
      - name: Install dependencies
        run: npm ci || npm install
      - name: Audit dependencies
        # ⚠️ فیکسِ حسابرسیِ ۲۰۲۶-۰۷-۱۹ (FINAL-PRODUCTION-AUDIT.md بخشِ ۶): قبلاً اینجا
        # `|| true` بود یعنی حتی یک CVE بحرانی هم build را نمی‌شکست، فقط لاگ می‌شد.
        # حالا سطحِ critical واقعاً بلاک می‌کند؛ high فقط هشدار می‌دهد (نویزِ کمتر، ولی
        # بحرانی دیگر نادیده گرفته نمی‌شود).
        run: |
          npm audit --audit-level=critical
          npm audit --audit-level=high || echo "::warning::یافته‌ی high در dependencyها — بررسی کن (build را نمی‌شکند)"

  # ── مرحله ۴: E2E (Playwright، اپ کاستومر — API کاملاً mock می‌شود، بدونِ نیاز به DB/بک‌اند) ──
  e2e:
    runs-on: ubuntu-latest
    # سقفِ زمانی چون این job بارها روی مرحله‌ی نصبِ مرورگر معلق مانده
    # (۲۰۲۶-۰۸-۱۹: سه بار، یک‌بار ۴۵+ دقیقه) — دانلود از CDNِ Playwright و
    # apt گاهی گیر می‌کند. بدونِ سقف، jobِ معلق تا پیش‌فرضِ ۶ ساعتِ گیت‌هاب
    # ادامه می‌دهد و کلِ PR را بلاک می‌کند. با سقف، سریع قرمز می‌شود و
    # می‌شود دوباره اجرا کرد. عدد سخاوتمندانه است: اجرای عادی ~۴ دقیقه.
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # e2e/package-lock.json از ۲۰۲۶-۰۸-۱۲ کامیت شده (کامنتِ قبلی که
          # می‌گفت کامیت نشده کهنه بود) — پس کشِ npm واقعاً کار می‌کند.
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      # کشِ باینریِ مرورگرها: ریشه‌ی گیرکردنِ این job همین دانلودِ ~۱۵۰ مگابایتی
      # از CDNِ Playwright بود. با cache hit اصلاً دانلودی در کار نیست.
      # کلید بر پایه‌ی lockfile است تا با ارتقاء نسخه‌ی Playwright خودکار باطل شود.
      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('e2e/package-lock.json') }}

      - name: Install Playwright browsers
        # سقفِ مرحله‌ای به‌عنوانِ تورِ ایمنی. داخلش هم سه تلاش با سقفِ ۴ دقیقه:
        # گیرکردنِ CDN گذراست، پس تلاشِ دوباره درستش می‌کند — به‌جای اینکه کلِ
        # PR بابتِ یک هنگِ شبکه‌ای قرمز شود. با cache hit فقط وابستگی‌های
        # سیستمی نصب می‌شوند (بدونِ دانلودِ مرورگر).
        timeout-minutes: 15
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            cmd="npx playwright install-deps chromium webkit"
          else
            cmd="npx playwright install --with-deps chromium webkit"
          fi
          for attempt in 1 2 3; do
            echo "::group::نصبِ مرورگر — تلاشِ $attempt"
            if timeout 240 $cmd; then
              echo "::endgroup::"; exit 0
            fi
            echo "::endgroup::"
            echo "::warning::تلاشِ $attempt برای نصبِ مرورگر شکست خورد/گیر کرد؛ دوباره تلاش می‌کنم"
            sleep 10
          done
          echo "::error::نصبِ مرورگرِ Playwright بعد از ۳ تلاش موفق نشد"
          exit 1

      - name: Run E2E tests
        run: npm test
        env:
          CI: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  # ── مرحله ۵: هماهنگیِ دیزاین‌سیستم (بدونِ drift بین shared/ و اپ‌ها) ──
  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check design-system in sync with shared/
        run: sh tools/sync-design-system.sh --check

  # ── اپِ SEO (apps/seo · Next.js SSR/ISR، ADR 0001) — build + typecheck + lint ──
  # پروژه‌ی مستقل؛ خرابیِ اینجا به اپ‌های static آسیب نمی‌زند. build خودِ Next تایپ‌چک/لینت می‌کند.
  seo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/seo
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/seo/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Schema unit tests (JSON-LD sanity — پایشِ خودکار)
        run: npm test
      - name: Build (Next.js — typecheck + lint + build)
        run: npm run build

  # ── وب‌سایتِ عمومی (apps/landing · Next.js SSR/ISR، ADR 0002) ──
  # اپِ جدا از apps/seo با دامنه، sitemap و canonicalِ مستقلِ خودش.
  # build عمداً بدونِ SITE_API_BASE اجرا می‌شود: باید در «حالتِ امن» (بدونِ API)
  # هم سبز باشد، وگرنه یک قطعیِ API می‌تواند دیپلوی را هم زمین بزند.
  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/landing/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Unit tests (JSON-LD، Markdownِ امن، محتوای پیش‌فرض)
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build (Next.js)
        run: npm run build
