name: CI

# اجرای خودکار روی هر push و pull request به main/develop
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ── مرحله ۱: type-check + build ──
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
          # package-lock.json از ۲۰۲۶-۰۷-۲۹ کامیت شده — کامنتِ قبلی که می‌گفت
          # «هنوز کامیت نشده» کهنه بود. `npm ci` واقعاً قفل را رعایت می‌کند.

      - name: Install dependencies
        run: npm ci || npm install

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (Next.js)
        run: npm run build
        env:
          # متغیرهای ساختگی برای build (مقادیر واقعی در deploy می‌آیند)
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          JWT_SECRET: ci-build-only-secret-not-used-in-prod
          JWT_REFRESH_SECRET: ci-build-only-refresh-secret
          REDIS_URL: redis://localhost:6379
          # لازم چون middleware در production نبودِ آن را خطا می‌دهد؛
          # مقدارِ ساختگی فقط برای عبورِ build است، نه استفاده‌ی واقعی.
          ALLOWED_ORIGINS: https://ci.example.invalid

  # ── مرحله ۲: تست‌ها (با Postgres + Redis واقعی در CI) ──
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rezervno_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
          # package-lock.json از ۲۰۲۶-۰۷-۲۹ کامیت شده — کامنتِ قبلی که می‌گفت
          # «هنوز کامیت نشده» کهنه بود. `npm ci` واقعاً قفل را رعایت می‌کند.

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run migrations
        run: |
          # db push اسکیمای تست را مستقیم از schema.prisma می‌سازد.
          npx prisma db push --skip-generate
          # اجرای SQLهای دستی (prisma/sql) با همان مسیرِ کدِ Docker.
          sh prisma/apply-sql.sh
          # بستنِ شکافِ اسکیمای تست با تولید (defaultِ uuid برای PKها) —
          # دلیلِ کامل و شواهدش در خودِ فایل.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/test-schema-fixups.sql
          # ⚠️ ساکت‌کردنِ لاگِ statementِ Postgres — یافته‌ی واقعیِ ۲۰۲۶-۰۸-۲۰:
          # وقتی تست قرمز شد، GitHub در پایانِ job لاگِ کانتینرِ Postgres را چاپ
          # می‌کند و هر ERROR همراهِ کلِ متنِ STATEMENT است (یک INSERTِ رزرو
          # حدودِ ۲۵۰۰ کاراکتر). این‌ها ~۵۰ خطِ غول‌پیکرِ آخرِ لاگ را می‌گیرند و
          # خلاصه‌ی «✖ failing tests» را از دیدِ tail بیرون می‌اندازند — دقیقاً
          # همان چیزی که تشخیص را چند دور عقب انداخت. خطاها همچنان رخ می‌دهند و
          # تست‌ها همچنان می‌بینندشان؛ فقط دیگر در لاگِ سرور تکرار نمی‌شوند.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET log_min_error_statement = 'panic';" \
            -c "SELECT pg_reload_conf();"
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rezervno_test
          DATABASE_DIRECT_URL: postgresql://test:test@localhost:5432/rezervno_test

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rezervno_test
          REDIS_URL: redis://localhost:6379
          # لازم چون middleware در production نبودِ آن را خطا می‌دهد؛
          # مقدارِ ساختگی فقط برای عبورِ build است، نه استفاده‌ی واقعی.
          ALLOWED_ORIGINS: https://ci.example.invalid
          # حداقل ۳۲ کاراکتر — همان قیدی که jwt.ts در زمانِ اجرا اعمال می‌کند.
          JWT_SECRET: ci-test-secret-at-least-32-chars-long
          JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars

  # ── انحرافِ اسکیما: آیا تولید هرچه Prisma لازم دارد را واقعاً دارد؟ ──
  #
  # ⚠️ چرا این job لازم است (شکافی که هیچ تستِ دیگری نمی‌بیند):
  # CI اسکیما را با `prisma db push` می‌سازد ولی تولید با
  # `migrate deploy (0_init) + apply-sql.sh`. اگر کسی فیلدی به schema.prisma
  # اضافه کند و مهاجرتِ SQL ننویسد، `db push` آن را در CI می‌سازد و همه‌ی
  # تست‌ها سبز می‌شوند — ولی تولید آن ستون را ندارد و در زمانِ اجرا می‌شکند.
  # «CI سبز، تولید خراب» دقیقاً همان چیزی است که این job جلویش را می‌گیرد.
  schema-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        working-directory: api
        run: npm ci || npm install
      - name: Generate Prisma client
        working-directory: api
        run: npx prisma generate
      - name: Check schema drift
        run: sh tools/check-schema-drift.sh
        env:
          ADMIN_URL: postgresql://test:test@localhost:5432/postgres

  # ── مرحله ۳: چک امنیتی پایه ──
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
          # package-lock.json از ۲۰۲۶-۰۷-۲۹ کامیت شده — کامنتِ قبلی که می‌گفت
          # «هنوز کامیت نشده» کهنه بود. `npm ci` واقعاً قفل را رعایت می‌کند.
      - name: Install dependencies
        run: npm ci || npm install
      - name: Audit dependencies
        # ⚠️ فیکسِ حسابرسیِ ۲۰۲۶-۰۷-۱۹ (FINAL-PRODUCTION-AUDIT.md بخشِ ۶): قبلاً اینجا
        # `|| true` بود یعنی حتی یک CVE بحرانی هم build را نمی‌شکست، فقط لاگ می‌شد.
        # حالا سطحِ critical واقعاً بلاک می‌کند؛ high فقط هشدار می‌دهد (نویزِ کمتر، ولی
        # بحرانی دیگر نادیده گرفته نمی‌شود).
        run: |
          npm audit --audit-level=critical
          npm audit --audit-level=high || echo "::warning::یافته‌ی high در dependencyها — بررسی کن (build را نمی‌شکند)"

  # ── مرحله ۴: E2E (Playwright، اپ کاستومر — API کاملاً mock می‌شود، بدونِ نیاز به DB/بک‌اند) ──
  e2e:
    runs-on: ubuntu-latest
    # ایمیجِ رسمیِ Playwright: مرورگرها و کتابخانه‌های سیستمی‌شان از قبل داخلش
    # هستند. چرا این‌طور شد (۲۰۲۶-۰۸-۱۹، بعد از چند اجرای شکست‌خورده):
    #   • دانلودِ ~۱۵۰MB مرورگر از CDNِ Playwright بارها هنگ کرد (یک‌بار ۴۵+ دقیقه)
    #   • بعد از رفعِ آن با کش، گلوگاه به `playwright install-deps` منتقل شد که
    #     زیرِ پوسته apt-get است و آن هم پشتِ‌هم هنگ کرد (آخری تایم‌اوتِ ۱۲ دقیقه‌ای)
    #   • و اندازه‌گیری شد که بدونِ آن کتابخانه‌ها WebKit اصلاً بالا نمی‌آید:
    #     ۸۶ تستِ Chromium سبز، ۴۳ تستِ WebKit قرمز — حتی «lang=fa است؟»
    # با این ایمیج هیچ‌کدام از آن دو مرحله لازم نیست، پس هر دو منبعِ ناپایداری
    # (CDN و apt) از مسیرِ CI حذف می‌شوند. نسخه باید با @playwright/test در
    # e2e/package.json یکی بماند — با ارتقاء، این تگ هم باید به‌روز شود.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # e2e/package-lock.json از ۲۰۲۶-۰۸-۱۲ کامیت شده (کامنتِ قبلی که
          # می‌گفت کامیت نشده کهنه بود) — پس کشِ npm واقعاً کار می‌کند.
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run E2E tests
        run: npm test
        env:
          CI: true
          # مرورگرها در مسیرِ خودِ ایمیج‌اند، نه ~/.cache/ms-playwright.
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  # ── مرحله ۵: هماهنگیِ دیزاین‌سیستم (بدونِ drift بین shared/ و اپ‌ها) ──
  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check design-system in sync with shared/
        run: sh tools/sync-design-system.sh --check

  # ── اپِ SEO (apps/seo · Next.js SSR/ISR، ADR 0001) — build + typecheck + lint ──
  # پروژه‌ی مستقل؛ خرابیِ اینجا به اپ‌های static آسیب نمی‌زند. build خودِ Next تایپ‌چک/لینت می‌کند.
  seo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/seo
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/seo/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Schema unit tests (JSON-LD sanity — پایشِ خودکار)
        run: npm test
      - name: Build (Next.js — typecheck + lint + build)
        run: npm run build

  # ── وب‌سایتِ عمومی (apps/landing · Next.js SSR/ISR، ADR 0002) ──
  # اپِ جدا از apps/seo با دامنه، sitemap و canonicalِ مستقلِ خودش.
  # build عمداً بدونِ SITE_API_BASE اجرا می‌شود: باید در «حالتِ امن» (بدونِ API)
  # هم سبز باشد، وگرنه یک قطعیِ API می‌تواند دیپلوی را هم زمین بزند.
  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/landing/package-lock.json
      - name: Install dependencies
        run: npm ci || npm install
      - name: Unit tests (JSON-LD، Markdownِ امن، محتوای پیش‌فرض)
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build (Next.js)
        run: npm run build
