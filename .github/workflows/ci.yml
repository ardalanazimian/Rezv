name: CI

# اجرای خودکار روی هر push و pull request به main/develop
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# P0-005 / A6-002 (۲۰۲۶-۰۹-۰۳، تصویبِ مالک): یک hang در npm test تا سقفِ ۳۶۰ دقیقه‌ی GitHub
# زنده ماند و push ی بعدی اجرای قبلی را لغو نمی‌کرد. push ی تازه روی همان ref اجرای در حالِ
# انجام را لغو می‌کند.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── مرحله ۱: type-check + build ──
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
          # package-lock.json از ۲۰۲۶-۰۷-۲۹ کامیت شده — کامنتِ قبلی که می‌گفت
          # «هنوز کامیت نشده» کهنه بود. `npm ci` واقعاً قفل را رعایت می‌کند.

      - name: Install dependencies
        # ⚠️ `|| npm install` در ۲۰۲۶-۰۹-۱۰ از هر هشت job برداشته شد (یافته‌ی
        # Red Team، RT-10). `npm ci` عمداً **فقط** lockfile را نصب می‌کند و
        # شکستش تقریباً همیشه یک معنی دارد: «package.json و package-lock.json
        # هم‌خوان نیستند». آن fallback **دقیقاً همان سیگنال** را می‌بلعید و job
        # را روی مجموعه‌ی وابستگیِ حل‌شده‌ی تازه ادامه می‌داد.
        #
        # اثباتِ اجراشده، نه استدلال (یک وابستگی که در lockfile نبود تزریق شد):
        #     npm ci                 →  exit 1  «can only install packages when … in sync»
        #     npm ci || npm install  →  exit 0  ← پوشاند
        #     پس از بازگشت           →  exit 0
        #
        # گیت نمی‌شکست، پس fake-green نبود — ولی «CI سبز شد» معنایش را از دست
        # می‌داد: دیگر یعنی «روی وابستگی‌های پین‌شده سبز شد» نبود، و آن تفاوت
        # فقط روزی معلوم می‌شود که یک وابستگی رفتارش عوض شود.
        #
        # ⚠️ و کامنتِ چند خط بالاتر همین را ادعا می‌کرد («`npm ci` واقعاً قفل را
        # رعایت می‌کند») در حالی که خطِ زیرش خنثی‌اش می‌کرد — سندی که کدِ
        # بغلش نقضش می‌کند، همان کلاسِ «سندی که دروغ می‌گوید» است.
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build (Next.js)
        run: npm run build
        env:
          # متغیرهای ساختگی برای build (مقادیر واقعی در deploy می‌آیند)
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          JWT_SECRET: ci-build-only-secret-not-used-in-prod
          JWT_REFRESH_SECRET: ci-build-only-refresh-secret
          REDIS_URL: redis://localhost:6379
          # لازم چون middleware در production نبودِ آن را خطا می‌دهد؛
          # مقدارِ ساختگی فقط برای عبورِ build است، نه استفاده‌ی واقعی.
          ALLOWED_ORIGINS: https://ci.example.invalid

  # ── مرحله ۲: تست‌ها (با Postgres + Redis واقعی در CI) ──
  test:
    runs-on: ubuntu-latest
    # P0-005: سوئیت در CI ~۳ دقیقه است؛ hang باید ظرفِ دقایق قرمز شود، نه ۳۶۰ دقیقه.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rezervno_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
          # package-lock.json از ۲۰۲۶-۰۷-۲۹ کامیت شده — کامنتِ قبلی که می‌گفت
          # «هنوز کامیت نشده» کهنه بود. `npm ci` واقعاً قفل را رعایت می‌کند.

      - name: Install dependencies
        run: npm ci

      - name: Run migrations
        run: |
          # db push اسکیمای تست را مستقیم از schema.prisma می‌سازد.
          npx prisma db push --skip-generate
          # اجرای SQLهای دستی (prisma/sql) با همان مسیرِ کدِ Docker.
          sh prisma/apply-sql.sh
          # بستنِ شکافِ اسکیمای تست با تولید (defaultِ uuid برای PKها) —
          # دلیلِ کامل و شواهدش در خودِ فایل.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/test-schema-fixups.sql
          # ⚠️ ساکت‌کردنِ لاگِ statementِ Postgres — یافته‌ی واقعیِ ۲۰۲۶-۰۸-۲۰:
          # وقتی تست قرمز شد، GitHub در پایانِ job لاگِ کانتینرِ Postgres را چاپ
          # می‌کند و هر ERROR همراهِ کلِ متنِ STATEMENT است (یک INSERTِ رزرو
          # حدودِ ۲۵۰۰ کاراکتر). این‌ها ~۵۰ خطِ غول‌پیکرِ آخرِ لاگ را می‌گیرند و
          # خلاصه‌ی «✖ failing tests» را از دیدِ tail بیرون می‌اندازند — دقیقاً
          # همان چیزی که تشخیص را چند دور عقب انداخت. خطاها همچنان رخ می‌دهند و
          # تست‌ها همچنان می‌بینندشان؛ فقط دیگر در لاگِ سرور تکرار نمی‌شوند.
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -c "ALTER SYSTEM SET log_min_error_statement = 'panic';" \
            -c "SELECT pg_reload_conf();"
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rezervno_test
          DATABASE_DIRECT_URL: postgresql://test:test@localhost:5432/rezervno_test

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rezervno_test
          REDIS_URL: redis://localhost:6379
          # لازم چون middleware در production نبودِ آن را خطا می‌دهد؛
          # مقدارِ ساختگی فقط برای عبورِ build است، نه استفاده‌ی واقعی.
          ALLOWED_ORIGINS: https://ci.example.invalid
          # حداقل ۳۲ کاراکتر — همان قیدی که jwt.ts در زمانِ اجرا اعمال می‌کند.
          JWT_SECRET: ci-test-secret-at-least-32-chars-long
          JWT_REFRESH_SECRET: ci-test-refresh-secret-at-least-32-chars

  # ── انحرافِ اسکیما: آیا تولید هرچه Prisma لازم دارد را واقعاً دارد؟ ──
  #
  # ⚠️ چرا این job لازم است (شکافی که هیچ تستِ دیگری نمی‌بیند):
  # CI اسکیما را با `prisma db push` می‌سازد ولی تولید با
  # `migrate deploy (0_init) + apply-sql.sh`. اگر کسی فیلدی به schema.prisma
  # اضافه کند و مهاجرتِ SQL ننویسد، `db push` آن را در CI می‌سازد و همه‌ی
  # تست‌ها سبز می‌شوند — ولی تولید آن ستون را ندارد و در زمانِ اجرا می‌شکند.
  # «CI سبز، تولید خراب» دقیقاً همان چیزی است که این job جلویش را می‌گیرد.
  schema-drift:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        working-directory: api
        run: npm ci
      - name: Generate Prisma client
        working-directory: api
        run: npx prisma generate
      - name: Check schema drift
        run: sh tools/check-schema-drift.sh
        env:
          ADMIN_URL: postgresql://test:test@localhost:5432/postgres

  # ── ایمیجِ تولید: آیا اصلاً ساخته می‌شود؟ ──
  #
  # ⚠️ چرا این job لازم است (شکافی که دو ماه باز بود): تا ۲۰۲۶-۰۸-۲۸ هیچ jobی
  # ایمیجِ داکر را نمی‌ساخت. `api/package.json` در ۲۰۲۶-۰۷-۰۸ هوکِ
  # `postinstall: prisma generate` گرفت، و چون Dockerfile در آن لایه هنوز فقط
  # package.json را کپی کرده بود، `npm ci` با «Could not find Prisma Schema»
  # می‌شکست — یعنی **ساختِ ایمیجِ تولید از یک checkoutِ تمیز ناممکن بود** و
  # هر ۱۱ jobِ دیگر سبز می‌ماندند. آرتیفکتی که ساخته نمی‌شود، خراب است و کسی
  # نمی‌فهمد.
  #
  # این job فقط build نمی‌کند؛ دو خاصیتِ سخت‌شدنِ ایمیج را هم **زنده** می‌سنجد،
  # چون خواندنشان از Dockerfile اثبات نیست.
  image-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build production image
        run: docker build -f api/Dockerfile -t rezervno-api:ci api/

      - name: Image runs as non-root
        run: |
          set -e
          U=$(docker run --rm --entrypoint sh rezervno-api:ci -c 'id -u')
          N=$(docker run --rm --entrypoint sh rezervno-api:ci -c 'whoami')
          echo "uid=$U user=$N"
          if [ "$U" = "0" ]; then
            echo "✗ ایمیج به‌صورتِ root اجرا می‌شود"
            exit 1
          fi
          echo "✓ non-root ($N)"

      - name: dumb-init is PID 1
        run: |
          set -e
          docker run -d --name pid1probe rezervno-api:ci sh -c 'sleep 60' >/dev/null
          sleep 3
          P1=$(docker exec pid1probe ps -o pid,args | awk '$1==1 {$1=""; print $0}')
          docker rm -f pid1probe >/dev/null
          echo "PID 1:$P1"
          case "$P1" in
            *dumb-init*) echo "✓ dumb-init به‌عنوانِ PID 1" ;;
            *) echo "✗ PID 1 دست‌ورداشتنِ سیگنال را انجام نمی‌دهد: $P1"; exit 1 ;;
          esac

  # ── مسیرِ بوتِ تولید: آیا کانتینر روی یک DBِ از‌پیش‌موجود اصلاً بالا می‌آید؟ ──
  #
  # ⚠️ چرا این job لازم است (شکافی که هیچ jobِ دیگری نمی‌بیند): سوئیتِ بک‌اند
  # اسکیما را با `db push` می‌سازد و هرگز از مسیرِ واقعیِ بوت
  # (`migrate deploy` + `apply-sql.sh` + شاخه‌ی baseline) عبور نمی‌کند. آن
  # شاخه یک بار در تولید شکسته بود: DBی که جدول داشت ولی تاریخچه‌ی migration
  # نداشت، `migrate deploy` را با P3005 می‌شکست و کانتینر **اصلاً بوت نمی‌شد**
  # — با همه‌ی تست‌ها سبز.
  #
  # این job خودِ `docker-entrypoint.sh` را اجرا می‌کند، نه شبیه‌سازی‌اش. لایه‌ی
  # ایمیج (کاربرِ non-root، dumb-init) را نمی‌سنجد؛ آن نیازِ ساختِ داکر است.
  boot-path:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: rezervno_boot
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # لازم است چون گارد یک probeِ واقعیِ /api/health می‌زند و آن endpoint
      # سلامتِ Redis را هم می‌سنجد — بدونش سرور بالا می‌آید ولی ۵۰۳ می‌دهد.
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
      - name: Install dependencies
        working-directory: api
        run: npm ci
      - name: Generate Prisma client
        working-directory: api
        run: npx prisma generate
      # ⚠️ لازم است: `docker-entrypoint.sh` با `npm run start` تمام می‌شود که
      # به خروجیِ `.next` نیاز دارد. بدونِ این مرحله سرور هرگز بالا نمی‌آید و
      # probeِ سلامتِ گارد شکست می‌خورد — همان‌طور که باید.
      - name: Build (Next.js)
        working-directory: api
        run: npm run build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rezervno_boot
          JWT_SECRET: ci-boot-only-secret-at-least-32-chars
          JWT_REFRESH_SECRET: ci-boot-only-refresh-secret-32-chars
          REDIS_URL: redis://localhost:6379
          ALLOWED_ORIGINS: https://ci.example.invalid

      - name: Boot path (docker-entrypoint.sh on a history-less DB)
        run: sh tools/check-boot-path.sh
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/rezervno_boot
          # لازم چون `npm run start` انتهایِ اسکریپت در حالتِ production
          # نبودِ این‌ها را خطا می‌دهد؛ مقادیر ساختگی‌اند و استفاده نمی‌شوند.
          JWT_SECRET: ci-boot-only-secret-at-least-32-chars
          JWT_REFRESH_SECRET: ci-boot-only-refresh-secret-32-chars
          REDIS_URL: redis://localhost:6379
          ALLOWED_ORIGINS: https://ci.example.invalid

  # ── مرحله ۳: چک امنیتی پایه ──
  security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: api/package-lock.json
          # package-lock.json از ۲۰۲۶-۰۷-۲۹ کامیت شده — کامنتِ قبلی که می‌گفت
          # «هنوز کامیت نشده» کهنه بود. `npm ci` واقعاً قفل را رعایت می‌کند.
      - name: Install dependencies
        run: npm ci
      - name: Audit dependencies
        # ⚠️ فیکسِ حسابرسیِ ۲۰۲۶-۰۷-۱۹ (FINAL-PRODUCTION-AUDIT.md بخشِ ۶): قبلاً اینجا
        # `|| true` بود یعنی حتی یک CVE بحرانی هم build را نمی‌شکست، فقط لاگ می‌شد.
        # حالا سطحِ critical واقعاً بلاک می‌کند؛ high فقط هشدار می‌دهد (نویزِ کمتر، ولی
        # بحرانی دیگر نادیده گرفته نمی‌شود).
        run: |
          npm audit --audit-level=critical
          npm audit --audit-level=high || echo "::warning::یافته‌ی high در dependencyها — بررسی کن (build را نمی‌شکند)"

  # ── قواعدِ Alert (Prometheus) — تا round-20 هیچ jobی این فایل را نمی‌ساخت/نمی‌سنجید ──
  #
  # ⚠️ چرا این job لازم است (بندِ ۵ منشور: هر آرتیفکتِ تحویلی یک jobِ CI می‌خواهد
  # که واقعاً می‌سازدش): observability/alerts.yml یک آرتیفکتِ تحویلی است (Prometheus
  # با mount در docker-compose.observability.yml آن را می‌خواند) ولی تا امروز هیچ
  # jobی آن را حتی parse نمی‌کرد — یک syntax error یا یک نامِ متریکِ اشتباه فقط در
  # زمانِ boot شدنِ خودِ Prometheus کشف می‌شد (وقتی همه‌ی ۱۳/۱۶ قاعده از کار افتاده‌اند).
  # `promtool` روی هاست نصب نیست؛ همان ایمیجِ `prom/prometheus` که
  # docker-compose.observability.yml برایِ خودِ Prometheus استفاده می‌کند (نه ابزارِ
  # تازه‌ی نصب‌شده) هم برای syntax-check و هم برای تستِ واحدِ قواعد استفاده می‌شود.
  #
  # ⚠️ Pin به v3.14.0 (نه :latest، ۲۰۲۶-۰۹-۰۴): همان کلاسِ مشکلِ
  # mcr.microsoft.com/playwright:v1.62.1-noble در jobِ e2e پایین‌تر — یک
  # ایمیجِ tag-نشده یعنی این job می‌تواند بینِ دو اجرا، بدونِ هیچ تغییری در
  # این ریپو، رفتارِ متفاوت بدهد یا حتی breaking changeِ خودِ promtool را
  # بی‌خبر بگیرد. verify شد: در زمانِ pin کردن، digestِ v3.14.0 دقیقاً با
  # digestِ :latest یکی بود (sha256:5ce7540c...) — این یک downgrade نیست.
  observability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: promtool check rules (کلِ alerts.yml — یک قاعده‌ی خراب نباید بقیه را هم پنهان کند)
        run: |
          docker run --rm -v "${{ github.workspace }}/observability:/etc/prometheus:ro" \
            --entrypoint promtool prom/prometheus:v3.14.0 check rules /etc/prometheus/alerts.yml

      # round-20 (A10-PLAN.json:614 escalation): سه قاعده‌ی fail-open تازه
      # (RateLimitRedisFailOpen / BanCheckFailOpen / RateLimitAutoBanSpike) با
      # سری‌های زمانیِ ساختگی — هم سناریوی «باید فایر شود» هم «باید ساکت بماند».
      # قاعده‌ای که هرگز firing دیده نشده گیت نیست (CLAUDE.md بخشِ ۲).
      - name: promtool test rules (سناریوهای فایر/سکوتِ قواعدِ round-20)
        run: |
          docker run --rm -v "${{ github.workspace }}/observability:/etc/prometheus:ro" \
            -w /etc/prometheus --entrypoint promtool prom/prometheus:v3.14.0 \
            test rules alerts.test.yml

      # round-20 (F-C escalation): promtool فقط PromQL/رفتارِ سری‌های ساختگی
      # را می‌سنجد، هرگز کدِ واقعی را نمی‌خواند — یک بازبین با rename کردنِ
      # فقط سمتِ metrics.ts (بدونِ دست‌زدن به alerts.yml) ثابت کرد هر دو
      # promtool سبز می‌مانند درحالی‌که قاعده دیگر به هیچ متریکِ واقعی‌ای گوش
      # نمی‌دهد. این گارد آن سمت را می‌بندد: هر rezervno_* که در یک expr
      # استفاده شده باید در کد (new Counter/Gauge/Histogram) واقعاً اعلام
      # شده باشد، وگرنه exit غیرصفر.
      - name: هر متریکِ استفاده‌شده در alerts.yml در کد اعلام شده؟ (بایندینگِ متریک↔آلارم)
        run: node tools/check-alert-metric-binding.mjs

      # DS-001 (نشستِ Designer): همان تکنیکِ بالا روی جفتِ جدید — ثابت‌هایِ
      # وفاداری در `api/src/lib/loyalty.ts` اعلام می‌شوند و در چند فایلِ فرانت
      # **دوباره تایپ** شده‌اند. هیچ تستی این را نمی‌گیرد: هر دو سمت به‌تنهایی
      # درست‌اند و فقط با هم غلط می‌شوند. زخمش ثبت است — کاربری با ۹۰۰ امتیاز
      # در یک صفحه «نقره‌ای» و در صفحه‌ی دیگر «طلایی» دید.
      #
      # ⚠️ ارقامِ متنِ UI فارسی‌اند. یک گاردِ grepِ لاتین اینجا **سبزِ کاذب**
      # می‌دهد: روی features/loyalty.js صفر hit و روی features/rewards.js چهار
      # hit — خروجی شبیهِ پوشش است و کسی دنبالِ آن صفر نمی‌گردد. گارد قبل از
      # مقایسه normalize می‌کند و رشته‌یِ **کاملِ** رقم را می‌سنجد («۱۰۰»
      # زیررشته‌ی «۱۰۰۰» است — همان خانواده‌ی باگِ /پر|ظرفیت/).
      # ۲۰۲۶-۰۹-۱۰ — بعد از نقصی که مالک خودش دید، نه CI.
      # سه فایل در apps/customer نحو‌شکسته بودند: کامنتِ HTML **داخلِ** یک
      # template literal، با نامِ فایلی در بک‌تیک. آن بک‌تیک رشته را می‌بندد و
      # کلِ ماژول در مرورگر **بی‌صدا** می‌میرد — نه خطای ساخت، نه تستِ قرمز.
      #
      # چرا هیچ چیزِ موجود نمی‌گرفتش: `npm test` فقط `api/` را می‌آزماید، و
      # گاردِ freshnessِ standalone می‌گوید فایل **کهنه نیست** — نه اینکه
      # **پارس می‌شود**. یک artifactِ تروتازه که اجرا نمی‌شود، هر دو را راضی می‌کرد.
      #
      # ⚠️ و درسی که خودِ گارد را شکل داد: `node --check <path>` روی همان سه
      # فایل `EXIT=0` می‌داد، چون فایل را CommonJS فرض می‌کند. این‌ها ماژول‌اند.
      # یک جاروی ۳۱۵ فایلی «صفر خطا» گزارش کرد در حالی که سه‌تا خراب بود. گارد
      # فقط `--input-type=module` روی stdin می‌زند، و اگر دامنه‌اش خالی شود
      # `EXIT=2` می‌دهد («گارد اجرا نشد») نه `0`.
      - name: هر ماژولِ apps/ پارس می‌شود؟ (نحوِ جاوااسکریپتِ اپ‌ها)
        run: node tools/check-app-js-syntax.mjs

      - name: هر ثابتِ وفاداری در UI به تعریفش در کد بسته است؟ (بایندینگِ ثابت↔متن)
        run: node tools/check-loyalty-constant-binding.mjs

      # DS-003 §۴‑۴: `RStatus` در lifecycle.ts تعریف می‌شود و برچسبِ فارسی‌اش در
      # `STATUS_META` جدا نگه داشته می‌شود. هیچ تستی این جفت را نمی‌بیند — هر دو
      # سمت به‌تنهایی درست‌اند. اگر بک‌اند وضعیتی اضافه کند، پنل خطا نمی‌دهد:
      # `STATUS_META[s]?.label || s` بی‌صدا کلیدِ خامِ انگلیسی را به پرسنل نشان
      # می‌دهد — همان شکلِ خرابی که مهمانِ پلاتینیوم را پشتِ میزِ پذیرش با رشته‌ی
      # `platinum` نشان می‌داد.
      #
      # مکملِ `api/tests/`‌ی این دامنه است، نه تکرارش: تست می‌پرسد «آیا فقط یک
      # نگاشت هست؟»، این می‌پرسد «آیا آن یک نگاشت همه را دارد؟». امروز هر دو
      # حالت واقعاً رخ داده بود.
      #
      # ترتیب عمدی بود: گارد تا `93a2ed3` قرمز بود (دو وضعیتِ قدیمی برچسب
      # نداشتند) و تا سبز نشد کاشته نشد — گاردی که سبزشدنش به کارِ انجام‌نشده
      # وابسته باشد، آدم‌ها را یاد می‌دهد دورش بزنند.
      - name: هر وضعیتِ رزرو در پنل برچسبِ فارسی دارد؟ (بایندینگِ وضعیت↔برچسب)
        run: node tools/check-status-label-binding.mjs

      # دستورِ ۰۴۲: ۵۶ از ۱۰۴ ادعایِ `assert.rejects` هویتِ شکست را نمی‌سنجند —
      # ۳۳ بدونِ آرگومانِ دوم، و ۲۳ با یک **رشته** که Node آن را پیامِ خطای خودِ
      # assert می‌خواند، نه انتظار. «ضعیف» یعنی غلط نیست: این‌ها واقعاً ثابت
      # می‌کنند رد شد. نقص باریک‌تر است — سبز می‌مانند اگر **هویتِ** شکست عوض
      # شود، همان شکلِ «P2028 که ۵۰۰ می‌داد».
      #
      # ⚠️ ratchet روی دیف، **نه** sweep روی مخزن. بازنویسیِ ۵۶ ادعا در یک
      # کامیت دیفی می‌سازد که کسی نمی‌تواند بازبینی کند. فقط ادعاهایِ **تازه**
      # سنجیده می‌شوند؛ کدِ موجود هنگامِ تماس تنگ می‌شود.
      #
      # baseِ دیف عمداً دو حالته است، چون کارِ روزمره‌ی این مخزن **کامیتِ
      # مستقیم روی main** است نه PR: گیتی که فقط روی pull_request اجرا شود
      # عملاً هرگز اجرا نمی‌شود. روی push از `event.before` استفاده می‌کنیم و
      # روی PR از baseِ خودش. baseِ resolve‌نشده خطاست، نه سبز.
      # (این گیت عمداً در jobِ جداگانه‌ی `rejects-ratchet` است، نه اینجا —
      #  به یک checkoutِ کامل نیاز دارد و این job عمداً کم‌عمق مانده.)

  # ── مرحله ۴: E2E (Playwright، اپ کاستومر — API کاملاً mock می‌شود، بدونِ نیاز به DB/بک‌اند) ──
  e2e:
    runs-on: ubuntu-latest
    # ایمیجِ رسمیِ Playwright: مرورگرها و کتابخانه‌های سیستمی‌شان از قبل داخلش
    # هستند. چرا این‌طور شد (۲۰۲۶-۰۸-۱۹، بعد از چند اجرای شکست‌خورده):
    #   • دانلودِ ~۱۵۰MB مرورگر از CDNِ Playwright بارها هنگ کرد (یک‌بار ۴۵+ دقیقه)
    #   • بعد از رفعِ آن با کش، گلوگاه به `playwright install-deps` منتقل شد که
    #     زیرِ پوسته apt-get است و آن هم پشتِ‌هم هنگ کرد (آخری تایم‌اوتِ ۱۲ دقیقه‌ای)
    #   • و اندازه‌گیری شد که بدونِ آن کتابخانه‌ها WebKit اصلاً بالا نمی‌آید:
    #     ۸۶ تستِ Chromium سبز، ۴۳ تستِ WebKit قرمز — حتی «lang=fa است؟»
    # با این ایمیج هیچ‌کدام از آن دو مرحله لازم نیست، پس هر دو منبعِ ناپایداری
    # (CDN و apt) از مسیرِ CI حذف می‌شوند. نسخه باید با @playwright/test در
    # e2e/package.json یکی بماند — با ارتقاء، این تگ هم باید به‌روز شود.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    timeout-minutes: 25
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          # e2e/package-lock.json از ۲۰۲۶-۰۸-۱۲ کامیت شده (کامنتِ قبلی که
          # می‌گفت کامیت نشده کهنه بود) — پس کشِ npm واقعاً کار می‌کند.
          cache: 'npm'
          cache-dependency-path: e2e/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run E2E tests
        run: npm test
        env:
          CI: true
          # مرورگرها در مسیرِ خودِ ایمیج‌اند، نه ~/.cache/ms-playwright.
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14

  # ── مرحله ۵: هماهنگیِ دیزاین‌سیستم (بدونِ drift بین shared/ و اپ‌ها) ──
  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check design-system in sync with shared/
        run: sh tools/sync-design-system.sh --check
      # ⚠️ standalone/*.html خروجیِ **تولیدشده‌ی commit‌شده** است، نه منبع. تا امروز
      # هیچ گیتی در CI نداشت و دو بار (۲۰۲۶-۰۸-۲۳ و ۲۰۲۶-۰۸-۲۵) بی‌صدا کهنه شد —
      # یعنی بسته‌ی آفلاینی که README به کاربر می‌گوید بازش کند، باگ‌هایی را تحویل
      # می‌داد که در منبع رفع شده بودند. آرتیفکتی که بی‌صدا کهنه شود از نبودش بدتر
      # است: ظاهرِ به‌روز دارد و کدِ قدیمی می‌دهد.
      - name: Check standalone bundle is regenerated from source
        run: python3 tools/build-standalone.py --check
      # ⚠️ apps/business و apps/company اسکریپتِ **کلاسیک**‌اند: یک `export` سرگردان
      # کلِ فایل را با SyntaxError می‌کشد و همه‌ی توابعش undefined می‌شوند. دقیقاً در
      # PR #77 رخ داد (`export function jsq` وارد format.js شد → fa/esc/jsq مردند →
      # هر دو پنل کاملاً از کار افتادند) و **هر ۹ جابِ CI سبز ماند**، چون پنل‌ها
      # پوششِ E2Eِ رفتاری ندارند. این قدم همان شکاف را می‌بندد.
      - name: Check classic panel scripts parse (business/company)
        run: sh tools/check-classic-scripts.sh
      # ⚠️ tools/check-fonts.py وجود داشت ولی تا ۲۰۲۶-۰۹-۰۴ در CI نبود — یعنی
      # یک عادت بود، نه یک گیت. فونتِ فارسی برای محصولی که مخاطبش در ایران
      # است اختیاری نیست، و این اسکریپت علاوه بر وجودِ فایل، بایت‌های واقعی،
      # جاسازیِ آفلاین، و (بندِ ۵) اینکه CSPِ پروکسی هیچ میزبانِ فونتِ ثالثی
      # را مجاز نکند را هم می‌سنجد.
      - name: Fonts self-hosted (files, bytes, offline embed, and proxy CSP)
        run: python tools/check-fonts.py
      # سندی که دروغ می‌گوید هم‌کلاسِ فیچرِ جعلی است — و این مخزن چهار بار همین را
      # تحویل داده. یکی از آن چهار (آدرسِ مخزن) قبلاً تصحیح شده بود و برگشت، چون
      # تصحیح فقط در تاریخچه‌ی چت زندگی می‌کرد و هیچ گیتی نمی‌دیدش.
      - name: Docs are not stale (repo address, proxy hosts, env vars)
        run: node tools/check-doc-staleness.mjs
      # ⚠️ گاردِ خواهر، ۲۰۲۶-۰۹-۰۹: آن یکی **محتوای** ادعا را می‌سنجد، این یکی
      # **مقصدِ ارجاع** را. `api/vercel.json` در ۰۸-۲۸ حذف شد و یازده سندِ زنده
      # هنوز نامش را می‌بردند؛ هزینه‌اش فرضی نبود — نشستِ CEO دنبالش گشت، نیافت،
      # و در سندی که مالک می‌خواند نوشت «هیچ زمان‌بندی‌ای وجود ندارد». سه ادعا
      # از آن یک جمله باطل شد. سندی که خواننده را به نامِ اشتباه می‌فرستد،
      # همان‌قدر خطرناک است که سندی که دروغ می‌گوید.
      - name: Live docs do not point at files that no longer exist
        run: node tools/check-doc-path-refs.mjs
      # ششمین نمونهی fake-green و اولینی که از خواندنِ کد پیدا نمیشد: یک بایتِ
      # backspace که heredoc تولید کرده بود، یک regex را بیصدا از کار انداخت.
      - name: No invisible control bytes in runnable files
        run: node tools/check-control-bytes.mjs
      # هر عاملی باید منشورِ Gen-Z و قانوننامهی ممیزی را preload کند. عاملی که
      # این دو را ندارد به دستور اعتراض نمیکند و heuristic را هوش برچسب میزند.
      - name: Every agent carries both charter skills
        run: node tools/check-agent-charter.mjs
      # ⚠️ بدترین fake-greenِ ثبت‌شده‌ی این مخزن (۲۰۲۶-۰۸-۱۴): سه فایلِ تست ساخته
      # شدند و در api/tests/_all.runner.mts ایمپورت نشدند، پس `npm test` هرگز
      # اجراشان نکرد — و PRِ مربوطه «۳۷۵/۳۷۵ پاس» اعلام کرد در حالی که عددِ واقعی
      # ۳۵۲ بود. درسی که آن روز ثبت شد یک **کامنت** بود که یک دستورِ شل را تجویز
      # می‌کرد؛ آن دستور حتی اجراشدنی هم نبود (الگویِ `grep -oP`ش با «...» حذف شده
      # بود). تا امروز، ۱۵۷ فایلِ تست فقط با انضباطِ انسانی محافظت می‌شدند.
      - name: Every test file is actually imported by the runner
        run: node tools/check-runner-completeness.mjs
      # ⚠️ ۲۰۲۶-۰۹-۰۸: ۸ فیکسچرِ تستِ integration یک مقدارِ ساعتِ اجرا
      # (`Date.now()`) را با `.toISOString().slice(0, 10)` به کلیدِ UTC تبدیل
      # می‌کردند و به `createReservation` می‌دادند — همان چیزی که
      # `tests/hours.test.mts:148` آن را ممنوع مستند می‌کند، چون نزدیکِ
      # نیمه‌شبِ تهران (UTC+۳:۳۰) روزِ اشتباه را هدف می‌گیرد. سه‌تای آن‌ها
      # گاردِ double-booking بودند.
      - name: No run-clock value turned into a UTC date key in api/tests
        run: node tools/check-run-clock-date-keys.mjs
      # ⚠️ دو بار رخ داده و بارِ اول واقعاً کامیت شد: عاملی که cwdش `api/` است
      # حافظه‌اش را در `api/.claude/agent-memory/` می‌نویسد. الگوهای `.claude/`ِ
      # `.gitignore`ِ ریشه مسیرِ **تودرتو** را نمی‌گیرند، پس آن پوشه untracked
      # ولی ignore‌نشده می‌ماند و یک `git add -A` حافظه‌ی خصوصیِ عامل را واردِ
      # مخزنِ عمومی می‌کند. `.gitignore` جوابش نیست: ریشه‌ی `.claude/` عمداً
      # tracked است (۳۸ فایل)، پس نگه‌داشتنی و ردکردنی هم‌نام‌اند — تشخیص لازم
      # است نه پنهان‌کردن.
      - name: Agent memory lives only at the repo root
        run: node tools/check-agent-memory-location.mjs
      # ⚠️ manifestِ اپِ مشتری دو آیکون وعده می‌داد که **هیچ‌کدام وجود نداشتند**،
      # پس PWA اصلاً نصب نمی‌شد — و تا هفته‌ی انتشار زنده ماند چون هیچ‌چیز خطا
      # نمی‌داد: faviconِ SVG تب را درست نشان می‌داد، sw این دو را precache
      # نمی‌کرد، و buildِ standalone تگ‌ها را حذف می‌کند. یک قابلیتِ غایب هیچ
      # خطایی منتشر نمی‌کند.
      - name: Every manifest icon exists on disk
        run: node tools/check-manifest-assets.mjs
      # ⚠️ وعده‌ی کاربر باید با مکانیزم هم‌داستان بماند (۲۰۲۶-۰۹-۰۷).
      # صفحه‌ی وفاداریِ اپِ مشتری می‌گوید «امتیازهات هیچ‌وقت منقضی نمی‌شن».
      # امروز درست است (PointsLedger ستونِ انقضا ندارد، هیچ کرونی امتیاز کم
      # نمی‌کند)، ولی متن در اپِ وانیلا است و مکانیزم در Prisma/کرون — دو
      # مرجعِ جدا. بدونِ این گارد، افزودنِ انقضا آن جمله را بی‌صدا به دروغ
      # تبدیل می‌کرد و هیچ تستِ موجودی نمی‌گرفتش.
      - name: Loyalty promise matches the mechanism
        run: node tools/check-loyalty-promise.mjs
      # ⚠️ BE-004 — قیدِ C1، و همسایه‌ی بالا نیست: آن یکی **یک جمله** را به
      # مکانیزمش می‌بندد؛ این یکی می‌پرسد آیا هر فیلدی که می‌تواند پول،
      # امتیاز یا اعتبارِ مشتری را کم کند، پیش از کسر به او **داده** می‌شود.
      #
      # این تنها ادعایی است که در MATRIX برای ما REAL و برای چهار رقیب
      # ABSENT است — سلولش «REAL today, UNPINNED» بود و این گارد همان پین است.
      #
      # کدهای خروج عمداً سه‌تاست: ۰ سالم · ۱ نقضِ واقعی · ۲ گارد اجرا نشد
      # (لنگرِ گم‌شده یا فهرستِ اسکنِ خراب). هر سه غیرصفر جز ۰ درست عمل
      # می‌کنند چون این job فقط صفر/غیرصفر را می‌بیند.
      #
      # ⚠️ سبزِ این گارد یعنی «اپ می‌تواند راست بگوید»، نه «ادعا راست است»:
      # رندرِ صادقانه در apps/customer را نمی‌سنجد.
      - name: Diner cost disclosure (C1) — enforced ⇒ exposed
        run: node tools/check-diner-cost-disclosure.mjs
      # ⚠️ XSSِ ذخیره‌شده‌ی واقعی (۲۰۲۶-۰۸-۲۵): `cardHTML` در فیدِ مشتری فیلدِ
      # `cuisine` را بدونِ esc داخلِ innerHTML می‌گذاشت. آن فیلد را صاحبِ رستوران
      # می‌نویسد (فقط `max(50)`، بدونِ پاک‌سازیِ HTML) و از APIِ عمومی به فیدِ
      # همه‌ی مشتری‌ها می‌رسد. این گارد تابعِ واقعی را با بارِ حمله صدا می‌زند و
      # به خروجی نگاه می‌کند — برخلافِ اسکنِ regexِ زیر که فقط **محلِ انتساب**
      # (`el.innerHTML=X`) را می‌بیند و اصلاً نمی‌تواند بفهمد `X` چطور ساخته شده.
      - name: XSS escaping regression (customer render paths)
        run: node tools/xss-escaping-regression.mjs
      # ⚠️ docs/XSS_SINK_AUDIT.md هم آرتیفکتِ تولیدشده‌ی commit‌شده است و از
      # ۲۰۲۶-۰۸-۱۴ بازتولید نشده بود: محتوایش «zero unsafe sinks» می‌گفت در حالی
      # که واقعیت ۶۳ مورد بود — یک سندِ امنیتی که چیزی را تضمین می‌کرد که وجود
      # نداشت. این قدم فقط **تازگی** را چک می‌کند (نه تعداد را) تا دوباره بی‌صدا
      # کهنه نشود؛ کاهشِ آن ۶۳ کارِ جداگانه‌ای است.
      - name: Check XSS sink audit artifact is fresh
        run: node tools/xss-sink-audit.mjs --check

  # ── تازگیِ بسته‌ی آفلاین (standalone/) ────────────────────────────────
  # چرا این جاب اضافه شد (۲۰۲۶-۰۸-۲۶): `CLAUDE.md` §۴b این چک را یک گیتِ
  # *اجباریِ* پیش از پوش اعلام کرده بود، ولی هیچ جابی در CI اجرایش نمی‌کرد —
  # یعنی تنها ضامنش این بود که یک آدم یادش بماند. دقیقاً همین‌طور هم شکست:
  # `standalone/*.html` از ۲۰۲۶-۰۸-۱۸ تا ۲۰۲۶-۰۸-۲۳ کهنه ماند و بسته‌ی
  # آفلاین یک P0 را تحویل می‌داد که در منبع رفع شده بود.
  #
  # گیتی که فقط در یک فایلِ markdown زندگی می‌کند، گیت نیست.
  standalone:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: بسته‌ی آفلاین با منبع هم‌خوان است؟
        run: python tools/build-standalone.py --check

  # ── اپِ SEO (apps/seo · Next.js SSR/ISR، ADR 0001) — build + typecheck + lint ──
  # پروژه‌ی مستقل؛ خرابیِ اینجا به اپ‌های static آسیب نمی‌زند.
  #
  # ⚠️ ۲۰۲۶-۰۹-۰۸ — کامنتِ قبلی می‌گفت «build خودِ Next تایپ‌چک/لینت می‌کند».
  #    نیمه‌ی تایپ‌چک درست است، نیمه‌ی لینت **نبود**. اندازه‌گیری‌شده، نه خوانده:
  #
  #      متغیرِ بی‌استفاده تزریق شد →  npm run build  → exit 0  (هیچ اشاره‌ای)
  #                                    npm run lint   → exit 1  (no-unused-vars)
  #
  #    یعنی این اپ تا امروز **هرگز lint نشده بود** — نه اینجا و نه هیچ‌جای دیگر
  #    (`npm run lint` فقط در جابِ api و landing صدا زده می‌شد). اسکریپتش وجود
  #    داشت و هیچ‌کس اجرایش نمی‌کرد. گامِ صریحِ زیر اضافه شد.
  seo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/seo
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/seo/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Schema unit tests (JSON-LD sanity — پایشِ خودکار)
        run: npm test
      - name: Lint (eslint:recommended — `next build` این را اجرا نمی‌کند)
        run: npm run lint
      - name: Build (Next.js — typecheck + build)
        run: npm run build

  # ── وب‌سایتِ عمومی (apps/landing · Next.js SSR/ISR، ADR 0002) ──
  # اپِ جدا از apps/seo با دامنه، sitemap و canonicalِ مستقلِ خودش.
  # build عمداً بدونِ SITE_API_BASE اجرا می‌شود: باید در «حالتِ امن» (بدونِ API)
  # هم سبز باشد، وگرنه یک قطعیِ API می‌تواند دیپلوی را هم زمین بزند.
  landing:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/landing/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Unit tests (JSON-LD، Markdownِ امن، محتوای پیش‌فرض)
        run: npm test
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build (Next.js)
        run: npm run build

  # ── دروازه‌ی تازگیِ base — «سبزِ CI روی baseِ کهنه دروغ می‌گوید» ──
  #
  # ⚠️ چرا این جاب هست (رخدادِ واقعیِ ۲۰۲۶-۰۸-۲۵): بعد از مرجِ یک PRِ ۲۸۶ فایلی،
  # سه PRِ باز که همگی «۸/۸ سبز» بودند با main تعارض پیدا کردند، و یکی از آن‌ها
  # (#72) با وجودِ CIِ کاملاً سبز، روی baseِ جدید **دو تستش قرمز شد** — چون
  # main فایلی را عوض کرده بود که همان PR هم دستش زده بود. CI هر PR را روی
  # merge-commit می‌سنجد ولی جابِ آن PR ممکن است ساعت‌ها قبل روی baseِ قدیمی
  # اجرا شده باشد؛ نتیجه‌اش یک «سبزِ منقضی» است.
  #
  # این جاب عمداً **سخت‌گیریِ کامل نمی‌کند**: هر بار که main تکان می‌خورد PR را
  # قرمز نمی‌کند (آن کار روی مخزنی به این سرعت فقط نویز می‌سازد و نادیده گرفته
  # می‌شود — همان سرنوشتی که هدرِ check-schema-drift.sh برای دروازه‌های پرنویز
  # توصیف می‌کند). فقط وقتی قرمز می‌شود که **همپوشانیِ واقعیِ فایل** وجود داشته
  # باشد: یعنی main و این PR هر دو یک فایل را از زمانِ merge-base عوض کرده باشند.
  # این دقیقاً همان شرطی است که هر سه شکستِ آن روز را تولید کرد.
  # ── ratchetِ ماچرِ assert.rejects (دستورِ ۰۴۲) ──
  #
  # چرا jobِ جدا و نه یک stepِ کنارِ بقیه‌ی گیت‌ها: این تنها گیتی است که به
  # **تاریخچه** نیاز دارد، نه فقط به درختِ کاری. `observability` عمداً
  # checkoutِ کم‌عمق دارد؛ افزودنِ این step به آن یا کلِ آن job را کند می‌کرد
  # یا — بدتر — با `merge-base` روی کلونِ عمق‌۱ می‌شکست و CI را برای همه قرمز
  # می‌کرد بدونِ اینکه ربطی به کیفیتِ تست داشته باشد.
  #
  # baseِ دیف دو حالته است، چون کارِ روزمره‌ی این مخزن **کامیتِ مستقیم روی
  # main** است نه PR: گیتی که فقط روی pull_request اجرا شود عملاً هرگز اجرا
  # نمی‌شود، و گاردی که اجرا نمی‌شود بدتر از نبودنش است — ظاهرِ پوشش دارد.
  rejects-ratchet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # لازم: بدونِ تاریخچه، merge-base و event.before هیچ‌کدام resolve
          # نمی‌شوند و ابزار عمداً خطا می‌دهد به‌جای سبزِ کاذب.
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: fetch base
        if: github.event_name == 'pull_request'
        run: git fetch --quiet origin "${{ github.base_ref }}"
      - name: ادعاهایِ assert.rejectsِ تازه ماچر دارند؟ (ratchet، نه sweep)
        env:
          REJECTS_BASE: >-
            ${{ github.event_name == 'pull_request'
                && format('origin/{0}', github.base_ref)
                || github.event.before }}
        run: node tools/check-rejects-matcher.mjs

  base-freshness:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # حتماً خودِ HEADِ PR، نه merge-commitِ ساختگیِ GitHub — آن یکی base را
          # از قبل در خود دارد و این چک را همیشه بی‌اثر سبز می‌کند.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: PR و base نباید یک فایل را هم‌زمان عوض کرده باشند
        run: |
          set -e
          BASE="${{ github.base_ref }}"
          git fetch --quiet origin "$BASE"
          MB=$(git merge-base "origin/$BASE" HEAD)
          git diff --name-only "$MB" HEAD          | sort -u > /tmp/pr_files.txt
          git diff --name-only "$MB" "origin/$BASE" | sort -u > /tmp/base_files.txt
          OVERLAP=$(comm -12 /tmp/pr_files.txt /tmp/base_files.txt)
          if [ -n "$OVERLAP" ]; then
            echo "✗ این PR روی baseِ کهنه سنجیده می‌شود و با آن همپوشانیِ فایل دارد."
            echo "  از زمانِ merge-base ($MB)، هم این PR و هم origin/$BASE این فایل‌ها را عوض کرده‌اند:"
            echo ""
            echo "$OVERLAP" | sed 's/^/    /'
            echo ""
            echo "  یعنی سبز شدنِ بقیه‌ی جاب‌ها تضمین نمی‌کند نتیجه‌ی مرج سالم است."
            echo "  رفع:  git fetch origin $BASE && git merge origin/$BASE"
            echo "  بعد تعارض‌ها را حل کن، گیت‌ها را دوباره اجرا کن و push کن."
            exit 1
          fi
          echo "✓ بدونِ همپوشانی — $(wc -l < /tmp/pr_files.txt) فایلِ این PR با تغییراتِ origin/$BASE تداخل ندارد."
